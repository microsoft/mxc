trigger: none
pr: none

name: isosession_$(Date:yyyyMMdd)$(Rev:.r)

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

parameters:
- name: buildGuid
  displayName: Windows OS BNS BuildGuid
  type: string
  default: '00000000-0000-0000-0000-000000000000'
- name: monthId
  displayName: Release month (YYYY.MM)
  type: string
  default: '2026.08'
- name: patch
  displayName: In-month patch number
  type: number
  default: 0
- name: osBranch
  displayName: Windows OS branch recorded in provenance
  type: string
  default: ge_current_directwinpd_sf2
- name: x64DropNameOverride
  displayName: Exact x64 BIN drop name (optional)
  type: string
  default: ' '
- name: arm64DropNameOverride
  displayName: Exact ARM64 BIN drop name (optional)
  type: string
  default: ' '
- name: sourcePipelineRunId
  displayName: Prior IsoSession pipeline run ID used when OS drops have expired
  type: number
  default: 0
- name: signingMode
  displayName: Artifact signing mode
  type: string
  default: test
  values:
  - test
  - production
- name: publishToRestrictedFeed
  displayName: Publish the aggregated SDK NuGet to Azure Artifacts
  type: boolean
  default: false
- name: publishMsiToEsrp
  displayName: Publish signed MSIs to ESRP CDN
  type: boolean
  default: false
- name: publishFeedUrl
  displayName: Azure Artifacts NuGet v3 feed URL for the final SDK package
  type: string
  default: https://pkgs.dev.azure.com/microsoft/Dart/_packaging/Mxc-Azure-Feed/nuget/v3/index.json
- name: enablePromotion
  displayName: Hold this run for approved internal publication
  type: boolean
  default: false
- name: manualValidationNotifyUsers
  displayName: Manual validation notification recipients
  type: string
  default: |
    anisk@microsoft.com
    sodas@microsoft.com
    jwhites@microsoft.com
- name: ESRPInfo
  displayName: ESRP release configuration
  type: object
  default:
    serviceName: 'MXC-ESRP-Auth'
    tenantId: '975f013f-7f24-47e8-a7d3-abc4752bf346'
    azureKeyVaultName: 'KV-MXC-ESRP-Release-West'
    authCertName: 'mxc-esrp-auth-cert'
    signCertName: '37eb2314-6120-4418-93a3-fc4006e6d18a'
    clientId: '37eb2314-6120-4418-93a3-fc4006e6d18a'
    ApproversEmail: 'anisk@microsoft.com, sodas@microsoft.com, jwhites@microsoft.com'
    OwnersEmail: 'bbonaby@microsoft.com, sodas@microsoft.com, jwhites@microsoft.com'

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows

    customBuildTags:
    - ES365AIMigrationTooling

    stages:
    - stage: Build_IsoSession_Artifacts
      displayName: Build IsoSession artifacts
      jobs:
      - template: /.azure-pipelines/templates/IsoSession.Artifacts.Build.Job.yml@self
        parameters:
          archTag: x64
          flavor: amd64fre
          buildGuid: ${{ parameters.buildGuid }}
          monthId: ${{ parameters.monthId }}
          patch: ${{ parameters.patch }}
          osBranch: ${{ parameters.osBranch }}
          dropNameOverride: ${{ parameters.x64DropNameOverride }}
          sourcePipelineRunId: ${{ parameters.sourcePipelineRunId }}
          signingMode: ${{ parameters.signingMode }}
          ESRPInfo: ${{ parameters.ESRPInfo }}

      - template: /.azure-pipelines/templates/IsoSession.Artifacts.Build.Job.yml@self
        parameters:
          archTag: arm64
          flavor: arm64fre
          buildGuid: ${{ parameters.buildGuid }}
          monthId: ${{ parameters.monthId }}
          patch: ${{ parameters.patch }}
          osBranch: ${{ parameters.osBranch }}
          dropNameOverride: ${{ parameters.arm64DropNameOverride }}
          sourcePipelineRunId: ${{ parameters.sourcePipelineRunId }}
          signingMode: ${{ parameters.signingMode }}
          ESRPInfo: ${{ parameters.ESRPInfo }}

      - job: aggregate_isosession_artifacts
        displayName: Aggregate IsoSession release outputs
        dependsOn:
        - build_isosession_x64
        - build_isosession_arm64
        variables:
          stagingDirectory: $(Pipeline.Workspace)/isosession/final
          artifactDirectory: $(Build.SourcesDirectory)/out/isosession/final
          artifactName: isosession-artifacts
        steps:
        - checkout: self

        - task: DownloadPipelineArtifact@2
          displayName: Download x64 installer artifact
          inputs:
            artifact: isosession-installers-x64
            path: $(stagingDirectory)\x64

        - task: DownloadPipelineArtifact@2
          displayName: Download arm64 installer artifact
          inputs:
            artifact: isosession-installers-arm64
            path: $(stagingDirectory)\arm64

        - powershell: |
            $ErrorActionPreference = 'Stop'
            & '$(Build.SourcesDirectory)/.azure-pipelines/scripts/isolation-session/Aggregate-IsoSessionArtifacts.ps1' `
                -X64ArtifactDirectory '$(stagingDirectory)\x64' `
                -Arm64ArtifactDirectory '$(stagingDirectory)\arm64' `
                -OutDir '$(artifactDirectory)' `
                -MonthId '${{ parameters.monthId }}' `
                -Patch ${{ parameters.patch }} `
                -SigningMode '${{ parameters.signingMode }}'
          displayName: Build aggregate NuGet and manifests

        - task: 1ES.PublishPipelineArtifact@1
          displayName: Publish $(artifactName)
          inputs:
            path: $(artifactDirectory)
            artifactName: $(artifactName)

    - ${{ if eq(parameters.enablePromotion, true) }}:
      - stage: Promote_IsoSession_Artifacts
        displayName: Promote approved IsoSession artifacts
        dependsOn: Build_IsoSession_Artifacts
        jobs:
        - job: wait_for_isosession_qualification
          displayName: Wait for supported-SF2 qualification
          pool: server
          timeoutInMinutes: 4320
          steps:
          - task: ManualValidation@0
            timeoutInMinutes: 4200
            inputs:
              notifyUsers: ${{ parameters.manualValidationNotifyUsers }}
              instructions: >-
                Resume only after the exact artifacts from this pipeline run pass
                supported-SF2 VM qualification, including proof that
                IsoSessionCore.dll is absent from the monthly payload and loads
                from System32.
              onTimeout: reject

        - job: validate_and_publish_isosession_sdk
          displayName: Validate and publish the internal SDK package
          dependsOn: wait_for_isosession_qualification
          variables:
            publishDirectory: $(Pipeline.Workspace)/isosession-publish
          steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: Download aggregated IsoSession artifact
            inputs:
              artifact: isosession-artifacts
              path: $(publishDirectory)

          - powershell: |
              $ErrorActionPreference = 'Stop'
              $manifestPath = Join-Path '$(publishDirectory)' 'artifact-manifest.json'
              if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
                  throw "Artifact manifest not found: '$manifestPath'."
              }
              $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
              if (-not $manifest.signing.productionReady) {
                  throw 'Internal promotion requires production-signed artifacts.'
              }
              $packagePath = Join-Path '$(publishDirectory)' $manifest.nuget.packageFileName
              if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
                  throw "Manifest-selected NuGet package not found: '$packagePath'."
              }
              $packageRecord = $manifest.artifacts |
                  Where-Object { $_.relativePath -eq $manifest.nuget.packageFileName } |
                  Select-Object -First 1
              if (-not $packageRecord) {
                  throw 'Artifact manifest does not contain the SDK NuGet hash.'
              }
              $actualHash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -ne $packageRecord.sha256) {
                  throw 'SDK NuGet hash does not match the approved artifact manifest.'
              }
              Write-Host "##vso[task.setvariable variable=packagePath]$packagePath"
              Write-Host "Validated $($manifest.release.canonicalRelease) SDK hash $actualHash."
            displayName: Verify approved SDK bytes

          - ${{ if eq(parameters.publishToRestrictedFeed, true) }}:
            - task: NuGetToolInstaller@1
              displayName: Install NuGet client

            - task: NuGetAuthenticate@1
              displayName: Authenticate Azure Artifacts

            - powershell: |
                $ErrorActionPreference = 'Stop'
                if ([string]::IsNullOrWhiteSpace('${{ parameters.publishFeedUrl }}')) {
                    throw 'publishFeedUrl must be supplied when publishToRestrictedFeed=true.'
                }
                $nugetExe = (Get-Command nuget.exe -ErrorAction Stop).Source
                & '$(Build.SourcesDirectory)/.azure-pipelines/scripts/isolation-session/Publish-IsoSessionNuGet.ps1' `
                    -NuGetExe $nugetExe `
                    -PackagePath '$(packagePath)' `
                    -FeedUrl '${{ parameters.publishFeedUrl }}'
              displayName: Publish the final SDK NuGet

        - ${{ if eq(parameters.publishMsiToEsrp, true) }}:
          - template: /.azure-pipelines/templates/IsoSession.Artifacts.Release.Job.yml@self
            parameters:
              archTag: x64
              monthId: ${{ parameters.monthId }}
              dependsOnJob: validate_and_publish_isosession_sdk
              ESRPInfo: ${{ parameters.ESRPInfo }}

          - template: /.azure-pipelines/templates/IsoSession.Artifacts.Release.Job.yml@self
            parameters:
              archTag: arm64
              monthId: ${{ parameters.monthId }}
              dependsOnJob: validate_and_publish_isosession_sdk
              ESRPInfo: ${{ parameters.ESRPInfo }}
