trigger: none
pr: none

name: isosession_$(Date:yyyyMMdd)$(Rev:.r)

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

parameters:
- name: buildGuid
  displayName: Windows OS BNS BuildGuid
  type: string
  default: '00000000-0000-0000-0000-000000000000'
- name: monthId
  displayName: Release month (YYYY.MM)
  type: string
  default: '2026.08'
- name: patch
  displayName: In-month patch number
  type: number
  default: 0
- name: osBranch
  displayName: Windows OS branch recorded in provenance
  type: string
  default: ge_current_directwinpd_sf2
- name: x64DropNameOverride
  displayName: Exact x64 BIN drop name (optional)
  type: string
  default: ' '
- name: arm64DropNameOverride
  displayName: Exact ARM64 BIN drop name (optional)
  type: string
  default: ' '
- name: publishToRestrictedFeed
  displayName: Publish the aggregated SDK NuGet to Azure Artifacts
  type: boolean
  default: false
- name: publishFeedUrl
  displayName: Azure Artifacts NuGet v3 feed URL for the final SDK package
  type: string
  default: https://pkgs.dev.azure.com/microsoft/Dart/_packaging/Mxc-Azure-Feed/nuget/v3/index.json

variables:
- group: MXC-ESRP-Signing

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows

    customBuildTags:
    - ES365AIMigrationTooling

    stages:
    - stage: Build_IsoSession_Artifacts
      displayName: Build IsoSession artifacts
      jobs:
      - template: templates/IsoSession.Artifacts.Build.Job.yml@self
        parameters:
          archTag: x64
          flavor: amd64fre
          buildGuid: ${{ parameters.buildGuid }}
          monthId: ${{ parameters.monthId }}
          patch: ${{ parameters.patch }}
          osBranch: ${{ parameters.osBranch }}
          dropNameOverride: ${{ parameters.x64DropNameOverride }}
          ESRPInfo:
            serviceName: $(serviceName)
            tenantId: $(tenantId)
            azureKeyVaultName: $(azureKeyVaultName)
            authCertName: $(authCertName)
            signCertName: $(signCertName)
            clientId: $(clientId)

      - template: templates/IsoSession.Artifacts.Build.Job.yml@self
        parameters:
          archTag: arm64
          flavor: arm64fre
          buildGuid: ${{ parameters.buildGuid }}
          monthId: ${{ parameters.monthId }}
          patch: ${{ parameters.patch }}
          osBranch: ${{ parameters.osBranch }}
          dropNameOverride: ${{ parameters.arm64DropNameOverride }}
          ESRPInfo:
            serviceName: $(serviceName)
            tenantId: $(tenantId)
            azureKeyVaultName: $(azureKeyVaultName)
            authCertName: $(authCertName)
            signCertName: $(signCertName)
            clientId: $(clientId)

      - job: aggregate_isosession_artifacts
        displayName: Aggregate IsoSession release outputs
        dependsOn:
        - build_isosession_x64
        - build_isosession_arm64
        variables:
          stagingDirectory: $(Pipeline.Workspace)/isosession/final
          artifactDirectory: $(Build.SourcesDirectory)/out/isosession/final
          artifactName: isosession-artifacts
        steps:
        - checkout: self

        - task: DownloadPipelineArtifact@2
          displayName: Download x64 intermediate artifact
          inputs:
            artifact: isosession-intermediate-x64
            path: $(stagingDirectory)\x64

        - task: DownloadPipelineArtifact@2
          displayName: Download arm64 intermediate artifact
          inputs:
            artifact: isosession-intermediate-arm64
            path: $(stagingDirectory)\arm64

        - powershell: |
            $ErrorActionPreference = 'Stop'
            & '$(Build.SourcesDirectory)/.azure-pipelines/scripts/isolation-session/Aggregate-IsoSessionArtifacts.ps1' `
                -X64ArtifactDirectory '$(stagingDirectory)\x64' `
                -Arm64ArtifactDirectory '$(stagingDirectory)\arm64' `
                -OutDir '$(artifactDirectory)' `
                -MonthId '${{ parameters.monthId }}' `
                -Patch ${{ parameters.patch }} `
                -SigningMode test
          displayName: Build aggregate NuGet and manifests

        - task: 1ES.PublishPipelineArtifact@1
          displayName: Publish $(artifactName)
          inputs:
            path: $(artifactDirectory)
            artifactName: $(artifactName)

    - ${{ if eq(parameters.publishToRestrictedFeed, true) }}:
      - stage: Publish_IsoSession_SDK
        displayName: Publish IsoSession SDK NuGet
        dependsOn: Build_IsoSession_Artifacts
        jobs:
        - job: publish_isosession_sdk
          displayName: Publish restricted SDK package
          steps:
          - checkout: self

          - task: NuGetToolInstaller@1
            displayName: Install NuGet client

          - task: NuGetAuthenticate@1
            displayName: Authenticate Azure Artifacts

          - task: DownloadPipelineArtifact@2
            displayName: Download aggregated IsoSession artifact
            inputs:
              artifact: isosession-artifacts
              path: $(Pipeline.Workspace)\isosession-publish

          - powershell: |
              $ErrorActionPreference = 'Stop'
              if ([string]::IsNullOrWhiteSpace('${{ parameters.publishFeedUrl }}')) {
                  throw 'publishFeedUrl must be supplied when publishToRestrictedFeed=true.'
              }
              $nugetExe = (Get-Command nuget.exe -ErrorAction Stop).Source
              $package = Get-ChildItem -LiteralPath '$(Pipeline.Workspace)\isosession-publish' -File -Filter '*.nupkg' |
                  Select-Object -First 1
              if (-not $package) {
                  throw 'The aggregated artifact does not contain a NuGet package to publish.'
              }
              & '$(Build.SourcesDirectory)/.azure-pipelines/scripts/isolation-session/Publish-IsoSessionNuGet.ps1' `
                  -NuGetExe $nugetExe `
                  -PackagePath $package.FullName `
                  -FeedUrl '${{ parameters.publishFeedUrl }}'
            displayName: Publish the final SDK NuGet
