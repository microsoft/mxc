trigger: none
pr: none
name: $(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

parameters:
- name: npmPackages
  displayName: npm packages to publish
  type: stringList
  default:
  - publish-sdk
  - publish-nvx-runtime
  values:
  - publish-sdk
  - publish-nvx-runtime

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  pipelines:
  # Reference pipeline that created the signed npm artifacts so we can consume them later
  - pipeline: MXC
    source: 'MXC-Official-Build'
    trigger: none
variables:
  - group: MXC-ESRP-Signing

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows
    customBuildTags:
    - ES365AIMigrationTooling

    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows

    stages:
    - stage: Publish_to_NPM
      displayName: 'Publish npm packages'
      variables:
      - name: release_environment
        value: Production
      jobs:
      - job: ReleaseJob
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: MXC
            targetPath: '$(Pipeline.Workspace)/packages'
            artifactName: mxc-npm-sdk-package

        displayName: Publish npm packages
        steps:
        - checkout: self

        - task: PowerShell@2
          displayName: Select npm packages
          inputs:
            targetType: filePath
            filePath: '$(Build.SourcesDirectory)/.azure-pipelines/scripts/select-npm-packages.ps1'
            arguments: >-
              -PayloadDirectory "$(Pipeline.Workspace)\packages"
              -ReleaseDirectory "$(Pipeline.Workspace)\npm-release"
          env:
            MXC_NPM_PACKAGES: ${{ join(',', parameters.npmPackages) }}

        - ${{ if containsValue(parameters.npmPackages, 'publish-sdk') }}:
          - task: EsrpRelease@10
            displayName: Publish SDK package to npm
            inputs:
              connectedservicename: $(serviceName)
              usemanagedidentity: false
              keyvaultname: $(azureKeyVaultName)
              authcertname: $(authCertName)
              signcertname: $(signCertName)
              clientid: $(clientId)
              intent: 'PackageDistribution'
              contenttype: npm
              contentsource: 'Folder'
              folderlocation: '$(Pipeline.Workspace)/npm-release/sdk'
              owners: $(ownersEmail)
              approvers: $(approversEmail)
              waitforreleasecompletion: true
              serviceendpointurl: 'https://api.esrp.microsoft.com'
              mainpublisher: ESRPRELPACMAN
              domaintenantid: $(tenantId)
        - ${{ if containsValue(parameters.npmPackages, 'publish-nvx-runtime') }}:
          - task: EsrpRelease@10
            displayName: Publish NVX runtime package to npm
            inputs:
              connectedservicename: $(serviceName)
              usemanagedidentity: false
              keyvaultname: $(azureKeyVaultName)
              authcertname: $(authCertName)
              signcertname: $(signCertName)
              clientid: $(clientId)
              intent: 'PackageDistribution'
              contenttype: npm
              contentsource: 'Folder'
              folderlocation: '$(Pipeline.Workspace)/npm-release/nvx'
              owners: $(ownersEmail)
              approvers: $(approversEmail)
              waitforreleasecompletion: true
              serviceendpointurl: 'https://api.esrp.microsoft.com'
              mainpublisher: ESRPRELPACMAN
              domaintenantid: $(tenantId)
