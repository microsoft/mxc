trigger: none
name: $(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)
resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  pipelines:
  # Reference pipeline that created the signed npm artifacts so we can consume them later
  - pipeline: MXC
    source: 'MXC-Official-Build'
    trigger: none
variables:
  - group: MXC-ESRP-Signing

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows
    customBuildTags:
    - ES365AIMigrationTooling

    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows

    stages:
    - stage: Publish_to_NPM
      displayName: 'Publish NPM Package'
      variables:
      - name: release_environment
        value: Production
      jobs:
      - job: ReleaseJob
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: MXC
            targetPath: '$(Pipeline.Workspace)/packages'
            artifactName: mxc-npm-sdk-package

        displayName: Publish to NPM
        steps:
        - task: EsrpRelease@10
          displayName: 'Publish to NPM'
          inputs:
            connectedservicename: $(serviceName)
            usemanagedidentity: false
            keyvaultname: $(azureKeyVaultName)
            authcertname: $(authCertName)
            signcertname: $(signCertName)
            clientid: $(clientId)
            intent: 'PackageDistribution'
            contenttype: npm
            contentsource: 'Folder'
            folderlocation: '$(Pipeline.Workspace)/packages'
            owners: $(ownersEmail)
            approvers: $(approversEmail)
            waitforreleasecompletion: true
            serviceendpointurl: 'https://api.esrp.microsoft.com'
            mainpublisher: ESRPRELPACMAN
            domaintenantid: $(tenantId)
