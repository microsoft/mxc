trigger: none
pr: none

name: $(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

parameters:
- name: publishTarget
  displayName: Publish target (NuGet.org is public)
  type: string
  default: Internal Mxc-Azure-Feed
  values:
  - Internal Mxc-Azure-Feed
  - NuGet.org

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  pipelines:
  - pipeline: MXC
    source: MXC-Official-Build
    trigger: none

variables:
- group: MXC-ESRP-Signing

extends:
  ${{ if eq(parameters.publishTarget, 'NuGet.org') }}:
    template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  ${{ else }}:
    template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows
    customBuildTags:
    - ES365AIMigrationTooling

    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows

    stages:
    - stage: Publish_DotNet
      displayName: Publish .NET SDK to ${{ parameters.publishTarget }}
      ${{ if eq(parameters.publishTarget, 'NuGet.org') }}:
        variables:
          release_environment: Production
          NuGetPayloadKind: public
      ${{ else }}:
        variables:
          release_environment: Test
          NuGetPayloadKind: internal

      jobs:
      - job: PublishNugetPackage
        displayName: Publish Microsoft.Mxc.Sdk to ${{ parameters.publishTarget }}
        templateContext:
          type: releaseJob
          isProduction: ${{ eq(parameters.publishTarget, 'NuGet.org') }}
          inputs:
          - input: pipelineArtifact
            pipeline: MXC
            artifactName: mxc-dotnet-sdk-nuget
            targetPath: '$(Pipeline.Workspace)/packages'

        steps:
        - task: PowerShell@2
          displayName: Select matching NuGet packages
          inputs:
            targetType: inline
            script: |
              $ErrorActionPreference = 'Stop'
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $payloadDirectory = "$(Pipeline.Workspace)\packages\$(NuGetPayloadKind)"
              $packages = @(
                @{ Name = 'sdk'; Id = 'Microsoft.Mxc.Sdk'; Directory = $payloadDirectory }
                @{ Name = 'nvx'; Id = 'Microsoft.Mxc.Sdk.Nvx.Runtime'; Directory = (Join-Path $payloadDirectory 'nvx') }
              )
              foreach ($package in $packages) {
                $files = @(Get-ChildItem -LiteralPath $package.Directory -Filter "$($package.Id).*.nupkg" -File -ErrorAction Stop)
                if ($files.Count -ne 1) {
                  throw "Expected exactly one $($package.Id) package in $($package.Directory), found $($files.Count)"
                }
                $package.File = $files[0]
                $archive = [System.IO.Compression.ZipFile]::OpenRead($package.File.FullName)
                try {
                  $nuspecs = @($archive.Entries | Where-Object { $_.FullName -match '^[^/\\]+\.nuspec$' })
                  if ($nuspecs.Count -ne 1) { throw "Expected exactly one root nuspec in $($package.File.Name)" }
                  $reader = [System.IO.StreamReader]::new($nuspecs[0].Open())
                  try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
                  $ids = @($nuspec.SelectNodes("/*[local-name()='package']/*[local-name()='metadata']/*[local-name()='id']"))
                  $versions = @($nuspec.SelectNodes("/*[local-name()='package']/*[local-name()='metadata']/*[local-name()='version']"))
                  if ($ids.Count -ne 1 -or $versions.Count -ne 1 -or $ids[0].InnerText -cne $package.Id) {
                    throw "Invalid package identity in $($package.File.Name)"
                  }
                  $package.Version = $versions[0].InnerText
                  if ($package.Version -cnotmatch '^[0-9][0-9A-Za-z.+-]*$' -or
                      $package.File.Name -cne "$($package.Id).$($package.Version).nupkg") {
                    throw "Invalid package version or filename in $($package.File.Name)"
                  }
                } finally {
                  $archive.Dispose()
                }
              }
              if ($packages[0].Version -cne $packages[1].Version) {
                throw "SDK and NVX runtime package versions do not match"
              }
              foreach ($package in $packages) {
                $releaseDirectory = Join-Path "$(Pipeline.Workspace)\nuget-release" $package.Name
                New-Item -ItemType Directory -Path $releaseDirectory -ErrorAction Stop | Out-Null
                $releasePath = Join-Path $releaseDirectory $package.File.Name
                Copy-Item -LiteralPath $package.File.FullName -Destination $releasePath -ErrorAction Stop
                Write-Host "##vso[task.setvariable variable=NuGetPackagePath_$($package.Name)]$releasePath"
              }

        - ${{ if eq(parameters.publishTarget, 'NuGet.org') }}:
          - ${{ each package in split('sdk,nvx', ',') }}:
            - task: EsrpRelease@14
              displayName: Publish ${{ package }} package to NuGet.org
              inputs:
                connectedservicename: $(serviceName)
                usemanagedidentity: false
                keyvaultname: $(azureKeyVaultName)
                authcertname: $(authCertName)
                signcertname: $(signCertName)
                clientid: $(clientId)
                intent: 'PackageDistribution'
                contenttype: NuGet
                organizationname: $(NuGetOrganizationName)
                contentsource: 'Folder'
                folderlocation: '$(Pipeline.Workspace)/nuget-release/${{ package }}'
                owners: $(ownersEmail)
                approvers: $(approversEmail)
                waitforreleasecompletion: true
                serviceendpointurl: 'https://api.esrp.microsoft.com/'
                mainpublisher: ESRPRELPACMAN
                domaintenantid: $(tenantId)

        - ${{ else }}:
          - ${{ each package in split('sdk,nvx', ',') }}:
            - task: 1ES.PublishNuget@1
              displayName: Push ${{ package }} package to Mxc-Azure-Feed
              inputs:
                packagesToPush: '$(NuGetPackagePath_${{ package }})'
                packageParentPath: '$(Pipeline.Workspace)/nuget-release/${{ package }}'
                nuGetFeedType: internal
                publishVstsFeed: 'Dart/Mxc-Azure-Feed'
