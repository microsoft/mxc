trigger: none
pr: none

name: $(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

parameters:
- name: publishTarget
  displayName: Publish target (NuGet.org is public)
  type: string
  default: Internal Mxc-Azure-Feed
  values:
  - Internal Mxc-Azure-Feed
  - NuGet.org
- name: nugetPackages
  displayName: NuGet packages to publish
  type: stringList
  default:
  - publish-sdk
  - publish-nvx-runtime
  values:
  - publish-sdk
  - publish-nvx-runtime

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  pipelines:
  - pipeline: MXC
    source: MXC-Official-Build
    trigger: none

variables:
- group: MXC-ESRP-Signing

extends:
  ${{ if eq(parameters.publishTarget, 'NuGet.org') }}:
    template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  ${{ else }}:
    template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows
    customBuildTags:
    - ES365AIMigrationTooling

    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows

    stages:
    - stage: Publish_DotNet
      displayName: Publish .NET SDK to ${{ parameters.publishTarget }}
      ${{ if eq(parameters.publishTarget, 'NuGet.org') }}:
        variables:
          release_environment: Production
          NuGetPayloadKind: public
      ${{ else }}:
        variables:
          release_environment: Test
          NuGetPayloadKind: internal

      jobs:
      - job: PublishNugetPackage
        displayName: Publish Microsoft.Mxc.Sdk to ${{ parameters.publishTarget }}
        templateContext:
          type: releaseJob
          isProduction: ${{ eq(parameters.publishTarget, 'NuGet.org') }}
          inputs:
          - input: pipelineArtifact
            pipeline: MXC
            artifactName: mxc-dotnet-sdk-nuget
            targetPath: '$(Pipeline.Workspace)/packages'

        steps:
        - task: PowerShell@2
          displayName: Select NuGet packages
          inputs:
            targetType: filePath
            filePath: '$(Pipeline.Workspace)/packages/select-dotnet-nuget-packages.ps1'
            arguments: >-
              -PayloadDirectory "$(Pipeline.Workspace)\packages\$(NuGetPayloadKind)"
              -ReleaseDirectory "$(Pipeline.Workspace)\nuget-release"
          env:
            MXC_NUGET_PACKAGES: ${{ join(',', parameters.nugetPackages) }}

        - ${{ if eq(parameters.publishTarget, 'NuGet.org') }}:
          - ${{ if containsValue(parameters.nugetPackages, 'publish-sdk') }}:
            - task: EsrpRelease@14
              displayName: Publish SDK package to NuGet.org
              inputs:
                connectedservicename: $(serviceName)
                usemanagedidentity: false
                keyvaultname: $(azureKeyVaultName)
                authcertname: $(authCertName)
                signcertname: $(signCertName)
                clientid: $(clientId)
                intent: 'PackageDistribution'
                contenttype: NuGet
                organizationname: $(NuGetOrganizationName)
                contentsource: 'Folder'
                folderlocation: '$(Pipeline.Workspace)/nuget-release/sdk'
                owners: $(ownersEmail)
                approvers: $(approversEmail)
                waitforreleasecompletion: true
                serviceendpointurl: 'https://api.esrp.microsoft.com/'
                mainpublisher: ESRPRELPACMAN
                domaintenantid: $(tenantId)
          - ${{ if containsValue(parameters.nugetPackages, 'publish-nvx-runtime') }}:
            - task: EsrpRelease@14
              displayName: Publish NVX runtime package to NuGet.org
              inputs:
                connectedservicename: $(serviceName)
                usemanagedidentity: false
                keyvaultname: $(azureKeyVaultName)
                authcertname: $(authCertName)
                signcertname: $(signCertName)
                clientid: $(clientId)
                intent: 'PackageDistribution'
                contenttype: NuGet
                organizationname: $(NuGetOrganizationName)
                contentsource: 'Folder'
                folderlocation: '$(Pipeline.Workspace)/nuget-release/nvx'
                owners: $(ownersEmail)
                approvers: $(approversEmail)
                waitforreleasecompletion: true
                serviceendpointurl: 'https://api.esrp.microsoft.com/'
                mainpublisher: ESRPRELPACMAN
                domaintenantid: $(tenantId)

        - ${{ else }}:
          - ${{ if containsValue(parameters.nugetPackages, 'publish-sdk') }}:
            - task: 1ES.PublishNuget@1
              displayName: Push SDK package to Mxc-Azure-Feed
              inputs:
                packagesToPush: '$(NuGetPackagePath_sdk)'
                packageParentPath: '$(Pipeline.Workspace)/nuget-release/sdk'
                nuGetFeedType: internal
                publishVstsFeed: 'Dart/Mxc-Azure-Feed'
          - ${{ if containsValue(parameters.nugetPackages, 'publish-nvx-runtime') }}:
            - task: 1ES.PublishNuget@1
              displayName: Push NVX runtime package to Mxc-Azure-Feed
              inputs:
                packagesToPush: '$(NuGetPackagePath_nvx)'
                packageParentPath: '$(Pipeline.Workspace)/nuget-release/nvx'
                nuGetFeedType: internal
                publishVstsFeed: 'Dart/Mxc-Azure-Feed'
