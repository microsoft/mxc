# Seeds the public shine-oss MxcDependencies feeds with the dependencies pinned
# by src/Cargo.lock and the IsolationSession SDK package constants.
#
# This pipeline cannot be run with `/azp run`; run it manually from shine-oss
# (Run pipeline at https://dev.azure.com/shine-oss/mxc/_build?definitionId=33).

parameters:
  - name: prNumber
    displayName: GitHub PR number to seed from
    type: string

trigger: none
pr: none

jobs:
  - job: fetch_dependencies
    displayName: Fetch and cache dependencies
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self
        persistCredentials: true

      # Overlay only dependency-pin data from the PR head onto the trusted
      # checkout. Neither Cargo nor the Rust source is executed: the script
      # parses Cargo.lock and three string constants from the build helper.
      # Review both files before running this manually triggered pipeline.
      - script: |
          set -euo pipefail
          git fetch origin "pull/${{ parameters.prNumber }}/head"
          git checkout FETCH_HEAD -- \
            src/Cargo.lock \
            src/mxc-sdk/build/build_mxc_build_common.rs
          echo "Overlaid dependency pins from PR #${{ parameters.prNumber }}"
        displayName: Overlay dependency pins from PR

      - script: python3 .azure-pipelines/scripts/seed_feed.py
        displayName: Seed the MxcDependencies feed from Cargo.lock
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - task: NuGetAuthenticate@1
        displayName: Authenticate to MxcDependencies

      - script: python3 .azure-pipelines/scripts/seed_feed.py --nuget-only
        displayName: Seed the IsolationSession SDK package into MxcDependencies
