parameters:
- name: nugetPackageVariants
  type: object
  default:
  - displayName: NuGet.org
    version: $(PackageVersion)
  - displayName: internal testing
    version: $(InternalPackageVersion)

jobs:
- job: validate_dotnet_pipeline
  displayName: Validate .NET pipeline
  pool:
    name: Azure-Pipelines-1ESPT-ExDShared
    image: windows-2022
    os: windows
  variables:
    sdkProject: $(Build.SourcesDirectory)\sdk\dotnet\Microsoft.Mxc.Sdk\Microsoft.Mxc.Sdk.csproj
    packageRoot: $(Build.SourcesDirectory)\out\dotnet-validation-package
    packageOutput: $(Build.SourcesDirectory)\out\dotnet-validation-nuget

  steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: Use .NET SDK 10
    inputs:
      packageType: sdk
      version: 10.0.x

  - task: PowerShell@2
    displayName: Verify .NET toolchain
    inputs:
      targetType: inline
      script: |
        $sdkVersion = (& dotnet --version).Trim()
        if ($sdkVersion -notmatch '^10\.0\.') {
          throw "Expected .NET SDK 10, found '$sdkVersion'"
        }

        $runtimes = @(& dotnet --list-runtimes)
        if (-not ($runtimes -match '^Microsoft\.NETCore\.App 10\.0\.')) {
          throw ".NET 10 runtime is not installed:`n$($runtimes -join "`n")"
        }

  - task: PowerShell@2
    displayName: Set package versions
    inputs:
      filePath: $(Build.SourcesDirectory)\.azure-pipelines\scripts\set-dotnet-package-versions.ps1
      arguments: >-
        -ProjectPath "$(sdkProject)"
        -BuildId "$(Build.BuildId)"

  - task: NuGetToolInstaller@1
    displayName: Install NuGet

  - task: PowerShell@2
    displayName: Stage synthetic NuGet inputs
    inputs:
      targetType: inline
      script: |
        $root = "$(packageRoot)"
        Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue

        $files = @(
          'managed\net8.0\Microsoft.Mxc.Sdk.dll',
          'managed\net8.0\Microsoft.Mxc.Sdk.pdb',
          'managed\net10.0\Microsoft.Mxc.Sdk.dll',
          'managed\net10.0\Microsoft.Mxc.Sdk.pdb',
          'runtimes\win-x64\native\mxc_ffi.dll',
          'runtimes\win-x64\native\wxc-wslc-daemon.exe',
          'runtimes\win-x64\native\wslcsdk.dll',
          'runtimes\win-arm64\native\mxc_ffi.dll',
          'runtimes\win-arm64\native\wxc-wslc-daemon.exe',
          'runtimes\win-arm64\native\wslcsdk.dll',
          'runtimes\linux-x64\native\libmxc_ffi.so',
          'runtimes\linux-arm64\native\libmxc_ffi.so',
          'runtimes\osx-arm64\native\libmxc_ffi.dylib'
        )
        . "$(Build.SourcesDirectory)\.azure-pipelines\scripts\get-nvx-bundle-inventory.ps1"
        $files += @(Get-NvxBundleInventory | ForEach-Object { "nvx\$_" })

        foreach ($relativePath in $files) {
          $path = Join-Path $root $relativePath
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $path) | Out-Null
          [System.IO.File]::WriteAllBytes($path, [byte[]](0x4d))
        }

  - ${{ each package in parameters.nugetPackageVariants }}:
    - task: NuGetCommand@2
      displayName: Validate ${{ package.displayName }} package creation
      inputs:
        command: pack
        packagesToPack: $(Build.SourcesDirectory)\sdk\dotnet\Microsoft.Mxc.Sdk.Package\Microsoft.Mxc.Sdk.nuspec
        packDestination: $(packageOutput)
        versioningScheme: off
        buildProperties: version=${{ package.version }};managedOutput=$(packageRoot)\managed;x64Native=$(packageRoot)\runtimes\win-x64\native;arm64Native=$(packageRoot)\runtimes\win-arm64\native;linuxX64Native=$(packageRoot)\runtimes\linux-x64\native;linuxArm64Native=$(packageRoot)\runtimes\linux-arm64\native;macArm64Native=$(packageRoot)\runtimes\osx-arm64\native;repositoryRoot=$(Build.SourcesDirectory)

    - task: NuGetCommand@2
      displayName: Pack NVX runtime for ${{ package.displayName }}
      inputs:
        command: pack
        packagesToPack: $(Build.SourcesDirectory)\sdk\dotnet\Microsoft.Mxc.Sdk.Nvx.Runtime.Package\Microsoft.Mxc.Sdk.Nvx.Runtime.nuspec
        packDestination: $(packageOutput)
        versioningScheme: off
        buildProperties: version=${{ package.version }};nvxRuntime=$(packageRoot)\nvx;repositoryRoot=$(Build.SourcesDirectory)

    - task: PowerShell@2
      displayName: Verify ${{ package.displayName }} NVX runtime package
      inputs:
        filePath: $(Build.SourcesDirectory)\.azure-pipelines\scripts\verify-dotnet-nuget-package.ps1
        arguments: >-
          -PackagePath "$(packageOutput)\Microsoft.Mxc.Sdk.Nvx.Runtime.${{ package.version }}.nupkg"
          -VerifyNvxRuntime

    - task: PowerShell@2
      displayName: Reject incomplete ${{ package.displayName }} NVX runtime package
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $source = "$(packageOutput)\Microsoft.Mxc.Sdk.Nvx.Runtime.${{ package.version }}.nupkg"
          $bad = "$(packageOutput)\incomplete-${{ package.version }}.nupkg"
          Copy-Item -LiteralPath $source -Destination $bad
          try {
            $archive = [IO.Compression.ZipFile]::Open($bad, [IO.Compression.ZipArchiveMode]::Update)
            try {
              $entry = $archive.GetEntry('runtimes/win-x64/aci-edge-sandboxes/guest/vmlinux.config')
              if ($null -eq $entry) { throw 'Expected vmlinux.config in the original package.' }
              $entry.Delete()
            } finally { $archive.Dispose() }
            $rejected = $false
            try {
              & "$(Build.SourcesDirectory)\.azure-pipelines\scripts\verify-dotnet-nuget-package.ps1" -PackagePath $bad -VerifyNvxRuntime
            } catch {
              if ($_.Exception.Message -notmatch 'guest/vmlinux\.config') { throw }
              $rejected = $true
            }
            if (-not $rejected) { throw 'Verifier accepted a package missing guest/vmlinux.config.' }
          } finally { Remove-Item -LiteralPath $bad -Force }

    - task: PowerShell@2
      displayName: Verify ${{ package.displayName }} package contract
      inputs:
        filePath: $(Build.SourcesDirectory)\.azure-pipelines\scripts\verify-dotnet-nuget-package.ps1
        arguments: >-
          -PackagePath "$(packageOutput)\Microsoft.Mxc.Sdk.${{ package.version }}.nupkg"
          -RequireWslc
