parameters:
- name: archTag
  type: string
- name: flavor
  type: string
- name: buildGuid
  type: string
- name: monthId
  type: string
- name: patch
  type: number
- name: osBranch
  type: string
- name: dropNameOverride
  type: string
  default: ' '
- name: dropServiceUri
  type: string
  default: https://microsoft.artifacts.visualstudio.com/DefaultCollection
- name: ESRPInfo
  type: object
  default:
    serviceName: ''
    tenantId: ''
    azureKeyVaultName: ''
    authCertName: ''
    signCertName: ''
    clientId: ''
    ApproversEmail: ''
    OwnersEmail: ''

jobs:
- job: build_isosession_${{ parameters.archTag }}
  displayName: Build IsoSession inputs (${{ parameters.archTag }})
  timeoutInMinutes: 90
  variables:
    workDirectory: $(Pipeline.Workspace)/isosession/${{ parameters.archTag }}
    dropClientDirectory: $(workDirectory)/drop-client
    payloadDirectory: $(workDirectory)/payload
    payloadBinDirectory: $(payloadDirectory)/bin/${{ parameters.archTag }}
    installerOutputDirectory: $(workDirectory)/installer
    burnSigningDirectory: $(workDirectory)/burn-signing
    artifactDirectory: $(Build.SourcesDirectory)/out/isosession/${{ parameters.archTag }}
    artifactName: isosession-installers-${{ parameters.archTag }}

  steps:
  - checkout: self

  - powershell: |
      $ErrorActionPreference = 'Stop'
      $configPath =
          '$(Build.SourcesDirectory)\packaging\isolation-session\installer\NuGet.Config'
      $config = @'
      <?xml version="1.0" encoding="utf-8"?>
      <configuration>
        <packageSources>
          <clear />
          <add
            key="Dart_PublicPackages"
            value="https://pkgs.dev.azure.com/microsoft/Dart/_packaging/Dart_PublicPackages/nuget/v3/index.json" />
        </packageSources>
      </configuration>
      '@
      Set-Content -LiteralPath $configPath -Value $config -Encoding UTF8
    displayName: Configure authenticated NuGet source

  - task: NuGetAuthenticate@1
    displayName: Authenticate NuGet source

  - powershell: |
      $ErrorActionPreference = 'Stop'
      if ('${{ parameters.buildGuid }}' -eq '00000000-0000-0000-0000-000000000000') {
          throw 'A Windows OS BNS BuildGuid must be supplied.'
      }
      [void][guid]::Parse('${{ parameters.buildGuid }}')
      $releaseHelper = '$(Build.SourcesDirectory)\packaging\isolation-session\common\Get-IsoSessionReleaseInfo.ps1'
      $release = & $releaseHelper -MonthId '${{ parameters.monthId }}' -Patch ${{ parameters.patch }}
      if ('${{ parameters.archTag }}' -eq 'x64' -and '${{ parameters.flavor }}' -ne 'amd64fre') {
          throw 'x64 must use the amd64fre flavor.'
      }
      if ('${{ parameters.archTag }}' -eq 'arm64' -and '${{ parameters.flavor }}' -ne 'arm64fre') {
          throw 'arm64 must use the arm64fre flavor.'
      }
      New-Item -ItemType Directory -Force -Path '$(workDirectory)' | Out-Null
      $release | ConvertTo-Json -Depth 10 |
          Set-Content -LiteralPath '$(workDirectory)\release-contract.json' -Encoding UTF8
      Write-Host "Validated release $($release.canonicalRelease) -> MSI $($release.msiVersion)"
    displayName: Validate pipeline parameters and write release contract

  - powershell: |
      $ErrorActionPreference = 'Stop'
      $serviceRoot = (
          New-Object System.Uri('${{ parameters.dropServiceUri }}')
      ).GetLeftPart([System.UriPartial]::Authority)
      $zipPath = Join-Path '$(dropClientDirectory)' 'drop.zip'
      $extractPath = Join-Path '$(dropClientDirectory)' 'client'
      New-Item -ItemType Directory -Force -Path '$(dropClientDirectory)' | Out-Null
      if ([string]::IsNullOrWhiteSpace($env:SYSTEM_ACCESSTOKEN)) {
          throw 'SYSTEM_ACCESSTOKEN is required to download drop.exe.'
      }
      $basicToken = [Convert]::ToBase64String(
          [Text.Encoding]::ASCII.GetBytes(":$env:SYSTEM_ACCESSTOKEN"))
      Invoke-WebRequest `
          -Uri "$serviceRoot/_apis/drop/client/exe" `
          -Headers @{ Authorization = "Basic $basicToken" } `
          -OutFile $zipPath `
          -UseBasicParsing
      Add-Type -AssemblyName System.IO.Compression.FileSystem
      [System.IO.Compression.ZipFile]::ExtractToDirectory($zipPath, $extractPath)
      $dropExe = Get-ChildItem -LiteralPath $extractPath -Recurse -File -Filter drop.exe |
          Select-Object -First 1
      if (-not $dropExe) {
          throw 'drop.exe was not found in the downloaded client package.'
      }
      Write-Host "##vso[task.setvariable variable=dropExe]$($dropExe.FullName)"
    displayName: Bootstrap drop.exe
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - powershell: |
      $ErrorActionPreference = 'Stop'
      $override = '${{ parameters.dropNameOverride }}'.Trim()
      & '$(Build.SourcesDirectory)/.azure-pipelines/scripts/isolation-session/Get-IsoSessionOsBinaries.ps1' `
          -DropExe '$(dropExe)' `
          -DropServiceUri '${{ parameters.dropServiceUri }}' `
          -BuildGuid '${{ parameters.buildGuid }}' `
          -ArchTag '${{ parameters.archTag }}' `
          -OutDir '$(payloadDirectory)' `
          -DropNameOverride $override `
          -OsBranch '${{ parameters.osBranch }}'
    displayName: Download filtered OS IsoSession payload
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - task: EsrpCodeSigning@5
    displayName: Test sign IsoSession payload
    inputs:
      ConnectedServiceName: ${{ parameters.ESRPInfo.serviceName }}
      AppRegistrationClientId: ${{ parameters.ESRPInfo.clientId }}
      AppRegistrationTenantId: ${{ parameters.ESRPInfo.tenantId }}
      AuthAKVName: ${{ parameters.ESRPInfo.azureKeyVaultName }}
      AuthCertName: ${{ parameters.ESRPInfo.authCertName }}
      AuthSignCertName: ${{ parameters.ESRPInfo.signCertName }}
      FolderPath: $(payloadBinDirectory)
      Pattern: |
        **/*.dll
        **/*.exe
      UseMinimatch: true
      signConfigType: inlineSignParams
      inlineOperation: >-
        [
          {
            "KeyCode": "CP-230072",
            "OperationCode": "SigntoolSign",
            "ToolName": "sign",
            "ToolVersion": "1.0",
            "Parameters": {
              "OpusName": "Microsoft",
              "OpusInfo": "https://www.microsoft.com",
              "FileDigest": "/fd SHA256",
              "PageHash": "/NPH",
              "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
            }
          },
          {
            "KeyCode": "CP-230012",
            "OperationCode": "SigntoolVerify",
            "ToolName": "sign",
            "ToolVersion": "1.0",
            "Parameters": {}
          }
        ]

  - powershell: |
      $ErrorActionPreference = 'Stop'
      & '$(Build.SourcesDirectory)/packaging/isolation-session/installer/makeinstaller.ps1' `
          -Arch '${{ parameters.archTag }}' `
          -BinDir '$(payloadBinDirectory)' `
          -MonthId '${{ parameters.monthId }}' `
          -Patch ${{ parameters.patch }} `
          -OutDir '$(installerOutputDirectory)' `
          -MsiOnly
      if ($LASTEXITCODE -ne 0) {
          throw "MSI build failed with exit code $LASTEXITCODE."
      }
    displayName: Build native MSI

  - task: EsrpCodeSigning@5
    displayName: Test sign MSI
    inputs:
      ConnectedServiceName: ${{ parameters.ESRPInfo.serviceName }}
      AppRegistrationClientId: ${{ parameters.ESRPInfo.clientId }}
      AppRegistrationTenantId: ${{ parameters.ESRPInfo.tenantId }}
      AuthAKVName: ${{ parameters.ESRPInfo.azureKeyVaultName }}
      AuthCertName: ${{ parameters.ESRPInfo.authCertName }}
      AuthSignCertName: ${{ parameters.ESRPInfo.signCertName }}
      FolderPath: $(installerOutputDirectory)
      Pattern: '**/*.msi'
      UseMinimatch: true
      signConfigType: inlineSignParams
      inlineOperation: >-
        [
          {
            "KeyCode": "CP-230072",
            "OperationCode": "SigntoolSign",
            "ToolName": "sign",
            "ToolVersion": "1.0",
            "Parameters": {
              "OpusName": "Microsoft",
              "OpusInfo": "https://www.microsoft.com",
              "FileDigest": "/fd SHA256",
              "PageHash": "/NPH",
              "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
            }
          },
          {
            "KeyCode": "CP-230012",
            "OperationCode": "SigntoolVerify",
            "ToolName": "sign",
            "ToolVersion": "1.0",
            "Parameters": {}
          }
        ]

  - powershell: |
      $ErrorActionPreference = 'Stop'
      & '$(Build.SourcesDirectory)/packaging/isolation-session/installer/makeinstaller.ps1' `
          -Arch '${{ parameters.archTag }}' `
          -BinDir '$(payloadBinDirectory)' `
          -MonthId '${{ parameters.monthId }}' `
          -Patch ${{ parameters.patch }} `
          -OutDir '$(installerOutputDirectory)' `
          -BundleOnly
      if ($LASTEXITCODE -ne 0) {
          throw "Installer bundle build failed with exit code $LASTEXITCODE."
      }
    displayName: Build installer EXE with signed MSI

  - powershell: |
      $ErrorActionPreference = 'Stop'
      $packagesRoot = if ($env:NUGET_PACKAGES) {
          $env:NUGET_PACKAGES
      } else {
          Join-Path $env:USERPROFILE '.nuget\packages'
      }
      $wixExe = Join-Path $packagesRoot 'wixtoolset.sdk\5.0.2\tools\net472\x64\wix.exe'
      if (-not (Test-Path -LiteralPath $wixExe -PathType Leaf)) {
          throw "WiX executable not found at '$wixExe'."
      }

      $month = '${{ parameters.monthId }}'.Replace('.', '_')
      $bundlePath = Join-Path '$(installerOutputDirectory)' `
          "IsoSessionSetup_${month}_${{ parameters.archTag }}.exe"
      $enginePath = Join-Path '$(burnSigningDirectory)' `
          "IsoSessionBurnEngine_${{ parameters.archTag }}.exe"
      New-Item -ItemType Directory -Force -Path '$(burnSigningDirectory)' | Out-Null

      & $wixExe burn detach $bundlePath -engine $enginePath
      if ($LASTEXITCODE -ne 0) {
          throw "Detaching the Burn engine failed with exit code $LASTEXITCODE."
      }
    displayName: Detach Burn engine for signing

  - task: EsrpCodeSigning@5
    displayName: Test sign Burn engine
    inputs:
      ConnectedServiceName: ${{ parameters.ESRPInfo.serviceName }}
      AppRegistrationClientId: ${{ parameters.ESRPInfo.clientId }}
      AppRegistrationTenantId: ${{ parameters.ESRPInfo.tenantId }}
      AuthAKVName: ${{ parameters.ESRPInfo.azureKeyVaultName }}
      AuthCertName: ${{ parameters.ESRPInfo.authCertName }}
      AuthSignCertName: ${{ parameters.ESRPInfo.signCertName }}
      FolderPath: $(burnSigningDirectory)
      Pattern: '**/*.exe'
      UseMinimatch: true
      signConfigType: inlineSignParams
      inlineOperation: >-
        [
          {
            "KeyCode": "CP-230072",
            "OperationCode": "SigntoolSign",
            "ToolName": "sign",
            "ToolVersion": "1.0",
            "Parameters": {
              "OpusName": "Microsoft",
              "OpusInfo": "https://www.microsoft.com",
              "FileDigest": "/fd SHA256",
              "PageHash": "/NPH",
              "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
            }
          },
          {
            "KeyCode": "CP-230012",
            "OperationCode": "SigntoolVerify",
            "ToolName": "sign",
            "ToolVersion": "1.0",
            "Parameters": {}
          }
        ]

  - powershell: |
      $ErrorActionPreference = 'Stop'
      $packagesRoot = if ($env:NUGET_PACKAGES) {
          $env:NUGET_PACKAGES
      } else {
          Join-Path $env:USERPROFILE '.nuget\packages'
      }
      $wixExe = Join-Path $packagesRoot 'wixtoolset.sdk\5.0.2\tools\net472\x64\wix.exe'
      if (-not (Test-Path -LiteralPath $wixExe -PathType Leaf)) {
          throw "WiX executable not found at '$wixExe'."
      }

      $month = '${{ parameters.monthId }}'.Replace('.', '_')
      $bundlePath = Join-Path '$(installerOutputDirectory)' `
          "IsoSessionSetup_${month}_${{ parameters.archTag }}.exe"
      $enginePath = Join-Path '$(burnSigningDirectory)' `
          "IsoSessionBurnEngine_${{ parameters.archTag }}.exe"
      $reattachedPath = Join-Path '$(burnSigningDirectory)' `
          "IsoSessionSetup_${month}_${{ parameters.archTag }}.exe"

      & $wixExe burn reattach $bundlePath -engine $enginePath -o $reattachedPath
      if ($LASTEXITCODE -ne 0) {
          throw "Reattaching the signed Burn engine failed with exit code $LASTEXITCODE."
      }
      Move-Item -LiteralPath $reattachedPath -Destination $bundlePath -Force
    displayName: Reattach signed Burn engine

  - task: EsrpCodeSigning@5
    displayName: Test sign complete installer EXE
    inputs:
      ConnectedServiceName: ${{ parameters.ESRPInfo.serviceName }}
      AppRegistrationClientId: ${{ parameters.ESRPInfo.clientId }}
      AppRegistrationTenantId: ${{ parameters.ESRPInfo.tenantId }}
      AuthAKVName: ${{ parameters.ESRPInfo.azureKeyVaultName }}
      AuthCertName: ${{ parameters.ESRPInfo.authCertName }}
      AuthSignCertName: ${{ parameters.ESRPInfo.signCertName }}
      FolderPath: $(installerOutputDirectory)
      Pattern: '**/*.exe'
      UseMinimatch: true
      signConfigType: inlineSignParams
      inlineOperation: >-
        [
          {
            "KeyCode": "CP-230072",
            "OperationCode": "SigntoolSign",
            "ToolName": "sign",
            "ToolVersion": "1.0",
            "Parameters": {
              "OpusName": "Microsoft",
              "OpusInfo": "https://www.microsoft.com",
              "FileDigest": "/fd SHA256",
              "PageHash": "/NPH",
              "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
            }
          },
          {
            "KeyCode": "CP-230012",
            "OperationCode": "SigntoolVerify",
            "ToolName": "sign",
            "ToolVersion": "1.0",
            "Parameters": {}
          }
        ]

  - powershell: |
      $ErrorActionPreference = 'Stop'
      $signedFiles = @(
          Get-ChildItem -LiteralPath '$(payloadBinDirectory)' -File |
              Where-Object { $_.Extension -in @('.dll', '.exe') }
          Get-ChildItem -LiteralPath '$(installerOutputDirectory)' -File |
              Where-Object { $_.Extension -in @('.msi', '.exe') }
          Get-ChildItem -LiteralPath '$(burnSigningDirectory)' -File |
              Where-Object { $_.Name -like 'IsoSessionBurnEngine_*.exe' }
      )
      $verification = foreach ($file in $signedFiles) {
          $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Signature verification failed for '$($file.FullName)': $($signature.Status)"
          }
          [ordered]@{
              name = $file.Name
              path = $file.FullName
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              status = $signature.Status.ToString()
              signer = $signature.SignerCertificate.Subject
              thumbprint = $signature.SignerCertificate.Thumbprint
          }
      }
      $verification | ConvertTo-Json -Depth 4 |
          Set-Content -LiteralPath '$(workDirectory)/signature-verification.json' -Encoding UTF8
    displayName: Verify test signatures

  - powershell: |
      $ErrorActionPreference = 'Stop'
      New-Item -ItemType Directory -Force -Path '$(artifactDirectory)' | Out-Null
      Copy-Item -LiteralPath '$(payloadDirectory)\bin' -Destination '$(artifactDirectory)' -Recurse -Force
      Copy-Item -LiteralPath '$(payloadDirectory)\source-manifest.json' `
          -Destination '$(artifactDirectory)\source-manifest.json'
      Copy-Item -LiteralPath '$(workDirectory)\release-contract.json' `
          -Destination '$(artifactDirectory)\release-contract.json'
      Copy-Item -LiteralPath '$(workDirectory)\signature-verification.json' `
          -Destination '$(artifactDirectory)\signature-verification.json'

      $month = '${{ parameters.monthId }}'.Replace('.', '_')
      foreach ($name in @(
          "IsoSession_${month}_${{ parameters.archTag }}.msi",
          "IsoSessionSetup_${month}_${{ parameters.archTag }}.exe",
          "IsoSessionClient_${month}_${{ parameters.archTag }}.manifest"
      )) {
          $source = Join-Path '$(installerOutputDirectory)' $name
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required packaged output missing: $source"
          }
          Copy-Item -LiteralPath $source -Destination '$(artifactDirectory)' -Force
      }
    displayName: Assemble installer artifacts

  - task: 1ES.PublishPipelineArtifact@1
    displayName: Publish $(artifactName)
    inputs:
      path: $(artifactDirectory)
      artifactName: $(artifactName)

- job: release_isosession_${{ parameters.archTag }}
  displayName: Release IsoSession MSI (${{ parameters.archTag }})
  dependsOn: build_isosession_${{ parameters.archTag }}
  templateContext:
    type: releaseJob
    isProduction: true
    inputs:
    - input: pipelineArtifact
      artifactName: isosession-installers-${{ parameters.archTag }}
      targetPath: $(Pipeline.Workspace)/isosession-release/${{ parameters.archTag }}/artifact
  variables:
    releaseArtifactDirectory: $(Pipeline.Workspace)/isosession-release/${{ parameters.archTag }}/artifact
    releaseContentDirectory: $(Pipeline.Workspace)/isosession-release/${{ parameters.archTag }}/content

  steps:
  - powershell: |
      $ErrorActionPreference = 'Stop'
      $month = '${{ parameters.monthId }}'.Replace('.', '_')
      $msiName = "IsoSession_${month}_${{ parameters.archTag }}.msi"
      $msiPath = Join-Path '$(releaseArtifactDirectory)' $msiName
      if (-not (Test-Path -LiteralPath $msiPath -PathType Leaf)) {
          throw "Signed MSI was not found in the build artifact: $msiPath"
      }

      $signature = Get-AuthenticodeSignature -LiteralPath $msiPath
      if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
          throw "MSI signature verification failed for '$msiPath': $($signature.Status)"
      }

      New-Item -ItemType Directory -Force -Path '$(releaseContentDirectory)' | Out-Null
      Copy-Item -LiteralPath $msiPath -Destination '$(releaseContentDirectory)' -Force
    displayName: Stage signed MSI for release

  - task: EsrpRelease@12
    displayName: Publish MSI to ESRP CDN
    inputs:
      connectedservicename: ${{ parameters.ESRPInfo.serviceName }}
      usemanagedidentity: false
      keyvaultname: ${{ parameters.ESRPInfo.azureKeyVaultName }}
      authcertname: ${{ parameters.ESRPInfo.authCertName }}
      signcertname: ${{ parameters.ESRPInfo.signCertName }}
      clientid: ${{ parameters.ESRPInfo.clientId }}
      intent: filedownloadlinkgeneration
      contenttype: binaries
      contentsource: Folder
      folderlocation: $(releaseContentDirectory)
      owners: ${{ parameters.ESRPInfo.OwnersEmail }}
      approvers: ${{ parameters.ESRPInfo.ApproversEmail }}
      waitforreleasecompletion: true
      serviceendpointurl: https://api.esrp.microsoft.com
      mainpublisher: ESRPRELPACMAN
      domaintenantid: ${{ parameters.ESRPInfo.tenantId }}
