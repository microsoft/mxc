#
# Parameterized "package isolation_session test bundle" job used by
# 1ES.IsolationSession.TestBundle.yml. Builds wxc-exec with
# --features isolation_session from the given source repo resource and
# publishes the bundle under the given pipeline artifact name. Artifacts
# produced by this job are intended for OS vpack consumption so that wxc-exec
# can be invoked from the IsoEnvBroker (IsolationSession) APIs on Windows 11 targets
# for testing.
#
# Two packages (main + feature/isolation-session-internal) are built by
# invoking this template once per package.

parameters:
# The repository resource alias to check out
- name: checkoutRepo
  type: string

# The published pipeline artifact name
- name: artifactName
  type: string

# Short id ('main'/'feature') for a unique job name
- name: packageName
  type: string

- name: ESRPInfo
  type: object
  default:
    serviceName: ''
    tenantId: ''
    azureKeyVaultName: ''
    authCertName: ''
    signCertName: ''
    clientId: ''

jobs:
- job: package_iso_test_bundle_${{ parameters.packageName }}
  displayName: 'Package Isolation Session Test Bundle (${{ parameters.packageName }}, x64)'
  timeoutInMinutes: 60
  variables:
    triplet: x86_64-pc-windows-msvc
    CARGO_TARGET_DIR: c:/t/target
    artifactPrefix: wxc-binaries
    workingDirectory: $(Pipeline.Workspace)/s/src
    configTomlPath: $(Pipeline.Workspace)/s/.cargo/config.toml
    npmrcPath: '$(Agent.TempDirectory)/mxc.npmrc'
    NPM_CONFIG_USERCONFIG: '$(npmrcPath)'
    sourceRepositoryRef: $[ resources.repositories.${{ parameters.checkoutRepo }}.ref ]

  templateContext:
    rust:
      rustToolchain:
        toolchainFeed: https://microsoft.pkgs.visualstudio.com/Dart/_packaging/Mxc-Azure-Feed/nuget/v3/index.json
        version: 'ms-prod-1.93'
      workingDirectory: $(workingDirectory)
      authenticateOptions:
        configFile: $(configTomlPath)
      installOptions:
        configFile: $(configTomlPath)
      cacheOptions:
        enabled: true
        enableTargetCache: true
      artifactOptions:
        suffix: ${{ parameters.packageName }} 
 
  steps:
  - checkout: self
    path: lock-check

  - checkout: ${{ parameters.checkoutRepo }}
    path: s

  - task: UseNode@1
    displayName: Use Node.js 24.21
    inputs:
      version: '24.21.0'

  - script: node "$(Pipeline.Workspace)/lock-check/scripts/versioning/check-package-lock-integrity.js"
    displayName: 'Check package locks use npmjs and SHA-512 integrity'
    workingDirectory: $(Pipeline.Workspace)/s

  - powershell: |
      Copy-Item `
        "$(Build.SourcesDirectory)/.azure-pipelines/.npm/.npmrc" `
        "$(npmrcPath)"
    displayName: 'Prepare npm configuration'

  - task: NpmAuthenticate@0
    displayName: 'Authenticate npm'
    inputs:
      workingFile: '$(npmrcPath)'

  - template: Rust.Build.Steps.Official.yml@self
    parameters:
      targetTriple: $(triplet)
      workingDirectory: $(workingDirectory)
      cargoFeatures: isolation_session
      enableTest: 'false'

  - task: UseDotNet@2
    displayName: 'Use .NET SDK 10'
    inputs:
      packageType: sdk
      version: 10.x

  - task: NuGetAuthenticate@1
    displayName: 'Authenticate .NET package restore'

  # The recipe comes from this pipeline's checkout, so both packages build and
  # validate identically to scheduled validation; only the source differs.
  - powershell: |
      & "$(Pipeline.Workspace)/lock-check/scripts/ci/build-isolation-session-test-bundle.ps1" `
          -Phase Build `
          -Architecture x64 `
          -SourceRoot "$(Pipeline.Workspace)/s" `
          -OutputDirectory "$(outputDirectory)" `
          -WxcExecPath "$(CARGO_TARGET_DIR)/$(triplet)/release/wxc-exec.exe" `
          -NuGetSource "https://microsoft.pkgs.visualstudio.com/Dart/_packaging/Mxc-Azure-Feed/nuget/v3/index.json" `
          -Pipeline "$(Build.DefinitionName)" `
          -BranchName "${{ parameters.checkoutRepo }}" `
          -SourceRef "$(sourceRepositoryRef)" `
          -BuildId "$(Build.BuildId)" `
          -Package "${{ parameters.packageName }}"
      Get-ChildItem "$(outputDirectory)" -Recurse -File | ForEach-Object { Write-Host "  $($_.FullName.Replace('$(outputDirectory)', ''))" }
    displayName: 'Build test bundle'
  # Test sign (CP-230072) the staged binaries so the vpack ships signed binaries.
  - task: EsrpCodeSigning@5
    displayName: Code Sign
    inputs:
      ConnectedServiceName: ${{ parameters.ESRPInfo.serviceName }}
      AppRegistrationClientId: ${{ parameters.ESRPInfo.clientId }}
      AppRegistrationTenantId: ${{ parameters.ESRPInfo.tenantId }}
      AuthAKVName: ${{ parameters.ESRPInfo.azureKeyVaultName }}
      AuthCertName: ${{ parameters.ESRPInfo.authCertName }}
      AuthSignCertName: ${{ parameters.ESRPInfo.signCertName }}
      FolderPath: $(outputDirectory)
      Pattern: |
        **/*.dll
        **/*.ps1
        **/*.exe

      UseMinimatch: true
      signConfigType: 'inlineSignParams'
      inlineOperation: >-
        [
          {
            "KeyCode": "CP-230072", 
            "OperationCode": "SigntoolSign",
            "ToolName": "sign",
            "ToolVersion": "1.0",
            "Parameters": {
              "OpusName": "Microsoft",
              "OpusInfo": "https://www.microsoft.com",
              "FileDigest": "/fd SHA256",
              "PageHash": "/NPH",
              "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
            }
          },
          {
            "KeyCode": "CP-230012",
            "OperationCode": "SigntoolVerify",
            "ToolName": "sign",
            "ToolVersion": "1.0",
            "Parameters": {}
          }
        ]

  # The tests themselves need an IsolationSession-capable host, which the
  # packaging pool is not; this checks the signed payloads load and discover.
  - powershell: |
      & "$(Pipeline.Workspace)/lock-check/scripts/ci/build-isolation-session-test-bundle.ps1" `
          -Phase Validate `
          -Architecture x64 `
          -SourceRoot "$(Pipeline.Workspace)/s" `
          -OutputDirectory "$(outputDirectory)" `
          -Pipeline "$(Build.DefinitionName)" `
          -BranchName "${{ parameters.checkoutRepo }}" `
          -SourceRef "$(sourceRepositoryRef)" `
          -BuildId "$(Build.BuildId)"
    displayName: 'Validate signed test bundle'

  - task: 1ES.PublishPipelineArtifact@1
    displayName: 'Publish Isolation Test Bundle (${{ parameters.packageName }})'
    inputs:
      path: '$(outputDirectory)'
      artifactName: ${{ parameters.artifactName }}
