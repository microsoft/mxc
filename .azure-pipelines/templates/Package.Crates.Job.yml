#
# Packages the mxc-alpha-mxc-sdk crate closure into .crate files, once per OS on that
# OS's own agent.  cargo package compiles every crate, so each leg proves the
# closure builds natively there.  Only the Windows leg publishes the artifact;
# the other two are verification.
#
# The steps hold no logic: Invoke-CratePackage.ps1 does the packaging and
# derives the crate list from the workspace, so adding a crate needs no edit
# here, and the same command reproduces a leg locally.

parameters:
  # Official builds resolve through the authenticated Mxc-Azure-Feed; unofficial
  # and fork builds use the anonymous MxcDependencies mirror.
  - name: isOfficialBuild
    type: boolean
    default: true
  - name: cratesArtifactName
    type: string
    default: mxc-crates-package
  - name: matrix
    type: object
    default:
      - name: windows_x64
        os: windows
        triplet: x86_64-pc-windows-msvc
        poolName: Azure-Pipelines-1ESPT-ExDShared
        poolImage: windows-2022
        poolOs: windows
      - name: linux_x64
        os: linux
        triplet: x86_64-unknown-linux-gnu
        poolName: Azure-Pipelines-1ESPT-ExDShared
        poolImage: ubuntu-latest
        poolOs: linux
      - name: macos_arm64
        os: macos
        triplet: aarch64-apple-darwin
        poolName: Azure Pipelines
        poolImage: macOS-15-arm64
        poolOs: macOS

jobs:
  - ${{ each item in parameters.matrix }}:
    - job: package_crates_${{ item.name }}
      displayName: Package Crates (${{ item.os }})

      # macOS comes from the Microsoft-hosted pool, which names the image
      # `vmImage`.
      pool:
        name: ${{ item.poolName }}
        ${{ if eq(item.os, 'macos') }}:
          vmImage: ${{ item.poolImage }}
        ${{ else }}:
          image: ${{ item.poolImage }}
        os: ${{ item.poolOs }}

      variables:
        outDir: $(Build.SourcesDirectory)/out/crates
        # Must name the feed that replaced crates-io on this leg: under source
        # replacement cargo registers the just-packaged sibling overlay under
        # one source id and looks it up under the other (rust-lang/cargo#17196).
        ${{ if eq(parameters.isOfficialBuild, true) }}:
          cargoRegistry: Mxc-Azure-Feed
        ${{ else }}:
          cargoRegistry: MxcDependencies

      steps:
        - checkout: self

        - template: Rust.Toolchain.Public.yml@self
          parameters:
            targetTriple: ${{ item.triplet }}

        - ${{ if eq(parameters.isOfficialBuild, true) }}:
          - template: Cargo.Setup.Private.yml@self
        - ${{ else }}:
          - template: Cargo.Setup.Public.yml@self

        - task: PowerShell@2
          displayName: Package crate closure
          inputs:
            targetType: filePath
            filePath: $(Build.SourcesDirectory)/scripts/ci/Invoke-CratePackage.ps1
            arguments: -OutDir '$(outDir)' -Registry '$(cargoRegistry)'
            pwsh: true
            workingDirectory: $(Build.SourcesDirectory)

        # TEMPORARY ALPHA GUARD -- DELETE THIS STEP BEFORE PRODUCTION.
        #
        # Runs on every leg and on every run, including a dry run.  The
        # publish stage is skipped when dryRun is true, so a guard living
        # only in that stage would let a dry run package 21 wrongly named
        # crates, publish the artifact, and report success -- a green
        # pipeline over names that must never ship.  Failing here stops the
        # whole pipeline instead, and no artifact is produced at all.
        #
        # The same check is repeated inline in Publish.CratesIo.Job.yml
        # rather than calling this script, because 1ES forbids checkout in a
        # release job, so the publish job has no copy of the repo to run it
        # from.  That duplication is deliberate, not an oversight.
        - task: PowerShell@2
          displayName: "TEMP: Verify every crate starts with mxc-alpha-"
          inputs:
            targetType: filePath
            filePath: $(Build.SourcesDirectory)/scripts/ci/Assert-CratePrefix.ps1
            arguments: -CratesDir '$(outDir)'
            pwsh: true
            workingDirectory: $(Build.SourcesDirectory)

        # Every leg packages, because that is what proves the closure builds
        # natively on that OS.  A .crate is the same bytes whichever agent
        # produced it, so one leg is enough to feed the publish stage, and
        # Windows is the one that uploads it.
        - ${{ if eq(item.os, 'windows') }}:
          - task: 1ES.PublishPipelineArtifact@1
            displayName: Publish crate package artifact
            inputs:
              path: $(outDir)
              artifactName: ${{ parameters.cratesArtifactName }}
