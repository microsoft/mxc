jobs:
- job: package_lock_check
  displayName: 'Package Lock Check'
  pool:
    name: Azure-Pipelines-1ESPT-ExDShared
    image: windows-2022
    os: windows
  steps:
  - checkout: self

  - task: NodeTool@1
    displayName: Use Node.js 24
    inputs:
      version: '24.x'

  - script: node scripts/versioning/check-package-lock-integrity.js
    displayName: Check package locks use npmjs and SHA-512 integrity
