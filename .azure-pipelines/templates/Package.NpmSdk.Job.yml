parameters:
- name: isOfficialBuild
  type: boolean
  default: false
- name: targets
  type: object
  default:
    - artifact: wxc-binaries-x86_64-pc-windows-msvc
      sdkArch: x64
    - artifact: wxc-binaries-aarch64-pc-windows-msvc
      sdkArch: arm64
    - artifact: lxc-binaries-x86_64-unknown-linux-gnu
      sdkArch: x64
    - artifact: lxc-binaries-aarch64-unknown-linux-gnu
      sdkArch: arm64
- name: ESRPInfo
  type: object
  default: {}

jobs:
- job: package_npm_sdk
  displayName: Package Npm Sdk
  pool:
    name: Azure-Pipelines-1ESPT-ExDShared
    image: ubuntu-latest
    os: linux
  variables:
    outputDirectory: $(Build.SourcesDirectory)/out
    sdkDirectory: $(Build.SourcesDirectory)/sdk/node
    artifactBaseName: mxc-npm-sdk-package

  steps:
    - checkout: self

    # The post-job SBOM generator inspects the Rust workspace. Configure Cargo
    # for the appropriate mirror so network isolation does not send it to crates.io.
    - ${{ if eq(parameters.isOfficialBuild, true) }}:
      - template: Cargo.Setup.Private.yml@self
    - ${{ else }}:
      - template: Cargo.Setup.Public.yml@self

    - task: UseNode@1
      displayName: Use Node.js 24
      inputs:
        version: '24.x'

    # Download all artifacts dynamically
    - ${{ each target in parameters.targets }}:
      - task: DownloadPipelineArtifact@2
        displayName: Download ${{ target.artifact }}
        inputs:
          artifact: ${{ target.artifact }}
          path: $(sdkDirectory)/bin/${{ target.sdkArch }}

    # Pipeline artifact downloads strip Unix execute permissions.
    # Restore +x on Linux and macOS binaries so the tarball preserves them.
    - script: chmod +x $(sdkDirectory)/bin/*/lxc-exec
      displayName: Restore execute permission on lxc-exec

    - script: |
        set -euo pipefail
        find $(sdkDirectory)/bin -name unix-test-proxy -exec chmod +x {} +
      displayName: Restore execute permission on unix-test-proxy

    # NVX runtime assets and symbols ship separately from the base SDK.
    - script: |
        set -euo pipefail
        mv "$(sdkDirectory)/bin/x64/aci-edge-sandboxes" "$(Build.SourcesDirectory)/sdk/node-nvx-runtime/aci-edge-sandboxes"
        rm -rf "$(sdkDirectory)"/bin/*/aci-edge-sandboxes "$(sdkDirectory)"/bin/*/symbols
      displayName: Stage NVX runtime and strip symbols from base SDK

    - script: |
        set -euo pipefail
        find $(sdkDirectory)/bin -name mxc-exec-mac -exec chmod +x {} +
      displayName: Restore execute permission on mxc-exec-mac

    # Copy .npmrc to the SDK directory so Azure artifacts feed is used for npm install.
    - task: CopyFiles@2
      displayName: Copy .npmrc to SDK
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)/.azure-pipelines/.npm'
        Contents: '.npmrc'
        TargetFolder: '$(sdkDirectory)'

    - task: NpmAuthenticate@0
      displayName: NPM Authenticate
      inputs:
        workingFile: '$(sdkDirectory)/.npmrc'

    - script: npm ci
      workingDirectory: $(sdkDirectory)
      displayName: npm ci

    - script: npm run build
      workingDirectory: $(sdkDirectory)
      displayName: npm run build

    - script: |
        set -euo pipefail
        package="$(npm pack --silent)"
        contents="$(tar -tzf "$package")"
        if [[ "$contents" == *aci-edge-sandboxes* ]]; then
          echo "Base SDK package unexpectedly contains NVX runtime assets" >&2
          exit 1
        fi
      workingDirectory: $(sdkDirectory)
      displayName: Pack and verify base SDK

    - script: |
        set -euo pipefail
        cp "$(Build.SourcesDirectory)/LICENSE.md" "$(Build.SourcesDirectory)/sdk/node-nvx-runtime/"
        npm pack
      workingDirectory: $(Build.SourcesDirectory)/sdk/node-nvx-runtime
      displayName: Pack optional NVX runtime

    - task: CopyFiles@2
      displayName: Copy npm package
      inputs:
        sourceFolder: $(sdkDirectory)
        contents: |
          *.tgz
        targetFolder: '$(outputDirectory)/packages'

    - task: CopyFiles@2
      displayName: Copy optional NVX npm package
      inputs:
        sourceFolder: $(Build.SourcesDirectory)/sdk/node-nvx-runtime
        contents: '*.tgz'
        targetFolder: '$(outputDirectory)/packages/nvx'

    - task: CopyFiles@2
      displayName: Copy npm release selector
      inputs:
        sourceFolder: $(Build.SourcesDirectory)/.azure-pipelines/scripts
        contents: select-npm-packages.ps1
        targetFolder: '$(outputDirectory)/packages'

    - task: 1ES.PublishPipelineArtifact@1
      displayName: Upload SDK as pipeline artifact
      inputs:
        path: '$(outputDirectory)/packages'
        artifactName: $(artifactBaseName)