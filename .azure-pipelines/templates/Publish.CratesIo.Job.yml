#
# Publishes the mxc-alpha-mxc-sdk crate closure to crates.io through ESRP Release, under
# the microsoft-oss-releases account.  Consumes the mxc-crates-package
# artifact.
#
# Emits one EsrpRelease task per crate, leaf-first, since the crates.io API
# does not enforce dependency order.
#
# The pool enforces 1ES network isolation (CFSClean), so this job performs no
# crates.io reads.  A publish that crates.io rejects fails its task and skips
# every later crate.  The agent never uploads anything itself — it hands each
# .crate to ESRP, which publishes from its own infrastructure — so the wait
# between crates is a fixed delay rather than a poll of the index, and a
# release that hangs is caught by the per-task timeout rather than by
# observing crates.io.

parameters:
  - name: ESRPInfo
    type: object
  # The crates to publish, leaf-first.  This is the only copy of the list.
  # It is literal because ${{ each }} expands when the pipeline compiles,
  # before any step could produce it; the packaging job derives the same order
  # at run time and needs no copy.
  #
  # Regenerate after adding or removing a crate:
  #   pwsh scripts/ci/Get-CrateOrder.ps1 -Yaml
  - name: crateOrder
    type: object
    default:
    - mxc-alpha-isolation-session-bindings
    - mxc-alpha-learning-mode-core
    - mxc-alpha-mxc-pty
    - mxc-alpha-mxc-telemetry
    - mxc-alpha-nanvix-common
    - mxc-alpha-process-security-environment-spec
    - mxc-alpha-windows-secenv-projection
    - mxc-alpha-wxc-common
    - mxc-alpha-isolation-session-common
    - mxc-alpha-learning-mode-windows
    - mxc-alpha-lxc-common
    - mxc-alpha-nanvix-runner
    - mxc-alpha-seatbelt-common
    - mxc-alpha-test-hyperlight-common
    - mxc-alpha-windows-sandbox-common
    - mxc-alpha-wslc-common
    - mxc-alpha-basecontainer-common
    - mxc-alpha-bwrap-common
    - mxc-alpha-windows-sandbox-lifecycle
    - mxc-alpha-mxc-engine
    - mxc-alpha-mxc-sdk
  - name: cratesArtifactName
    type: string
    default: mxc-crates-package
  - name: dryRun
    type: boolean
    default: true
  # Seconds to wait after each publish before the next crate goes up.
  # crates.io does not serve a new version from its index the moment the
  # upload returns, and the next crate in the order depends on the one just
  # published.  ESRP is not cargo, so nothing else here performs the index
  # wait that `cargo publish` does.
  #
  # This does not address the crates.io publish rate limit, which needs ten
  # minutes per crate past the fifth and so cannot fit any workable job
  # timeout — that needs the override in docs/crates-release.md.
  #
  # Raise it only together with timeoutInMinutes below: across 21 crates,
  # every 60 seconds here spends 21 minutes of the job budget.
  - name: publishDelaySeconds
    type: number
    default: 90
  # Cap on a single ESRP release.  The agent cannot see crates.io — ESRP
  # performs the upload from its own infrastructure, and 1ES network isolation
  # blocks this job from reading a public registry — so a hung release is the
  # only "not uploaded" state this job can detect.  Exceeding this fails the
  # task, which stops the job before the next crate is published.
  #
  # The closure's largest archive is 0.22 MiB, so this is a hang detector, not
  # a duration estimate.
  - name: esrpTimeoutMinutes
    type: number
    default: 15

jobs:
  - job: publish_crates
    displayName: Publish crates to crates.io (ESRP)
    # Azure DevOps defaults an unspecified job timeout to 60 minutes, which 21
    # sequential ESRP releases plus their waits can exceed.  A job killed part
    # way through leaves the closure half published, and a publish cannot be
    # undone.
    #
    # 1ES honors this on a releaseJob: v1/Jobs/ReleaseJob.yml copies every job
    # key through, excluding only templateContext, variables, steps, pool, and
    # container.
    timeoutInMinutes: 120
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows
    templateContext:
      type: releaseJob
      isProduction: true
      inputs:
        - input: pipelineArtifact
          artifactName: ${{ parameters.cratesArtifactName }}
          targetPath: $(Pipeline.Workspace)/crates
    variables:
      cratesDir: $(Pipeline.Workspace)/crates
      esrpDir: $(Pipeline.Workspace)/esrp-one
    steps:
      # TEMPORARY ALPHA GUARD -- DELETE THIS STEP BEFORE PRODUCTION.
      #
      # Fails the job before the first upload if any .crate in the artifact
      # does not carry the mxc-alpha- prefix, so an artifact built from a
      # pre-rename commit cannot reach crates.io.
      #
      # The hazard is not hypothetical.  Every branch that still carries a
      # live EsrpRelease task was cut before the rename and names the crates
      # mxc-sdk, mxc_telemetry, wslc_common, and so on.  Publishing one of
      # those is unrecoverable: crates.io does not allow a name or a version
      # to be deleted or reused, so the wrong name cannot be corrected
      # afterwards and cannot be republished under the right one.  That is
      # why this is a precondition rather than a post-publish assertion.
      #
      # This checks the artifact rather than the crateOrder list because the
      # artifact is what actually gets uploaded.  A file present here but
      # absent from crateOrder is never staged, yet its presence still means
      # the packaging job ran against the wrong commit, which is exactly the
      # state worth failing on.
      #
      # The test is an exact, literal, case-sensitive prefix match on
      # mxc-alpha- and nothing else.  mxc_alpha_ with underscores does NOT
      # satisfy it, even though crates.io treats the two spellings as the
      # same name.  As of this commit all 21 crates in the closure declare
      # the hyphenated form, so a rejection here means the artifact was built
      # from a commit that predates that rename.  Any single wrong name fails
      # this step, which fails the job, the stage, and the pipeline, and
      # nothing is published.
      #
      # This logic is also in scripts/ci/Assert-CratePrefix.ps1, which the
      # packaging stage runs.  It is repeated inline here rather than called,
      # because 1ES forbids checkout in a release job, so this job has no
      # copy of the repo to run the script from.  The duplication is
      # deliberate: the packaging guard stops a bad build early and on dry
      # runs, and this one is the last check before the first upload.  Delete
      # both together.
      #
      # WHY IT GOES AWAY: it encodes the alpha naming scheme, which is a
      # property of this pre-release period and not of the release process.
      # Once the crates graduate to their production names this step starts
      # rejecting every correct name, so it must be deleted in the same
      # change that renames them -- not disabled, and not parameterized into
      # something that looks permanent.
      - pwsh: |
          $ErrorActionPreference = 'Stop'

          $prefix = 'mxc-alpha-'
          $cratesDir = '$(cratesDir)'

          $crates = @(Get-ChildItem -Path $cratesDir -Filter '*.crate' -File | Sort-Object Name)
          if ($crates.Count -eq 0)
          {
              throw "no .crate files found in $cratesDir -- the packaging artifact is missing or empty"
          }

          # Ordinal, matching the comparison Get-CrateOrder.ps1 uses, so the
          # result does not depend on the agent's culture.
          $rejected = @()
          foreach ($crate in $crates)
          {
              if ($crate.Name.StartsWith($prefix, [System.StringComparison]::Ordinal))
              {
                  Write-Host "  ok      $($crate.Name)"
              }
              else
              {
                  Write-Host "  REJECT  $($crate.Name)"
                  $rejected += $crate.Name
              }
          }

          if ($rejected.Count -gt 0)
          {
              Write-Host "##vso[task.logissue type=error]$($rejected.Count) of $($crates.Count) crates lack the $prefix prefix: $($rejected -join ', ')"
              throw "alpha prefix guard failed -- refusing to publish $($rejected.Count) crate(s) without the $prefix prefix"
          }

          Write-Host "alpha prefix guard passed: all $($crates.Count) crates carry the $prefix prefix"
        displayName: "TEMP: Verify every crate carries the mxc-alpha- prefix"

      - ${{ each crate in parameters.crateOrder }}:
          # ESRP uploads a folder, so each crate gets a clean one to itself.
          - pwsh: |
              $ErrorActionPreference = 'Stop'
              if (Test-Path '$(esrpDir)') { Remove-Item -Recurse -Force '$(esrpDir)' }
              New-Item -ItemType Directory -Force -Path '$(esrpDir)' | Out-Null
              $found = @(Get-ChildItem -Path '$(cratesDir)' -Filter '${{ crate }}-*.crate' -File)
              if ($found.Count -ne 1) { throw "expected exactly one .crate for ${{ crate }}, found $($found.Count)" }
              Copy-Item $found[0].FullName -Destination '$(esrpDir)'
              Write-Host "staged $($found[0].Name)"
            displayName: "Stage ${{ crate }} for ESRP"

          # Redundant: the stage condition in 1ES.Release.Crates.yml already
          # skips this job on a dry run.  Kept so that deleting that condition
          # still cannot publish.
          - ${{ if parameters.dryRun }}:
            - pwsh: |
                Write-Host "##vso[task.logissue type=warning]DRY RUN: skipping ESRP publish for ${{ crate }} (staged .crate only)."
              displayName: "DRY RUN: skip publish ${{ crate }}"
          # SAFETY GUARD -- present on release/v0.0.0-smoketest only, and
          # deliberately absent from the PR branch.  The real ESRP publish
          # task is commented out below so that no misconfiguration --
          # a wrong dryRun value, a bad condition, a template change --
          # can reach crates.io from a smoke test.  crates.io does not
          # allow a name or version to be deleted or reused once it is
          # published, so an accidental publish cannot be undone.
          #
          # This branch fires only when dryRun is false.  It fails on
          # purpose: a silent warning could let someone believe a publish
          # succeeded when nothing was uploaded.
          - ${{ else }}:
            - pwsh: |
                Write-Host "##vso[task.logissue type=error]SAFETY GUARD: the ESRP publish task is commented out on release/v0.0.0-smoketest. NOTHING was published for ${{ crate }}. To publish for real, run from a branch that still has the EsrpRelease task."
                exit 1
              displayName: "BLOCKED: publish ${{ crate }} disabled on smoketest"
            # - task: EsrpRelease@12
            #   displayName: "Publish ${{ crate }} to crates.io"
            #   # A release that never completes would otherwise sit here
            #   # until the whole job is killed, losing the rest of the
            #   # closure to a timeout that names no crate.  Capping the
            #   # task instead fails this crate, and the job stops before
            #   # publishing anything that would depend on it.
            #   timeoutInMinutes: ${{ parameters.esrpTimeoutMinutes }}
            #   inputs:
            #     connectedservicename: ${{ parameters.ESRPInfo.serviceName }}
            #     usemanagedidentity: false
            #     keyvaultname: ${{ parameters.ESRPInfo.azureKeyVaultName }}
            #     authcertname: ${{ parameters.ESRPInfo.authCertName }}
            #     signcertname: ${{ parameters.ESRPInfo.signCertName }}
            #     clientid: ${{ parameters.ESRPInfo.clientId }}
            #     intent: 'PackageDistribution'
            #     contenttype: 'Rust'
            #     contentsource: 'Folder'
            #     folderlocation: $(esrpDir)
            #     owners: ${{ parameters.ESRPInfo.OwnersEmail }}
            #     approvers: ${{ parameters.ESRPInfo.ApproversEmail }}
            #     waitforreleasecompletion: true
            #     serviceendpointurl: 'https://api.esrp.microsoft.com'
            #     mainpublisher: 'ESRPRELPACMAN'
            #     domaintenantid: ${{ parameters.ESRPInfo.tenantId }}

            # Give crates.io time to serve the version just published before
            # the crate that depends on it goes up.  Azure DevOps has no
            # built-in wait for an agent job: Delay is the only delay task of
            # the 225 first-party tasks and its task.json declares
            # runsOn: Server, so it runs in agentless jobs only.  Hence a
            # script.  It stays silent while waiting and prints once the delay
            # has elapsed.
            #
            # The last crate is waited on too, which costs one extra delay at
            # the end of the job.  Special-casing it is not worth the
            # expression.
            - pwsh: |
                $ErrorActionPreference = 'Stop'
                $delay = ${{ parameters.publishDelaySeconds }}
                if ($delay -gt 0) { Start-Sleep -Seconds $delay }
                Write-Host "waited $delay s after ${{ crate }}"
              displayName: "Wait after ${{ crate }}"
