#
# Publishes the mxc-sdk crate closure to crates.io through ESRP Release, under
# the microsoft-oss-releases account.  Consumes the mxc-crates-package
# artifact.
#
# Emits one EsrpRelease task per crate, leaf-first, since the crates.io API
# does not enforce dependency order.
#
# The pool enforces 1ES network isolation (CFSClean), so this job performs no
# crates.io reads.  A publish that crates.io rejects fails its task and skips
# every later crate.

parameters:
  - name: ESRPInfo
    type: object
  # The crates to publish, leaf-first.  This is the only copy of the list.
  # It is literal because ${{ each }} expands when the pipeline compiles,
  # before any step could produce it; the packaging job derives the same order
  # at run time and needs no copy.
  #
  # Regenerate after adding or removing a crate:
  #   pwsh scripts/ci/Get-CrateOrder.ps1 -Yaml
  - name: crateOrder
    type: object
    default:
    - isolation_session_bindings
    - learning_mode_core
    - mxc_pty
    - mxc_telemetry
    - nanvix_common
    - process_security_environment_spec
    - sandbox_spec
    - wxc_common
    - hyperlight_common
    - isolation_session_common
    - learning_mode_windows
    - lxc_common
    - nanvix_runner
    - seatbelt_common
    - windows_sandbox_common
    - wslc_common
    - appcontainer_common
    - bwrap_common
    - windows_sandbox_lifecycle
    - mxc_engine
    - mxc-sdk
  - name: cratesArtifactName
    type: string
    default: mxc-crates-package
  - name: dryRun
    type: boolean
    default: true

jobs:
  - job: publish_crates
    displayName: Publish crates to crates.io (ESRP)
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows
    templateContext:
      type: releaseJob
      isProduction: true
      inputs:
        - input: pipelineArtifact
          artifactName: ${{ parameters.cratesArtifactName }}
          targetPath: $(Pipeline.Workspace)/crates
    variables:
      cratesDir: $(Pipeline.Workspace)/crates
      esrpDir: $(Pipeline.Workspace)/esrp-one
    steps:
      - ${{ each crate in parameters.crateOrder }}:
          # ESRP uploads a folder, so each crate gets a clean one to itself.
          - pwsh: |
              $ErrorActionPreference = 'Stop'
              if (Test-Path '$(esrpDir)') { Remove-Item -Recurse -Force '$(esrpDir)' }
              New-Item -ItemType Directory -Force -Path '$(esrpDir)' | Out-Null
              $found = @(Get-ChildItem -Path '$(cratesDir)' -Filter '${{ crate }}-*.crate' -File)
              if ($found.Count -ne 1) { throw "expected exactly one .crate for ${{ crate }}, found $($found.Count)" }
              Copy-Item $found[0].FullName -Destination '$(esrpDir)'
              Write-Host "staged $($found[0].Name)"
            displayName: "Stage ${{ crate }} for ESRP"

          # Redundant: the stage condition in 1ES.Release.Crates.yml already
          # skips this job on a dry run.  Kept so that deleting that condition
          # still cannot publish.
          - ${{ if parameters.dryRun }}:
            - pwsh: |
                Write-Host "##vso[task.logissue type=warning]DRY RUN: skipping ESRP publish for ${{ crate }} (staged .crate only)."
              displayName: "DRY RUN: skip publish ${{ crate }}"
          # SAFETY GUARD -- present on release/v0.0.0-smoketest only, and
          # deliberately absent from the PR branch.  The real ESRP publish
          # task is commented out below so that no misconfiguration --
          # a wrong dryRun value, a bad condition, a template change --
          # can reach crates.io from a smoke test.  crates.io does not
          # allow a name or version to be deleted or reused once it is
          # published, so an accidental publish cannot be undone.
          #
          # This branch fires only when dryRun is false.  It fails on
          # purpose: a silent warning could let someone believe a publish
          # succeeded when nothing was uploaded.
          - ${{ else }}:
            - pwsh: |
                Write-Host "##vso[task.logissue type=error]SAFETY GUARD: the ESRP publish task is commented out on release/v0.0.0-smoketest. NOTHING was published for ${{ crate }}. To publish for real, run from a branch that still has the EsrpRelease task."
                exit 1
              displayName: "BLOCKED: publish ${{ crate }} disabled on smoketest"
            # - task: EsrpRelease@12
            #   displayName: "Publish ${{ crate }} to crates.io"
            #   inputs:
            #     connectedservicename: ${{ parameters.ESRPInfo.serviceName }}
            #     usemanagedidentity: false
            #     keyvaultname: ${{ parameters.ESRPInfo.azureKeyVaultName }}
            #     authcertname: ${{ parameters.ESRPInfo.authCertName }}
            #     signcertname: ${{ parameters.ESRPInfo.signCertName }}
            #     clientid: ${{ parameters.ESRPInfo.clientId }}
            #     intent: 'PackageDistribution'
            #     contenttype: 'Rust'
            #     contentsource: 'Folder'
            #     folderlocation: $(esrpDir)
            #     owners: ${{ parameters.ESRPInfo.OwnersEmail }}
            #     approvers: ${{ parameters.ESRPInfo.ApproversEmail }}
            #     waitforreleasecompletion: true
            #     serviceendpointurl: 'https://api.esrp.microsoft.com'
            #     mainpublisher: 'ESRPRELPACMAN'
            #     domaintenantid: ${{ parameters.ESRPInfo.tenantId }}
