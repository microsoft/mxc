parameters:
- name: isOfficialBuild
  type: boolean
  default: false
- name: matrix
  type: object
  default: {}
- name: ESRPInfo
  type: object
  default: {}

jobs:
- ${{ each item in parameters.matrix }}:
  - job: 'build_${{ item.arch }}_${{ item.component }}'
    displayName: 'Build (${{ item.arch }} ${{ item.component }})'
    dependsOn: []
    timeoutInMinutes: 240
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      ${{ if eq(item.os, 'windows') }}:
        image: windows-latest
        os: windows
      ${{ if eq(item.os, 'linux') }}:
        image: ubuntu-latest #x64 host
        os: linux

    variables:

      # Triplet
      ${{ if and(eq(item.os, 'windows'), eq(item.arch, 'x64')) }}:
        triplet: x86_64-pc-windows-msvc
      ${{ if and(eq(item.os, 'windows'), eq(item.arch, 'arm64')) }}:
        triplet: aarch64-pc-windows-msvc
      ${{ if and(eq(item.os, 'linux'), eq(item.arch, 'x64')) }}:
        triplet: x86_64-unknown-linux-gnu
      ${{ if and(eq(item.os, 'linux'), eq(item.arch, 'arm64')) }}:
        triplet: aarch64-unknown-linux-gnu

      # Windows specific variables
      ${{ if eq(item.os, 'windows') }}:
        CARGO_TARGET_DIR: c:/t/target
        artifactPrefix: wxc-binaries
        workingDirectory: $(Build.SourcesDirectory)/src
        ${{ if eq(item.arch, 'x64') }}:
          cargoFeatures: hyperlight isolation_session microvm wslc dotnetsdk
          dotnetTestSupportTargetDir: c:/t/dotnet-test-support
        ${{ else }}:
          cargoFeatures: hyperlight isolation_session microvm wslc
        signPattern: |
            wxc-exec.exe
            wxc-windows-sandbox-daemon.exe
            wxc-windows-sandbox-guest.exe
            wxc-wslc-daemon.exe
            wxc-test-proxy.exe
            mxc-diagnostic-console.exe
            mxc_ffi.dll

      # Linux specific variables
      ${{ if eq(item.os, 'linux') }}:
        CARGO_TARGET_DIR: /tmp/target
        artifactPrefix: lxc-binaries
        workingDirectory: $(Build.SourcesDirectory)/src/tools/lxc
        cargoFeatures: hyperlight
        ${{ if eq(item.arch, 'arm64') }}:
          AARCH64_UNKNOWN_LINUX_GNU_OPENSSL_LIB_DIR: /usr/lib/aarch64-linux-gnu
          AARCH64_UNKNOWN_LINUX_GNU_OPENSSL_INCLUDE_DIR: /usr/include
        signPattern: |
          lxc-exec
          unix-test-proxy
          libmxc_ffi.so

      # Paths
      targetTriple: $(triplet)
      targetTripleDir: $(CARGO_TARGET_DIR)/$(targetTriple)/release
      outputDirectory: $(Build.SourcesDirectory)/out
      artifactBaseName: $(artifactPrefix)-$(targetTriple)
      configTomlPath: $(Build.SourcesDirectory)/.cargo/config.toml

    # 1ES Rust virtual tasks read these settings (toolchain feed, registry
    # auth) from the job's templateContext. Official-only
    # because Mxc-Azure-Feed needs System.AccessToken.
    ${{ if eq(parameters.isOfficialBuild, true) }}:
      templateContext:
        rust:
          rustToolchain:
            toolchainFeed: https://microsoft.pkgs.visualstudio.com/Dart/_packaging/Mxc-Azure-Feed/nuget/v3/index.json
            version: 'ms-prod-1.93'
            additionalTargets: $(triplet)
          workingDirectory: $(workingDirectory)
          authenticateOptions:
            configFile: $(configTomlPath)
          installOptions:
            configFile: $(configTomlPath)
          cacheOptions:
            enabled: false
            enableTargetCache: false

    steps:
      - checkout: self

      - pwsh: |
          $openssl = Join-Path $env:ProgramFiles 'Git\usr\bin\openssl.exe'
          if (-not (Test-Path $openssl)) {
            throw 'Windows TLS fixtures require OpenSSL from Git for Windows'
          }
          Write-Host "##vso[task.setvariable variable=MXC_W365_TEST_OPENSSL]$openssl"
        displayName: Expose OpenSSL for Windows TLS fixtures
        condition: and(succeeded(), eq('${{ item.os }}', 'windows'), eq('${{ item.arch }}', 'x64'))

      - script: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
        displayName: Install Linux TLS build dependencies
        condition: and(succeeded(), eq('${{ item.os }}', 'linux'))

      # Install Linux ARM64 toolchain for arm64 linux builds
      - script: |
          set -euo pipefail
          sudo apt-get install -y gcc-aarch64-linux-gnu
          sudo dpkg --add-architecture arm64
          . /etc/os-release
          sources="$(mktemp)"
          trap 'rm -f "$sources"' EXIT
          for suite in "$VERSION_CODENAME" "$VERSION_CODENAME-updates" "$VERSION_CODENAME-security"; do
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://azure.archive.ubuntu.com/ubuntu $suite main universe" >> "$sources"
            echo "deb [arch=arm64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports $suite main" >> "$sources"
          done
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o "Dir::Etc::sourceparts=-")
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libssl-dev:arm64
        displayName: Install ARM64 toolchain and target OpenSSL
        condition: and(succeeded(), eq('${{ item.os }}', 'linux'), eq('${{ item.arch }}', 'arm64'))

      - ${{ if eq(parameters.isOfficialBuild, true) }}:
        - template: Rust.Build.Steps.Official.yml@self
          parameters:
            targetTriple: $(triplet)
            workingDirectory: $(workingDirectory)
            cargoFeatures: $(cargoFeatures)
            ${{ if eq(item.arch, 'x64') }}:
              enableTest: 'true'
            ${{ else }}:
              enableTest: 'false'

      - ${{ else }}:
        # Fork-PR / Unofficial: rustup and the public dependency mirror.
        - template: Rust.Build.Steps.Unofficial.yml@self
          parameters:
            targetTriple: $(triplet)
            workingDirectory: $(workingDirectory)
            cargoArgs: --no-default-features --features "$(cargoFeatures)"
            ${{ if eq(item.arch, 'x64') }}:
              enableTest: 'true'
            ${{ else }}:
              enableTest: 'false'

      - script: |
          set -euo pipefail
          features="$(cargo tree --locked --target $(triplet) -p mxc-sdk --no-default-features --features hyperlight -e features -i ureq)"
          grep -q 'ureq feature "native-tls"' <<< "$features"
          if grep -qE 'ureq feature "(gzip|rustls)"' <<< "$features"; then
            echo "ARM64 must use native TLS without rustls or Hyperlight's x86_64-only gzip feature." >&2
            exit 1
          fi
        displayName: Check ARM64 HTTP dependency features
        workingDirectory: $(Build.SourcesDirectory)/src
        condition: and(succeeded(), eq('${{ item.os }}', 'linux'), eq('${{ item.arch }}', 'arm64'))

      # These are separate workspace members (not deps of lxc), so the
      # workspace-member-scoped build above doesn't pick them up.
      - script: |
          cargo build --locked --release --target $(triplet) -p unix_test_proxy -p mxc_ffi
        displayName: Build Node runtime dependencies
        workingDirectory: $(Build.SourcesDirectory)/src
        condition: and(succeeded(), eq('${{ item.os }}', 'linux'))

      # The managed telemetry tests need debug-only test seams that must never
      # be present in the production DLL. Build that isolated DLL here
      # so the .NET test job only consumes Rust artifacts.
      - script: |
          cargo build --locked -p mxc_ffi --features "test-support isolation_session wslc" --target $(triplet) --target-dir $(dotnetTestSupportTargetDir)
        displayName: Build .NET test-support native library
        workingDirectory: $(Build.SourcesDirectory)/src
        condition: and(succeeded(), eq('${{ item.os }}', 'windows'), eq('${{ item.arch }}', 'x64'))

      - script: |
          set -euo pipefail
          cargo test --locked --release --target $(triplet) -p mxc-sdk --lib mxc_common::
          cargo test --locked --release --target $(triplet) -p mxc-sdk --doc
          cargo test --locked --release --target $(triplet) -p mxc-sdk --features schema-gen --test mxc_contract_v0_9_0_alpha --test mxc_contract_v1_0_0 --test mxc_contract_v1_1_0_alpha --test mxc_contract_version_boundaries
          cargo test --locked --release --target $(triplet) -p mxc-sdk -p mxc_ffi --lib state_aware
          cargo test --locked --release --target $(triplet) -p mxc-sdk --test state_aware
        displayName: Test common contracts and state-aware SDK boundaries
        workingDirectory: $(Build.SourcesDirectory)/src
        condition: and(succeeded(), eq('${{ item.os }}', 'linux'), eq('${{ item.arch }}', 'x64'))

      - script: |
          set -euo pipefail
          fixture_target="$(Agent.TempDirectory)/w365-fixture"
          tests="$(cargo test --locked --release --target $(triplet) -p mxc-sdk --test w365_lifecycle --features test-support --target-dir "$fixture_target" -- --list)"
          for name in lifecycle_contract_and_recovery_fixture transport_deadlines_fixture; do
            grep -Fxq "${name}: test" <<< "$tests"
          done
          cargo test --locked --release --target $(triplet) -p mxc-sdk --test w365_lifecycle --features test-support --target-dir "$fixture_target" -- --include-ignored
        displayName: Test W365 checkout and release fixtures
        workingDirectory: $(Build.SourcesDirectory)/src
        condition: and(succeeded(), eq('${{ item.os }}', 'linux'), eq('${{ item.arch }}', 'x64'))

      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $fixtureTarget = Join-Path '$(Agent.TempDirectory)' 'w365-fixture'
          cargo build --locked --release --target $(triplet) -p wxc --features test-support --target-dir $fixtureTarget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MXC_W365_TEST_EXECUTOR = (Resolve-Path (Join-Path $fixtureTarget '$(triplet)\release\wxc-exec.exe')).Path
          $tests = cargo test --locked --release --target $(triplet) -p mxc-sdk --test w365_lifecycle --features test-support --target-dir $fixtureTarget -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('lifecycle_contract_and_recovery_fixture', 'transport_deadlines_fixture', 'lifecycle_fresh_executor_fixture')) {
            if (-not ($tests -match "^${name}: test")) { throw "Missing W365 fixture: $name" }
          }
          cargo test --locked --release --target $(triplet) -p mxc-sdk --test w365_lifecycle --features test-support --target-dir $fixtureTarget -- --include-ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        displayName: Test W365 checkout and fresh-executor release fixtures
        workingDirectory: $(Build.SourcesDirectory)/src
        condition: and(succeeded(), eq('${{ item.os }}', 'windows'), eq('${{ item.arch }}', 'x64'))

      - task: EsrpCodeSigning@6
        displayName: Code Sign
        condition: and(succeeded(), eq(${{ parameters.isOfficialBuild }}, true), eq('${{ item.os }}', 'windows'))
        inputs:
          ConnectedServiceName: ${{ parameters.ESRPInfo.serviceName }}
          AppRegistrationClientId: ${{ parameters.ESRPInfo.clientId }}
          AppRegistrationTenantId: ${{ parameters.ESRPInfo.tenantId }}
          AuthAKVName: ${{ parameters.ESRPInfo.azureKeyVaultName }}
          AuthCertName: ${{ parameters.ESRPInfo.authCertName }}
          AuthSignCertName: ${{ parameters.ESRPInfo.signCertName }}
          FolderPath: $(targetTripleDir)
          Pattern: |
            $(signPattern)
          UseMinimatch: true
          signConfigType: 'inlineSignParams'
          inlineOperation: >-
            [
              {
                "KeyCode": "CP-230012",
                "OperationCode": "SigntoolSign",
                "ToolName": "sign",
                "ToolVersion": "1.0",
                "Parameters": {
                  "OpusName": "Microsoft",
                  "OpusInfo": "https://www.microsoft.com",
                  "FileDigest": "/fd SHA256",
                  "PageHash": "/NPH",
                  "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                }
              },
              {
                "KeyCode": "CP-230012",
                "OperationCode": "SigntoolVerify",
                "ToolName": "sign",
                "ToolVersion": "1.0",
                "Parameters": {}
              }
            ]

      - task: CopyFiles@2
        displayName: Copy binaries
        inputs:
          sourceFolder: $(targetTripleDir)
          contents: |
            $(signPattern)
          targetFolder: $(outputDirectory)/$(targetTriple)

      # Copy wslcsdk.dll
      - task: CopyFiles@2
        displayName: Copy wslcsdk.dll
        inputs:
          sourceFolder: $(targetTripleDir)
          contents: wslcsdk.dll
          targetFolder: $(outputDirectory)/$(targetTriple)

      # The NVX release is already signed and hash-pinned; copy it without re-signing.
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path '$(targetTripleDir)' 'aci-edge-sandboxes'
          if (-not (Test-Path -LiteralPath (Join-Path $bundle 'SOURCE-MANIFEST.json') -PathType Leaf)) {
              throw "The Windows x64 build is missing the signed NVX bundle: $bundle"
          }
          $artifact = Join-Path '$(outputDirectory)' '$(targetTriple)'
          Copy-Item -LiteralPath $bundle -Destination $artifact -Recurse
        displayName: Copy signed NVX runtime bundle
        condition: and(succeeded(), eq('${{ item.os }}', 'windows'), eq('${{ item.arch }}', 'x64'))

      # Copy symbol files into a sibling `symbols/` subdir, NOT alongside the
      # binaries. Workaround for BinSkim BA2007: when the pdb is co-located,
      # BinSkim reads its S_COMPILE3 records and flags `-wd4146` in the
      # statically-linked MS CRT obj files (libucrt.lib internals). We still
      # want +crt-static so consumers don't need a vcruntime DLL — separating
      # the pdb hides those records from BinSkim without changing the binary.
      - task: CopyFiles@2
        displayName: Copy symbol files
        inputs:
          sourceFolder: $(targetTripleDir)
          contents: |
            *.pdb
            *.dwp
          targetFolder: $(outputDirectory)/$(targetTriple)/symbols

      - task: CopyFiles@2
        displayName: Copy generated .NET bindings
        condition: and(succeeded(), eq('${{ item.os }}', 'windows'), eq('${{ item.arch }}', 'x64'))
        inputs:
          sourceFolder: $(Build.SourcesDirectory)/sdk/dotnet/Microsoft.Mxc.Sdk/Native
          contents: NativeMethods.g.cs
          targetFolder: $(outputDirectory)/$(targetTriple)/dotnet

      - task: CopyFiles@2
        displayName: Copy .NET test-support native library
        condition: and(succeeded(), eq('${{ item.os }}', 'windows'), eq('${{ item.arch }}', 'x64'))
        inputs:
          sourceFolder: $(dotnetTestSupportTargetDir)/$(triplet)/debug
          contents: mxc_ffi.dll
          targetFolder: $(outputDirectory)/dotnet-test-support-$(targetTriple)

      - task: 1ES.PublishPipelineArtifact@1
        displayName: Publish .NET test-support native library
        condition: and(succeeded(), eq('${{ item.os }}', 'windows'), eq('${{ item.arch }}', 'x64'))
        inputs:
          path: '$(outputDirectory)/dotnet-test-support-$(targetTriple)'
          artifactName: mxc-dotnet-test-support-$(targetTriple)

      - task: 1ES.PublishPipelineArtifact@1
        displayName: Publish
        inputs:
          path: '$(outputDirectory)/$(targetTriple)'
          artifactName: $(artifactBaseName)