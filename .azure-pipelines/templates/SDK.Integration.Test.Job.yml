parameters:
- name: sdkArtifact
  type: string
  default: mxc-npm-sdk-package
- name: debug
  type: boolean
  default: false
- name: targets
  type: object
  default:
    - name: windows_node24
      os: windows
      nodeVersion: '24.21.0'
    - name: windows_node26
      os: windows
      nodeVersion: '26.8.0'
    - name: linux
      os: linux
      nodeVersion: '24.x'
    - name: macos
      os: macos
      nodeVersion: '24.x'

jobs:
- ${{ each target in parameters.targets }}:
  - job: 'test_mxc_sdk_integration_${{ target.name }}'
    displayName: 'Test MXC SDK Integration (${{ target.name }})'

    pool:
      ${{ if eq(target.os, 'windows') }}:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
      ${{ if eq(target.os, 'linux') }}:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: ubuntu-latest
        os: linux
      ${{ if eq(target.os, 'macos') }}:
        # macOS is not available on the 1ES managed pool
        # (Azure-Pipelines-1ESPT-ExDShared does not offer macOS images).
        # Use the Microsoft-hosted 'Azure Pipelines' pool instead which
        # uses 'vmImage' (not 'image') per ADO hosted-pool schema.
        name: Azure Pipelines
        vmImage: macOS-15-arm64
        os: macOS

    variables:
      integrationDirectory: $(Build.SourcesDirectory)/sdk/node/tests/integration
      sdkPkgDirectory: $(Build.SourcesDirectory)/sdk-pkg
      # Cache npm package downloads across runs (see Package.NpmSdk.Job.yml).
      npm_config_cache: $(Pipeline.Workspace)/.npm

    steps:
      - checkout: self

      - task: UseNode@1
        displayName: Use Node.js ${{ target.nodeVersion }}
        inputs:
          version: ${{ target.nodeVersion }}

      - task: Cache@2
        displayName: Cache npm
        inputs:
          key: 'npm | "$(Agent.OS)" | sdk/node/tests/integration/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(npm_config_cache)

      - task: DownloadPipelineArtifact@2
        displayName: Download SDK package
        inputs:
          artifact: ${{ parameters.sdkArtifact }}
          path: $(sdkPkgDirectory)

      - task: CopyFiles@2
        displayName: Copy .npmrc to integration tests
        inputs:
          SourceFolder: '$(Build.SourcesDirectory)/.azure-pipelines/.npm'
          Contents: '.npmrc'
          TargetFolder: '$(integrationDirectory)'
          # Overwrite the repo's committed .npmrc (install-links=true) with the
          # Azure feed/auth .npmrc. The integration job installs the SDK from a
          # packed tarball, so it does not need install-links.
          overWrite: true

      - task: NpmAuthenticate@0
        displayName: NPM Authenticate
        inputs:
          workingFile: '$(integrationDirectory)/.npmrc'

      - pwsh: |
          $sdkTgz = (Get-Item "$(sdkPkgDirectory)/*.tgz").FullName
          npm ci
          npm install $sdkTgz
        workingDirectory: $(integrationDirectory)
        displayName: Install dependencies and SDK from artifact

      - script: npm run build
        workingDirectory: $(integrationDirectory)
        displayName: npm run build

      - ${{ if eq(target.os, 'linux') }}:
        - script: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
          displayName: Install W365 native TLS build dependencies

      - template: Rust.Toolchain.Public.yml@self
        parameters:
          ${{ if eq(target.os, 'windows') }}:
            targetTriple: x86_64-pc-windows-msvc
          ${{ if eq(target.os, 'linux') }}:
            targetTriple: x86_64-unknown-linux-gnu
          ${{ if eq(target.os, 'macos') }}:
            targetTriple: aarch64-apple-darwin

      - template: Cargo.Setup.Public.yml@self

      - pwsh: ./scripts/ci/run-w365-node-fixture.ps1
        workingDirectory: $(Build.SourcesDirectory)
        displayName: Test W365 Dev JSON with an isolated native TLS fixture

      - ${{ if eq(target.os, 'linux') }}:
        - script: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y -qq lxc uidmap dnsmasq-base iptables bubblewrap slirp4netns iproute2
          displayName: Install LXC, Bubblewrap, and slirp4netns

        - script: |
            set -euo pipefail
            backup_dir="$(Agent.TempDirectory)/mxc-node-lxc-$(Build.BuildId)-$(System.JobAttempt)"
            mkdir -m 700 "$backup_dir"
            for file in /etc/lxc/default.conf /etc/subuid /etc/subgid; do
              if sudo test -e "$file" || sudo test -L "$file"; then
                sudo cp -a "$file" "$backup_dir/$(basename "$file")"
              fi
            done
            touch "$backup_dir/complete"

            for file in /etc/subuid /etc/subgid; do
              sudo touch "$file"
              if ! sudo grep -Fxq 'root:100000:65536' "$file"; then
                printf '%s\n' 'root:100000:65536' | sudo tee -a "$file" >/dev/null
              fi
            done

            sudo touch /etc/lxc/default.conf

            # Remove active mappings before adding the test-only UID/GID range.
            sudo sed -i '/^[[:space:]]*lxc\.idmap[[:space:]]*=/d' /etc/lxc/default.conf
            printf '%s\n' \
              'lxc.idmap = u 0 100000 65536' \
              'lxc.idmap = g 0 100000 65536' | sudo tee -a /etc/lxc/default.conf >/dev/null
          displayName: Configure unprivileged LXC

        - script: sudo MXC_SKIP_LXC_NETWORK_TESTS=1 MXC_DEBUG=${{ parameters.debug }} npm test
          workingDirectory: $(integrationDirectory)
          displayName: npm test (sudo, with LXC)

        - script: |
            set -euo pipefail
            backup_dir="$(Agent.TempDirectory)/mxc-node-lxc-$(Build.BuildId)-$(System.JobAttempt)"
            if [ -f "$backup_dir/complete" ]; then
              status=0
              for file in /etc/lxc/default.conf /etc/subuid /etc/subgid; do
                backup="$backup_dir/$(basename "$file")"
                if sudo test -e "$backup" || sudo test -L "$backup"; then
                  sudo cp -a --remove-destination "$backup" "$file" || status=1
                else
                  sudo rm -f "$file" || status=1
                fi
              done
              exit "$status"
            fi
          condition: always()
          displayName: Restore LXC configuration

      - ${{ if eq(target.os, 'windows') }}:
        - script: npm test
          workingDirectory: $(integrationDirectory)
          displayName: npm test
          env:
            MXC_DEBUG: ${{ parameters.debug }}
            MXC_SKIP_OS_BUILD_DEPENDENT_TESTS: '1'

      - ${{ if eq(target.os, 'macos') }}:
        # Restore execute bit on the mac binary; pipeline artifact
        # downloads (via npm pack/unpack) drop Unix execute permissions.
        - script: |
            set -euo pipefail
            BIN=$(find node_modules/@microsoft/mxc-sdk/bin -name mxc-exec-mac -print -quit)
            if [ -n "$BIN" ]; then chmod +x "$BIN"; else echo "mxc-exec-mac not found in installed package" && exit 1; fi
          workingDirectory: $(integrationDirectory)
          displayName: Restore execute permission on mxc-exec-mac

        - script: npm test
          workingDirectory: $(integrationDirectory)
          displayName: npm test
          env:
            MXC_DEBUG: ${{ parameters.debug }}
            MXC_SKIP_OS_BUILD_DEPENDENT_TESTS: '1'
