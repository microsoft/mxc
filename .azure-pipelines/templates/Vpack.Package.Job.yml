#
# Consumes signed wxc binaries from MXC-Official-Build and packages them
# as a vpack. The build-completion trigger is set in the ADO UI.

parameters: # parameters are shown up in ADO UI in a build queue time
- name: 'debug'
  displayName: 'Enable debug output'
  type: boolean
  default: false

variables:
- name: VersionDate
  value: "$[format('{0:yyMMdd}', pipeline.startTime)]"
- name: VersionCounter
  value: "$[counter(variables['VersionDate'], 1)]"
- name: WindowsContainerImage
  value: onebranch.azurecr.io/windows/ltsc2022/vse2022:latest

trigger: none

pool:
  type: windows

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
  pipelines:
    # Source of the signed wxc binaries. Mirrors the alias used in
    # 1ES.Release.yml. `trigger: none` because the build-completion
    # trigger is configured in the ADO UI.
    - pipeline: MXC
      source: 'MXC-Official-Build'
      trigger: none

    # Source of the isolation_session test bundle.
    - pipeline: IsoSession-TestPackage
      source: 'MXC-Iso-Session'
      trigger: none

extends:
  template: v2/Microsoft.Official.yml@templates
  parameters:
    platform:
      name: 'windows_undocked'

    featureFlags:
      WindowsHostVersion:
        Version: 2022
      networkisolation:
        policy: Preferred,ESRP

    cloudvault:
      enabled: false

    globalSdl:
      evidence:
        enabled: false
      # Use evidenceV2 for the new evidence format instead of deprecated v1 job.
      evidenceV2:
        enabled: true

    stages:
    - stage: vpack
      displayName: 'Create OS vpack'
      jobs:
        - job: Packaging
          pool:
            type: windows
          variables:
            # Note: all files placed in the output directory will be included in the vpack
            ob_outputDirectory: '$(Build.SourcesDirectory)\out'
            ob_createvpack_enabled: true
            ob_createvpack_packagename: 'MXC'
            ob_createvpack_owneralias: 'Tessera-mxc-admin'
            ob_createvpack_description: 'Microsoft Execution Containers'
            ob_createvpack_provData: true
            # Use semver parts: keep major.minor.patch in sync with the SDK and
            # encode the build date + per-day counter as the prerelease tag.
            # Example: sdk 0.2.0, first build on 2026-05-21 -> 0.2.0-260521.1
            ob_createvpack_versionAs: parts
            ob_createvpack_majorVer: $(SdkMajor)         # set by 'Set vpack version' step
            ob_createvpack_minorVer: $(SdkMinor)         # set by 'Set vpack version' step
            ob_createvpack_patchVer: $(SdkPatch)         # set by 'Set vpack version' step
            ob_createvpack_prereleaseVer: $(VersionDate).$(VersionCounter)
            ob_createvpack_metadata: $(Build.SourceBranchName).$(Build.BuildNumber).$(Build.SourceVersion)
            # IsolationSession collateral is test-only; continue validating the
            # production x64 and arm64 payloads outside this subtree.
            ob_sdl_codeSignValidation_excludes: '-|**\isolation_session_test_bundle\**'

          steps:
            - task: PowerShell@2
              displayName: Set vpack version
              inputs:
                targetType: inline
                script: |
                  $sdkVersion = (Get-Content "$(System.DefaultWorkingDirectory)/sdk/node/package.json" | ConvertFrom-Json).version
                  $parts = $sdkVersion.Split('.')
                  Write-Host "##vso[task.setvariable variable=SdkMajor]$($parts[0])"
                  Write-Host "##vso[task.setvariable variable=SdkMinor]$($parts[1])"
                  Write-Host "##vso[task.setvariable variable=SdkPatch]$($parts[2])"

            # `patterns` filters the download to the binary + its pdb + the
            # SBOM (_manifest/), keeping the vpack small while preserving
            # provenance metadata OneBranch's post-vpack publish requires.
            - download: MXC
              displayName: Download wxc x64 (filtered)
              artifact: wxc-binaries-x86_64-pc-windows-msvc
              patterns: |
                wxc-exec.exe
                symbols/wxc-exec.pdb
                _manifest/**

            - download: MXC
              displayName: Download wxc arm64 (filtered)
              artifact: wxc-binaries-aarch64-pc-windows-msvc
              patterns: |
                wxc-exec.exe
                symbols/wxc-exec.pdb
                _manifest/**

            # Download both isolation_session test packages (main and feature/isolation-session-internal) to stage into the vpack.
            - download: IsoSession-TestPackage
              displayName: Download isolation_session x64 (main)
              artifact: mxc-iso-test-bundle-main-x64
            
            - download: IsoSession-TestPackage
              displayName: Download isolation_session x64 (feature/isolation-session-internal)
              artifact: mxc-iso-test-bundle-feature-x64

            - task: PowerShell@2
              displayName: Validate isolation_session test bundles
              inputs:
                targetType: inline
                script: |
                  $expectedMainCommit = "$(Build.SourceVersion)".ToLowerInvariant()
                  $bundleRoot = "$(Pipeline.Workspace)\IsoSession-TestPackage"
                  $requiredFiles = @(
                      'manifest.json',
                      'bin\x64\wxc-exec.exe',
                      'inproc\mxc-sdk-isolation-session-tests.exe',
                      'inproc\sta_probe.exe',
                      'dotnet\Microsoft.Mxc.Sdk.Tests.exe',
                      'dotnet\mxc_ffi.dll',
                      'dotnet\plm.exe',
                      'node\node.exe',
                      'node\LICENSE',
                      'sdk-integration\package.json',
                      'sdk-integration\run-tests.js',
                      'test_scripts\run_isolation_session_tests.ps1',
                      'test_scripts\run_isolation_session_state_aware_tests.ps1',
                      'test_scripts\run_isolation_session_resize_smoke.ps1'
                  )
                  $requiredFeatures = @(
                      'isolation_session',
                      'dotnetsdk',
                      'test-support',
                      'node-sdk-integration'
                  )
                  $packages = @{
                      main = 'mxc-iso-test-bundle-main-x64'
                      feature = 'mxc-iso-test-bundle-feature-x64'
                  }

                  $manifests = @{}
                  foreach ($package in $packages.Keys) {
                      $root = Join-Path $bundleRoot $packages[$package]
                      foreach ($relativePath in $requiredFiles) {
                          $path = Join-Path $root $relativePath
                          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                              throw "$package test bundle is missing required file '$relativePath'."
                          }
                      }

                      $manifestPath = Join-Path $root 'manifest.json'
                      $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
                      $manifests[$package] = $manifest
                      if ("$($manifest.package)" -ne $package) {
                          throw "$package test bundle manifest identifies package '$($manifest.package)'."
                      }
                      if ("$($manifest.pipeline)" -ne 'MXC-Iso-Session') {
                          throw "$package test bundle came from '$($manifest.pipeline)', not MXC-Iso-Session."
                      }
                      foreach ($feature in $requiredFeatures) {
                          if (@($manifest.features) -notcontains $feature) {
                              throw "$package test bundle does not declare required feature '$feature'."
                          }
                      }
                  }

                  $actualMainCommit = "$($manifests.main.commit_sha)".ToLowerInvariant()
                  if ($actualMainCommit -ne $expectedMainCommit) {
                      throw "Refusing to publish stale main test bundle '$actualMainCommit'; vpack source is '$expectedMainCommit'."
                  }
                  if ("$($manifests.main.branch_name)" -ne 'mxc_main') {
                      throw "Main test bundle branch is '$($manifests.main.branch_name)', not 'mxc_main'."
                  }
                  if ("$($manifests.feature.branch_name)" -ne 'mxc_iso_session_feature') {
                      throw "Feature test bundle branch is '$($manifests.feature.branch_name)', not 'mxc_iso_session_feature'."
                  }
                  # branch_name above is only the repository resource alias; the
                  # refs those aliases resolve to are configured separately, so
                  # validate the ref each bundle was actually built from.
                  $expectedRefs = @{
                      main = 'refs/heads/main'
                      feature = 'refs/heads/feature/isolation-session-internal'
                  }
                  foreach ($package in $expectedRefs.Keys) {
                      $actualRef = "$($manifests[$package].source_ref)"
                      if ($actualRef -ne $expectedRefs[$package]) {
                          throw "$package test bundle was built from ref '$actualRef', not '$($expectedRefs[$package])'."
                      }
                  }
                  $mainBuildId = "$($manifests.main.build_id)"
                  $featureBuildId = "$($manifests.feature.build_id)"
                  if ([string]::IsNullOrWhiteSpace($mainBuildId) -or [string]::IsNullOrWhiteSpace($featureBuildId)) {
                      throw "Main and feature test bundle manifests must declare a build_id."
                  }
                  if ($mainBuildId -ne $featureBuildId) {
                      throw "Main and feature test bundles came from different MXC-Iso-Session builds."
                  }

                  Write-Host "Validated current MXC-Iso-Session bundle build $($manifests.main.build_id)."

            - task: PowerShell@2
              displayName: Stage binaries for vpack
              inputs:
                targetType: inline
                script: |
                  $src = "$(Pipeline.Workspace)\MXC"
                  Copy-Item -Recurse -Force "$src\wxc-binaries-x86_64-pc-windows-msvc"  "$(ob_outputDirectory)\x64"
                  Copy-Item -Recurse -Force "$src\wxc-binaries-aarch64-pc-windows-msvc" "$(ob_outputDirectory)\arm64"

                  # OneBranch's "Publish VPack SBOM Manifest" step expects
                  # _manifest/spdx_2.2/ at the top of VPackContents. The
                  # per-arch SBOMs are identical source-wise, so promote x64's.
                  Copy-Item -Recurse -Force "$(ob_outputDirectory)\x64\_manifest" "$(ob_outputDirectory)\_manifest"

                  # Stage isolation_session test collateral under isolation_session_test_bundle/.
                  $isoSrcMain = "$(Pipeline.Workspace)\IsoSession-TestPackage\mxc-iso-test-bundle-main-x64"
                  $isoDestMain = "$(ob_outputDirectory)\isolation_session_test_bundle\main"
                  New-Item -ItemType Directory -Force -Path $isoDestMain | Out-Null
                  Copy-Item -Recurse -Force "$isoSrcMain\*" $isoDestMain
                  
                  $isoSrcFeature = "$(Pipeline.Workspace)\IsoSession-TestPackage\mxc-iso-test-bundle-feature-x64"
                  $isoDestFeature = "$(ob_outputDirectory)\isolation_session_test_bundle\feature"
                  New-Item -ItemType Directory -Force -Path $isoDestFeature | Out-Null
                  Copy-Item -Recurse -Force "$isoSrcFeature\*" $isoDestFeature
