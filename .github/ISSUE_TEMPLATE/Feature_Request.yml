name: '🚀 Feature Request / Idea'
description: Suggest a new feature or improvement (this does not mean you have to implement it).
type: Feature
labels:
- Issue-Feature
- Needs-Triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea! A problem description or use case is
        enough to start; you do not need a finished design or a commitment
        to implement it.

        Want to work on it? Let us know so we can plan together. Maintainers
        will help discuss scope and any design review needed before implementation.
        See the
        [contribution guide](https://github.com/microsoft/mxc/blob/main/CONTRIBUTING.md#plan-features-together)
        for the next steps.
  - type: textarea
    attributes:
      label: Description of the new feature / enhancement
      placeholder: |
        A clear and concise description of what the problem is that the new feature would solve.
        Describe why and how a user would use this new functionality (if applicable).
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed technical implementation details
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: false