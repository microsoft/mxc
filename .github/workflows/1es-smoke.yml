# ============================================================================
# 1ES connectivity smoke test — proves microsoft/mxc can dispatch a job to the
# 1ES Hosted GitHub Runner pool and that its runner group grants this repo.
#
# THROWAWAY / PROOF workflow. Not part of the real CI matrix (Build.yml).
#
# Design notes:
#   * Triggers ONLY on push to this throwaway branch (NOT pull_request), so it
#     does not re-run the full mxc CI matrix on every push.
#   * 1ES.ImageOverride is intentionally OMITTED. The pool has a single image
#     (windows-25h2-pro-x64), so it defaults. If the job now picks up, an image
#     override was the culprit; if it still queues, the cause is org-level
#     authorization (1ES GitHub App repo access and/or runner-group grant for a
#     PUBLIC repo) or the 1ES scaler — NOT the labels.
#
# Pool: 1es-mxc-e2e-windows-25h2-pro-x64  (org-level, runner group 145)
# ============================================================================
name: 1ES Connectivity Smoke

on:
  push:
    branches:
      - user/modanish/1es-github-runner-e2e

permissions:
  contents: read

jobs:
  smoke:
    name: 1ES pickup
    runs-on:
      - self-hosted
      - "1ES.Pool=1es-mxc-e2e-windows-25h2-pro-x64"
    timeout-minutes: 15

    steps:
      - name: Hello from the 1ES runner
        shell: pwsh
        run: |
          Write-Host "=== Job picked up on the 1ES pool ==="
          Write-Host "Hostname   : $(hostname)"
          Write-Host "User       : $(whoami)"
          Write-Host "OS         : $([System.Environment]::OSVersion.VersionString)"
          Write-Host "RUNNER_NAME: $env:RUNNER_NAME"
          Write-Host "Cores      : $env:NUMBER_OF_PROCESSORS"

      - name: Confirm this is the expected Azure pool VM (IMDS)
        shell: pwsh
        run: |
          try {
            $c = (Invoke-RestMethod -Headers @{Metadata="true"} -NoProxy `
              -Uri "http://169.254.169.254/metadata/instance?api-version=2021-02-01").compute
            Write-Host "vmSize   : $($c.vmSize)"
            Write-Host "location : $($c.location)"
            Write-Host "vmId     : $($c.vmId)"
            if ($env:GITHUB_STEP_SUMMARY) {
              "## 1ES runner picked up`n- **vmSize**: $($c.vmSize)`n- **location**: $($c.location)`n- **host**: $(hostname)" |
                Add-Content -Path $env:GITHUB_STEP_SUMMARY
            }
          } catch {
            Write-Host "::warning::IMDS unreachable: $($_.Exception.Message)"
          }
