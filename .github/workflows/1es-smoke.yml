# ============================================================================
# 1ES connectivity smoke test — proves microsoft/mxc can dispatch a job to the
# 1ES Hosted GitHub Runner pool.
#
# THROWAWAY / PROOF workflow. Not part of the real CI matrix (Build.yml).
#
# Pool: 1es-mxc-test-2 — REPOSITORY-level pool bound directly to microsoft/mxc
# (runner group 1 / Default). Confirmed working: run 30931840357 registered
# runner 21 (bf347e45c000000) after a ~10.5-min COLD start on the idle pool.
#
# NOTE: uses `shell: powershell` (Windows PowerShell 5.1) because the raw
# windows-25h2-pro-x64 CLIENT image ships powershell.exe, NOT pwsh.exe (PS7).
# Cold-start pickup on an idle Stateless pool is ~10-11 min — allow a full 15.
# ============================================================================
name: 1ES Connectivity Smoke

on:
  push:
    branches:
      - user/modanish/1es-github-runner-e2e

permissions:
  contents: read

jobs:
  smoke:
    name: 1ES pickup
    runs-on:
      - self-hosted
      - "1ES.Pool=1es-mxc-test-2"
      - "JobId=smoke-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
    timeout-minutes: 15

    steps:
      - name: Hello from the 1ES runner
        shell: powershell
        run: |
          Write-Host "=== Job picked up on the 1ES pool ==="
          Write-Host "Hostname   : $(hostname)"
          Write-Host "User       : $(whoami)"
          Write-Host "OS         : $([System.Environment]::OSVersion.VersionString)"
          Write-Host "PSVersion  : $($PSVersionTable.PSVersion)"
          Write-Host "RUNNER_NAME: $env:RUNNER_NAME"
          Write-Host "Cores      : $env:NUMBER_OF_PROCESSORS"

      - name: Confirm this is the expected Azure pool VM (IMDS)
        shell: powershell
        run: |
          try {
            $c = (Invoke-RestMethod -Headers @{Metadata="true"} `
              -Uri "http://169.254.169.254/metadata/instance?api-version=2021-02-01").compute
            Write-Host "vmSize   : $($c.vmSize)"
            Write-Host "location : $($c.location)"
            Write-Host "vmId     : $($c.vmId)"
            if ($env:GITHUB_STEP_SUMMARY) {
              "## 1ES runner picked up`n- **vmSize**: $($c.vmSize)`n- **location**: $($c.location)`n- **host**: $(hostname)" |
                Add-Content -Path $env:GITHUB_STEP_SUMMARY
            }
          } catch {
            Write-Host "::warning::IMDS unreachable: $($_.Exception.Message)"
          }
