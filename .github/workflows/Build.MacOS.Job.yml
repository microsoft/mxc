name: macOS Build

on:
  workflow_call:

jobs:
  build:
    name: arm64
    runs-on: macos-15
    # A wedged PTY child would otherwise hold the runner for the 6-hour cap.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actions-rust-lang/setup-rust-toolchain auto-reads rust-toolchain.toml
      # from the repo root only. Surface src/rust-toolchain.toml there so the
      # 1.93 pin is honored without duplicating the version in this workflow.
      - name: Surface toolchain file at repo root
        shell: bash
        working-directory: ${{ github.workspace }}
        run: cp src/rust-toolchain.toml rust-toolchain.toml

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: aarch64-apple-darwin
          components: rustfmt, clippy
          override: false
          rustflags: ''

      - name: Point cargo at the MxcDependencies feed
        uses: ./.github/actions/setup-cargo-feed

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src -> target
          key: aarch64-apple-darwin-v2
          cache-on-failure: false

      # Mac uses package selection rather than feature selection — the
      # workspace has Windows-only crates that won't compile here.
      # unix_test_proxy and mxc_ffi ship alongside mxc-exec-mac.
      - name: Build
        run: cargo build --locked --release --target aarch64-apple-darwin
             -p mxc_darwin -p mxc-sdk -p unix_test_proxy -p mxc_ffi

      # mxc-sdk includes the Seatbelt executor characterization tests.
      # mxc-exec-mac (built above via -p mxc_darwin) is what they drive; the
      # tests skip via has_platform_exec() if it is missing. sandbox_init needs
      # no elevation, so they run in this standard macOS job.
      - name: Test
        run: |
          cargo test --locked --release --target aarch64-apple-darwin \
            -p mxc_darwin -p mxc-sdk

      - name: Test state-aware SDK boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release --target aarch64-apple-darwin -p mxc-sdk -p mxc_ffi --lib state_aware
          cargo test --locked --release --target aarch64-apple-darwin -p mxc-sdk --test state_aware

      # Preparation without observations is a no-op on every OS; Seatbelt
      # rejects observations it cannot apply. A filter that matches nothing
      # also exits 0, so require a passing count with nothing ignored.
      - name: Test policy preparation without observations
        shell: bash
        run: |
          set -uo pipefail
          run_pinned() {
            local label="$1"; shift
            local log status
            log="$(mktemp)"
            cargo test --locked --release --target aarch64-apple-darwin "$@" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              echo "::error::$label failed (cargo exited $status)."
              exit "$status"
            fi
            if ! grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then
              echo "::error::$label must run at least one test and ignore none."
              exit 1
            fi
          }
          run_pinned "Policy preparation" -p mxc-sdk --lib mxc_engine::policy_preparation
          run_pinned "Policy preparation FFI" -p mxc_ffi --lib policy_preparation
          # The module selections stay green if the no-op tests are renamed.
          run_pinned "Policy preparation no-op" -p mxc-sdk --lib \
            preparation_returns_empty_observation_requests_unchanged_on_every_backend
          run_pinned "Policy preparation FFI no-op" -p mxc_ffi --lib \
            preparation_ffi_returns_empty_observation_requests_unchanged_on_every_backend

      - name: Test W365 checkout and release with trusted TLS fixtures
        shell: bash
        run: |
          set -euo pipefail
          names="$(cargo test --locked -p mxc-sdk --test w365_lifecycle --features test-support --target aarch64-apple-darwin --target-dir target/w365-fixture -- --list)"
          for name in lifecycle_contract_and_recovery_fixture transport_deadlines_fixture; do
            grep -Fxq "${name}: test" <<< "$names"
          done
          cargo test --locked -p mxc-sdk --test w365_lifecycle --features test-support --target aarch64-apple-darwin --target-dir target/w365-fixture -- --include-ignored

      - name: Test Seatbelt streaming and PTY
        run: cargo test --locked --release --target aarch64-apple-darwin
             -p mxc-sdk --test streaming

      - name: Verify artifact payload
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/aarch64-apple-darwin/release"
          for file in mxc-exec-mac unix-test-proxy libmxc_ffi.dylib; do
            if [[ ! -f "$bin_dir/$file" ]]; then
              echo "Missing artifact file: $file" >&2
              exit 1
            fi
          done

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mxc-binaries-aarch64-apple-darwin
          path: |
            src/target/aarch64-apple-darwin/release/mxc-exec-mac
            src/target/aarch64-apple-darwin/release/unix-test-proxy
            src/target/aarch64-apple-darwin/release/libmxc_ffi.dylib
          if-no-files-found: error
          retention-days: 1
