name: Windows Module Lifetime Fixtures

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            features: hyperlight isolation_session microvm wslc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            features: isolation_session wslc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Surface toolchain file at repo root
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: Copy-Item src\rust-toolchain.toml rust-toolchain.toml

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          override: false
          rustflags: ''
          cache: false

      - name: Point cargo at the MxcDependencies feed
        uses: ./.github/actions/setup-cargo-feed

      - name: Restore fixture dependencies
        id: fixture-cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src -> target
          key: windows-module-fixture-${{ matrix.target }}-v1
          cache-on-failure: false

      - name: Seed cold fixture dependencies from the workspace cache
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src -> target
          shared-key: windows-tests-${{ matrix.target }}-v2-test
          save-if: false
          cache-on-failure: false

      - name: Force hyperlight-host rebuild (cache workaround)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: cargo clean --release --target ${{ matrix.target }} -p hyperlight-host

      - name: Build module lifetime regression fixture
        run: cargo build --locked --release --target ${{ matrix.target }}
             -p mxc-sdk --example module_lifetime_fixture
             --no-default-features --features "${{ matrix.features }}"

      - name: Require the fixture library and debug symbols
        shell: pwsh
        run: |
          foreach ($name in 'module_lifetime_fixture.dll', 'module_lifetime_fixture.pdb') {
            $path = Join-Path 'target\${{ matrix.target }}\release\examples' $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing module lifetime fixture output: $path"
            }
          }

      - name: Upload module lifetime regression fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-module-lifetime-fixture-${{ matrix.target }}
          path: |
            src/target/${{ matrix.target }}/release/examples/module_lifetime_fixture.dll
            src/target/${{ matrix.target }}/release/examples/module_lifetime_fixture.pdb
          if-no-files-found: error
          retention-days: 1
