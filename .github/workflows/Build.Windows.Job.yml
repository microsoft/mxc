name: Windows Build

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            features: hyperlight isolation_session microvm wslc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            # Hyperlight and MicroVM runtimes are x64-only.
            features: isolation_session wslc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test loopback command quoting
        shell: pwsh
        run: ..\tests\scripts\test_loopback_anchor_command.ps1

      - name: Test bounded native output capture
        shell: pwsh
        run: ..\tests\scripts\test_native_process_container_capture.ps1

      - name: Test native policy result oracles
        shell: pwsh
        run: ..\tests\scripts\test_native_policy_results.ps1

      - name: Test SDK suite execution gates
        shell: pwsh
        run: ..\tests\scripts\test_sdk_suite_results.ps1

      - name: Test isolation session network classifier
        shell: pwsh
        run: ..\tests\scripts\test_isolation_session_network_classifier.ps1

      # actions-rust-lang/setup-rust-toolchain auto-reads rust-toolchain.toml
      # from the repo root only. Surface src/rust-toolchain.toml there so the
      # 1.93 pin is honored without duplicating the version in this workflow.
      - name: Surface toolchain file at repo root
        shell: bash
        working-directory: ${{ github.workspace }}
        run: cp src/rust-toolchain.toml rust-toolchain.toml

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          components: rustfmt, clippy
          override: false
          rustflags: ''
          cache: false

      - name: Point cargo at the MxcDependencies feed
        uses: ./.github/actions/setup-cargo-feed

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src -> target
          key: windows-validation-${{ matrix.target }}-v1
          cache-targets: true
          cache-on-failure: false

      - name: Download shared Windows build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-build-snapshot-${{ matrix.target }}
          path: ${{ runner.temp }}/windows-build

      - name: Restore shared Windows build
        shell: pwsh
        run: |
          & ..\scripts\ci\cargo-build-snapshot.ps1 -Mode Restore `
            -Archive (Join-Path $env:RUNNER_TEMP 'windows-build\windows-build.tar.zst') `
            -Target '${{ matrix.target }}'

      - name: Test and stage filesystem probe request deadlines
        shell: pwsh
        run: |
          $messages = @(cargo test --locked --release --target '${{ matrix.target }}' `
            -p mxc-sdk --features wslc --lib --no-run --message-format=json)
          if ($LASTEXITCODE -ne 0) { throw 'Building filesystem probe tests failed.' }
          $payload = @($messages | ConvertFrom-Json | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'mxc_sdk' -and
            $_.profile.test -and $_.executable
          })
          if ($payload.Count -ne 1) { throw 'Expected one filesystem probe test executable.' }
          $destination = 'target\${{ matrix.target }}\release\mxc-filesystem-probe-tests.exe'
          Copy-Item -LiteralPath $payload[0].executable -Destination $destination -Force
          $tests = @(& $destination --list --ignored)
          if ($LASTEXITCODE -ne 0) { throw 'Listing filesystem probe tests failed.' }
          foreach ($case in 'wslc_launch_rejects_stalled_paths', 'wslc_provision_rejects_stalled_paths',
              'wslc_overlap_rejects_stalls', 'wslc_provision_overlap_rejects_stalls') {
            $name = "core_modules::mxc_common::filesystem_probe::launch_tests::scenarios::$case"
            if ($tests -notcontains "${name}: test") { throw "Missing regression: $name" }
          }
          & $destination --ignored filesystem_probe::launch_tests::
          if ($LASTEXITCODE -ne 0) { throw 'Filesystem probe request regression failed.' }

      - name: Test MicroVM validation infrastructure
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: ${{ github.workspace }}
        run: node --test scripts/tests/microvm-validation.test.js

      - name: Test NuGet release package selection
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: ${{ github.workspace }}
        shell: powershell
        run: ./scripts/ci/test-nuget-release-selection.ps1

      - name: Test npm release package selection
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: ${{ github.workspace }}
        shell: powershell
        run: ./scripts/ci/test-npm-release-selection.ps1

      - name: Verify packaged MicroVM tests
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          ACI_EDGE_SANDBOXES_AGENT_BUNDLE_DIR: ${{ github.workspace }}\src\target\${{ matrix.target }}\release\aci-edge-sandboxes
        run: |
          & ./scripts/ci/Invoke-CratePackage.ps1 `
            -OutDir (Join-Path $env:RUNNER_TEMP 'microvm-crate') `
            -VerifyMicrovmTests

      - name: Stage SDK MicroVM tests for scheduled validation
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          & ./scripts/ci/stage-nvx-validation-tests.ps1 `
            -BinaryDirectory 'src/target/${{ matrix.target }}/release' `
            -Features '${{ matrix.features }}'

      - name: Build debug executor for isolated telemetry smoke tests
        env:
          MXC_TELEMETRY_COMPONENT_PATH: ''
          MXC_TELEMETRY_TEST_KEYWORDS: '1'
        run: cargo build --locked -p wxc --features "test-support isolation_session"

      - name: Test telemetry ETW assertions, lifecycle requests and consent fixtures
        shell: pwsh
        run: ..\tests\scripts\test_telemetry_etw_assertions.ps1 -WxcExePath target\debug\wxc-exec.exe

      - name: Upload local-only telemetry test executor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telemetry-test-executor-${{ matrix.target }}
          path: src/target/debug/wxc-exec.exe
          if-no-files-found: error
          retention-days: 1

      - name: Run isolated telemetry consent smoke test
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: tests\scripts\run_telemetry_consent_smoke_test.ps1 -BinDir src\target\debug

      - name: Run isolated telemetry ETW smoke test
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: tests\scripts\run_telemetry_etw_smoke_test.ps1 -BinDir src\target\debug -CheckKeywords

      # Mutates the real consent store and HKLM policy, so it is confined to
      # the ephemeral GitHub-hosted runners this job declares.
      - name: Run release-path telemetry consent test
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          tests\scripts\run_telemetry_consent_release_test.ps1 `
            -BinDir src\target\${{ matrix.target }}\release `
            -AcceptRealMachineMutation `
            -RequirePolicyCeiling

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wxc-binaries-${{ matrix.target }}
          path: |
            src/target/${{ matrix.target }}/release/wxc-exec.exe
            src/target/${{ matrix.target }}/release/wxc-windows-sandbox-daemon.exe
            src/target/${{ matrix.target }}/release/wxc-windows-sandbox-guest.exe
            src/target/${{ matrix.target }}/release/wxc-wslc-daemon.exe
            src/target/${{ matrix.target }}/release/wxc-test-proxy.exe
            src/target/${{ matrix.target }}/release/mxc-diagnostic-console.exe
            src/target/${{ matrix.target }}/release/mxc_ffi.dll
            src/target/${{ matrix.target }}/release/wslcsdk.dll
            src/target/${{ matrix.target }}/release/mxc-wslc-gateway.tar
            src/target/${{ matrix.target }}/release/wxc-ui-probe.exe
            src/target/${{ matrix.target }}/release/wxc-test-driver.exe
            src/target/${{ matrix.target }}/release/nvx-e2e-tests.exe
            src/target/${{ matrix.target }}/release/mxc-filesystem-probe-tests.exe
            src/target/${{ matrix.target }}/release/aci-edge-sandboxes/
          if-no-files-found: error
          retention-days: 1

  telemetry-component-check:
    name: Telemetry component (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Surface toolchain file at repo root
        shell: pwsh
        run: Copy-Item src\rust-toolchain.toml rust-toolchain.toml

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          override: false
          rustflags: ''

      - name: Point cargo at the MxcDependencies feed
        uses: ./.github/actions/setup-cargo-feed

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src -> target/telemetry-component-check
          key: telemetry-component-${{ matrix.arch }}
          cache-on-failure: false

      - name: Verify telemetry component build checks
        shell: pwsh
        run: .\scripts\ci\check-telemetry-component.ps1

      - name: Test telemetry consent and policy in release mode
        working-directory: src
        env:
          CARGO_TARGET_DIR: target/telemetry-component-check
        run: |
          cargo test --locked --release --target ${{ matrix.target }} -p mxc-sdk --lib mxc_common::telemetry::consent
          cargo test --locked --release --target ${{ matrix.target }} -p mxc-sdk --lib mxc_common::telemetry::policy

  result:
    name: Windows validation
    needs: [build, telemetry-component-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm artifact and telemetry validation passed
        env:
          ARTIFACT_RESULT: ${{ needs.build.result }}
          TELEMETRY_RESULT: ${{ needs.telemetry-component-check.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ARTIFACT_RESULT" = success
          test "$TELEMETRY_RESULT" = success
