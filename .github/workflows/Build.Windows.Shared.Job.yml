name: Shared Windows Build

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            features: hyperlight isolation_session microvm wslc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            features: isolation_session wslc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Surface toolchain file at repo root
        shell: bash
        working-directory: ${{ github.workspace }}
        run: cp src/rust-toolchain.toml rust-toolchain.toml

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          override: false
          rustflags: ''
          cache: false

      - name: Select the pinned Windows Rust linker
        uses: ./.github/actions/setup-windows-linker
        with:
          target: ${{ matrix.target }}

      - name: Test Windows linker DLL interoperability and debug symbols
        working-directory: ${{ github.workspace }}
        env:
          MXC_RUST_TEST_TARGET: ${{ matrix.target }}
        run: node --test scripts/tests/windows-linker.test.js

      - name: Point cargo at the MxcDependencies feed
        uses: ./.github/actions/setup-cargo-feed

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src -> target
          key: ${{ matrix.target }}-v2
          cache-on-failure: false

      - name: Force hyperlight-host rebuild (cache workaround)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: cargo clean --release --target ${{ matrix.target }} -p hyperlight-host

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
             --no-default-features
             --features "${{ matrix.features }}"

      - name: Save reusable Cargo build snapshot
        shell: pwsh
        run: |
          & ..\scripts\ci\cargo-build-snapshot.ps1 -Mode Save `
            -Archive (Join-Path $env:RUNNER_TEMP 'windows-build.tar') `
            -Target '${{ matrix.target }}'

      - name: Upload reusable Cargo build snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build-snapshot-${{ matrix.target }}
          path: ${{ runner.temp }}/windows-build.tar
          compression-level: 1
          if-no-files-found: error
          retention-days: 1

  result:
    name: Shared Windows build
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm both shared builds passed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
