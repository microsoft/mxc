name: Isolation Session Test Bundle

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Surface toolchain file at repo root
        shell: bash
        run: cp src/rust-toolchain.toml rust-toolchain.toml

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          override: false
          rustflags: ''

      - name: Point cargo at the MxcDependencies feed
        uses: ./.github/actions/setup-cargo-feed

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The bundle ships this Node, which must meet the SDK's Windows
      # native-stdio requirement.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Build bundle
        shell: pwsh
        env:
          BUNDLE_ARCH: ${{ matrix.arch }}
          BUNDLE_PIPELINE: ${{ github.workflow }}
          BUNDLE_BRANCH: ${{ github.ref_name }}
          BUNDLE_REF: ${{ github.ref }}
          BUNDLE_BUILD_ID: ${{ github.run_id }}
        run: |
          & ./scripts/ci/build-isolation-session-test-bundle.ps1 `
            -Architecture $env:BUNDLE_ARCH `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'isolation-session-bundle') `
            -Pipeline $env:BUNDLE_PIPELINE `
            -BranchName $env:BUNDLE_BRANCH `
            -SourceRef $env:BUNDLE_REF `
            -BuildId $env:BUNDLE_BUILD_ID

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolation-session-test-bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/isolation-session-bundle
          if-no-files-found: error
          retention-days: 1
