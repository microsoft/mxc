name: Package Lock Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package-lock-check:
    name: Package Lock Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check package locks use npmjs and SHA-512 integrity
        run: node scripts/versioning/check-package-lock-integrity.js
