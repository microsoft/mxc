name: Package Lock Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package-lock-check:
    name: Package Lock Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Check package locks use npmjs and SHA-512 integrity
        run: node scripts/versioning/check-package-lock-integrity.js
