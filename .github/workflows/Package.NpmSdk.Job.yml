name: Package NPM SDK

on:
  workflow_call:

jobs:
  package-npm-sdk:
    name: Package NPM SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json

      # Download all five build artifacts into the sdk/node/bin layout the SDK
      # packager expects. Windows-x64 + Linux-x64 both land under bin/x64
      # but the binaries have disjoint filenames so they don't collide.
      - name: Download wxc-binaries x64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wxc-binaries-x86_64-pc-windows-msvc
          path: sdk/node/bin/x64
      - name: Download wxc-binaries arm64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wxc-binaries-aarch64-pc-windows-msvc
          path: sdk/node/bin/arm64
      - name: Download lxc-binaries x64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lxc-binaries-x86_64-unknown-linux-gnu
          path: sdk/node/bin/x64
      - name: Download lxc-binaries arm64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lxc-binaries-aarch64-unknown-linux-gnu
          path: sdk/node/bin/arm64
      - name: Download mxc-binaries arm64 (mac)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mxc-binaries-aarch64-apple-darwin
          path: sdk/node/bin/arm64

      # Artifact downloads strip Unix execute permissions. Restore +x.
      # Path is `bin` (not `sdk/node/bin`) because of the job's working-directory default.
      - name: Restore execute permissions
        shell: bash
        run: |
          set -euo pipefail
          for name in lxc-exec unix-test-proxy mxc-exec-mac; do
            find bin -name "$name" -exec chmod +x {} +
          done

      - run: npm ci
      - run: npm run build
      - run: npm pack

      - name: Upload SDK package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: sdk/node/*.tgz
          if-no-files-found: error
          retention-days: 1
