name: Package NPM SDK

on:
  workflow_call:

jobs:
  package-npm-sdk:
    name: Package NPM SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json

      # Download the per-target build artifacts into the sdk/node/bin layout
      # the SDK packager expects, then prune executor-only payloads so the npm
      # package keeps only the in-process runtime libraries and sidecars.
      - name: Download wxc-binaries x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wxc-binaries-x86_64-pc-windows-msvc
          path: sdk/node/bin/x64
      - name: Download wxc-binaries arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wxc-binaries-aarch64-pc-windows-msvc
          path: sdk/node/bin/arm64
      - name: Download lxc-binaries x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lxc-binaries-x86_64-unknown-linux-gnu
          path: sdk/node/bin/x64
      - name: Download lxc-binaries arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lxc-binaries-aarch64-unknown-linux-gnu
          path: sdk/node/bin/arm64
      - name: Download mxc-binaries arm64 (mac)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mxc-binaries-aarch64-apple-darwin
          path: sdk/node/bin/arm64

      # Pipeline artifacts contain the full backend build outputs. The Node SDK
      # package no longer ships the standalone executors or unix-test-proxy.
      - name: Prune executor-only package payloads
        shell: bash
        run: |
          set -euo pipefail
          for name in wxc-exec.exe lxc-exec mxc-exec-mac unix-test-proxy; do
            find bin -name "$name" -type f -delete
          done
          find bin -type d -name symbols -prune -exec rm -rf {} +

      - run: npm ci
      - run: npm run build
      - run: npm pack

      - name: Upload SDK package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: sdk/node/*.tgz
          if-no-files-found: error
          retention-days: 1
