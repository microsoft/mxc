name: Windows SDK Test Bundle

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Surface toolchain file at repo root
        shell: bash
        run: cp src/rust-toolchain.toml rust-toolchain.toml

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: ${{ matrix.target }}
          override: false
          rustflags: ''

      - name: Point cargo at the MxcDependencies feed
        uses: ./.github/actions/setup-cargo-feed

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # The bundle ships this Node, which must meet the SDK's Windows
      # native-stdio requirement.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Build bundle
        shell: pwsh
        env:
          BUNDLE_ARCH: ${{ matrix.arch }}
          BUNDLE_PIPELINE: ${{ github.workflow }}
          BUNDLE_BRANCH: ${{ github.ref_name }}
          BUNDLE_REF: ${{ github.ref }}
          BUNDLE_BUILD_ID: ${{ github.run_id }}
        run: |
          & ./scripts/ci/build-windows-sdk-test-bundle.ps1 `
            -Architecture $env:BUNDLE_ARCH `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'windows-sdk-bundle') `
            -Pipeline $env:BUNDLE_PIPELINE `
            -BranchName $env:BUNDLE_BRANCH `
            -SourceRef $env:BUNDLE_REF `
            -BuildId $env:BUNDLE_BUILD_ID

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-sdk-test-bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/windows-sdk-bundle
          if-no-files-found: error
          retention-days: 1
