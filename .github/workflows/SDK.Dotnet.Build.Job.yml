name: SDK .NET Build

on:
  workflow_call:

jobs:
  sdk-dotnet-build:
    name: SDK .NET Build (${{ matrix.os_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_label: windows
            runner: windows-latest
          - os_label: linux
            runner: ubuntu-latest
          - os_label: macos
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: sdk/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The csproj regenerates the P/Invoke layer by invoking cargo, so this
      # lane needs the Rust toolchain.
      - name: Setup Rust toolchain
        run: rustup update stable

      # Exercise the opt-in backend build as one complete native unit. The
      # managed tests dry-run both backends and verify WSLC's daemon + SDK DLL
      # were propagated into the application output.
      - name: Build .NET SDK
        run: dotnet build Microsoft.Mxc.Sdk.slnx

      - name: Test default backend availability
        run: dotnet test Microsoft.Mxc.Sdk.Tests/Microsoft.Mxc.Sdk.Tests.csproj --no-build --no-restore

      - name: Build .NET SDK with optional backends
        if: matrix.os_label == 'windows'
        run: dotnet build Microsoft.Mxc.Sdk.slnx -p:MxcWithWslc=true -p:MxcWithIsolationSession=true

      - name: Test optional backend availability
        if: matrix.os_label == 'windows'
        run: dotnet test Microsoft.Mxc.Sdk.Tests/Microsoft.Mxc.Sdk.Tests.csproj --no-build --no-restore -p:MxcWithWslc=true -p:MxcWithIsolationSession=true
