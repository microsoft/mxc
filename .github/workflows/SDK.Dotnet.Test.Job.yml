name: SDK .NET Tests

on:
  workflow_call:

jobs:
  sdk-dotnet-tests:
    name: SDK .NET Tests (${{ matrix.name_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_label: windows
            name_label: windows
            runner: windows-latest
          - os_label: linux
            name_label: linux-ubuntu24.04
            runner: ubuntu-24.04
          - os_label: linux
            name_label: linux-ubuntu26.04
            runner: ubuntu-26.04
          - os_label: macos
            name_label: macos
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: sdk/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Install the pinned toolchain before parallel framework builds invoke rustc.
      - name: Surface toolchain file at repo root
        shell: bash
        working-directory: ${{ github.workspace }}
        run: cp src/rust-toolchain.toml rust-toolchain.toml

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          override: false
          rustflags: ''

      - name: Build .NET SDK
        run: dotnet build Microsoft.Mxc.Sdk.slnx

      # `--no-build` reuses the compile above rather than repeating it.
      #
      # Tests that spawn real sandboxes gate on MXC_E2E_PSEC_CAPABLE_HOST, which
      # this job deliberately leaves unset, so they skip on every runner here.
      # The isolation-session tests gate on the SDK's backend probe, and this
      # lane does not build that backend. Both report as skips, so what this
      # lane establishes is the managed surface plus the native library loading
      # on this platform.
      # The scheduled ProcessContainer jobs run MxcProcessTests from the Windows
      # SDK test bundle with the PSEC switch enabled and reject skipped tests.
      #
      # A zero exit code is not sufficient evidence on its own, because a run in
      # which every test skipped also exits 0. Parsing the summary is what
      # separates "passed" from "ran nothing".
      - name: Test default backend availability
        shell: pwsh
        run: |
          foreach ($framework in @('net8.0', 'net10.0')) {
            $log = Join-Path $env:RUNNER_TEMP "dotnet-test-$framework.log"
            dotnet test --solution Microsoft.Mxc.Sdk.slnx --framework $framework --no-build 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -ne 0) { throw "$framework dotnet test exited $code" }
            $out = Get-Content -LiteralPath $log -Raw
            if ($out -notmatch 'succeeded:\s+(\d+)') {
              throw "$framework test summary could not be parsed, so nothing establishes what ran."
            }
            if ([int]$Matches[1] -eq 0) {
              throw "$framework passed no tests. A run in which everything skipped is not a pass."
            }
            Write-Host "$framework`: $($Matches[1]) tests passed"
          }

      # LXC creates, starts, and attaches to a system container, so the suite
      # above can only skip it. This installs the substrate and reruns just
      # those tests as root.
      - name: Install LXC
        if: matrix.os_label == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # Runner images can carry package indexes referencing versions the
          # mirrors have already dropped, so a single update is a flaky gate.
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to refresh Linux package indexes after $attempt attempts"
              exit 1
            fi
            sleep 5
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            lxc lxc-templates busybox-static iptables debootstrap uidmap bridge-utils

      - name: Configure unprivileged LXC
        if: matrix.os_label == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          for file in /etc/lxc/default.conf /etc/subuid /etc/subgid; do
            sudo cp -a "$file" "$RUNNER_TEMP/mxc-lxc-$(basename "$file")"
          done
          sudo bash -c 'echo "root:100000:65536" >> /etc/subuid'
          sudo bash -c 'echo "root:100000:65536" >> /etc/subgid'

          # Remove existing mappings before adding the test-only UID/GID range.
          sudo sed -i '/idmap/d' /etc/lxc/default.conf
          sudo bash -c 'echo "lxc.idmap = u 0 100000 65536" >> /etc/lxc/default.conf'
          sudo bash -c 'echo "lxc.idmap = g 0 100000 65536" >> /etc/lxc/default.conf'

      # The policy these tests use permits no network, so the container starts
      # with no interface and the runner's Docker-set FORWARD policy cannot
      # reach them.
      #
      # MXC_LXC_TESTS_REQUIRE_EXECUTION turns an honest skip into a failure:
      # this step exists to execute them, so a skip means a prerequisite
      # disappeared and the gate would go green having tested nothing. The
      # count is checked for the same reason: a filter that selects no test
      # also exits 0.
      - name: Test the LXC backend
        if: matrix.os_label == 'linux'
        shell: bash
        env:
          MXC_LXC_TESTS_REQUIRE_EXECUTION: "1"
        run: |
          set -uo pipefail
          for framework in net8.0 net10.0; do
            log="$RUNNER_TEMP/dotnet-test-lxc-$framework.log"
            sudo --preserve-env=MXC_LXC_TESTS_REQUIRE_EXECUTION,PATH,HOME,DOTNET_ROOT \
              "$(command -v dotnet)" test \
              --project Microsoft.Mxc.Sdk.Tests/Microsoft.Mxc.Sdk.Tests.csproj \
              --framework "$framework" \
              --no-build --no-restore -- --filter-method '*MxcContainerLxcE2ETests*' 2>&1 | tee "$log"
            # Read the test command's status, not tee's, before trusting counts.
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              echo "::error::$framework dotnet test exited $status"
              exit "$status"
            fi
            if ! grep -qE 'succeeded: *[1-9]' "$log"; then
              echo "::error::$framework selected no passing LXC test."
              exit 1
            fi
          done

      - name: Restore LXC configuration
        if: always() && matrix.os_label == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          for file in /etc/lxc/default.conf /etc/subuid /etc/subgid; do
            backup="$RUNNER_TEMP/mxc-lxc-$(basename "$file")"
            if [ -f "$backup" ]; then
              sudo mv "$backup" "$file"
            fi
          done

      # This regression requires Linux and a usable Bubblewrap. Install it in
      # the Linux lane and make an unavailable backend fail instead of skip.
      - name: Install Bubblewrap
        if: matrix.os_label == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          command -v bwrap

      # Filter to this one method and verify exactly one successful test, so
      # unrelated .NET tests cannot make this regression gate pass.
      - name: Test Bubblewrap thread lifetime
        if: matrix.os_label == 'linux'
        shell: bash
        env:
          MXC_BWRAP_TESTS_REQUIRE_EXECUTION: "1"
        run: |
          set -uo pipefail
          for framework in net8.0 net10.0; do
            log="$RUNNER_TEMP/dotnet-test-bubblewrap-$framework.log"
            dotnet test \
              --project Microsoft.Mxc.Sdk.Tests/Microsoft.Mxc.Sdk.Tests.csproj \
              --framework "$framework" \
              --no-build --no-restore -- \
              --filter-method '*MxcContainerBubblewrapE2ETests.Spawn_OutlivesTheThreadThatSpawnedIt*' \
              2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              echo "::error::$framework dotnet test exited $status"
              exit "$status"
            fi
            if ! grep -qE 'total: *1' "$log" || ! grep -qE 'succeeded: *1' "$log"; then
              echo "::error::$framework Bubblewrap thread-lifetime regression did not run and pass exactly once."
              exit 1
            fi
          done

      # Exercise the opt-in backends as one complete native unit. The managed
      # tests dry-run both backends and verify WSLC's daemon + SDK DLL were
      # propagated into the application output.
      - name: Build .NET SDK with optional backends
        if: matrix.os_label == 'windows'
        run: dotnet build Microsoft.Mxc.Sdk.slnx -p:MxcWithWslc=true -p:MxcWithIsolationSession=true

      # Guarded the same way as the default lane, and for the same reason: most
      # tests here are host-gated, so a zero exit code alone cannot distinguish
      # a passing run from one in which everything skipped.
      - name: Test optional backend availability
        if: matrix.os_label == 'windows'
        shell: pwsh
        run: |
          foreach ($framework in @('net8.0', 'net10.0')) {
            $log = Join-Path $env:RUNNER_TEMP "dotnet-test-optional-$framework.log"
            dotnet test --project Microsoft.Mxc.Sdk.Tests/Microsoft.Mxc.Sdk.Tests.csproj --framework $framework --no-build --no-restore -p:MxcWithWslc=true -p:MxcWithIsolationSession=true 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -ne 0) { throw "$framework dotnet test exited $code" }
            $out = Get-Content -LiteralPath $log -Raw
            if ($out -notmatch 'succeeded:\s+(\d+)') {
              throw "$framework test summary could not be parsed, so nothing establishes what ran."
            }
            if ([int]$Matches[1] -eq 0) {
              throw "$framework passed no tests. A run in which everything skipped is not a pass."
            }
            Write-Host "$framework`: $($Matches[1]) tests passed"
          }

      # The count above cannot tell this lane apart from the default one: the
      # feature-specific tests pick their branch with #if, so enabling the
      # features swaps which assertions run rather than adding tests. Pin those
      # two by name, so the lane fails if either is ever host-gated and silently
      # stops covering the enabled branch this job exists to verify.
      - name: Verify optional backends were actually exercised
        if: matrix.os_label == 'windows'
        shell: pwsh
        run: |
          foreach ($framework in @('net8.0', 'net10.0')) {
            $log = Join-Path $env:RUNNER_TEMP "dotnet-test-optional-pin-$framework.log"
            dotnet test --project Microsoft.Mxc.Sdk.Tests/Microsoft.Mxc.Sdk.Tests.csproj --framework $framework --no-build --no-restore -p:MxcWithWslc=true -p:MxcWithIsolationSession=true -- --filter-method '*BuildSwitch*' 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -ne 0) { throw "$framework backend-switch pin exited $code" }
            $out = Get-Content -LiteralPath $log -Raw
            if ($out -notmatch 'succeeded:\s+2' -or $out -notmatch 'skipped:\s+0') {
              throw "$framework must run and pass both backend-switch tests with none skipped."
            }
            Write-Host "$framework optional backend switches verified against native availability."
          }

      # Native AOT publish gate for the SDK's JSON layer, on every OS matrix job.
      - name: AOT publish gate (SDK JSON layer)
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($IsLinux) {
            sudo apt-get update
            sudo apt-get install -y clang zlib1g-dev
            if ($LASTEXITCODE -ne 0) { throw 'Failed to install Native AOT prerequisites (clang, zlib1g-dev).' }
            $rid = "linux-$arch"; $exeName = 'Microsoft.Mxc.Sdk.AotSmokeTest'
          }
          elseif ($IsMacOS) { $rid = "osx-$arch"; $exeName = 'Microsoft.Mxc.Sdk.AotSmokeTest' }
          else { $rid = "win-$arch"; $exeName = 'Microsoft.Mxc.Sdk.AotSmokeTest.exe' }
          foreach ($framework in @('net8.0', 'net10.0')) {
            $log = Join-Path $env:RUNNER_TEMP "dotnet-aot-publish-$framework.log"
            $pub = Join-Path $env:RUNNER_TEMP "aot-smoke-publish-$framework"
            dotnet publish Microsoft.Mxc.Sdk.AotSmokeTest -c Release -f $framework -r $rid -o $pub --nologo 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw "$framework AOT publish exited $LASTEXITCODE" }
            $out = Get-Content -LiteralPath $log -Raw
            if ($out -match 'warning IL|AOT analysis|Trim analysis') {
              throw "$framework AOT publish emitted an IL/AOT/trim warning. The SDK JSON layer is no longer reflection-free."
            }
            $exe = Join-Path $pub $exeName
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Published AOT executable not found: $exe" }
            & $exe
            if ($LASTEXITCODE -ne 0) { throw "$framework AOT smoke test exited $LASTEXITCODE" }
            Write-Host "AOT publish gate passed on ${rid} (${framework}): reflection-free JSON layer verified."
          }

      - name: Test packed .NET SDK outside the checkout
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\ci\test-dotnet-package.ps1')
