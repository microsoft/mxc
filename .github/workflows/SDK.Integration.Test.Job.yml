name: SDK Integration Tests

on:
  workflow_call:

jobs:
  sdk-integration-tests:
    name: SDK Integration Tests (${{ matrix.name_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name_label: windows-node24
            os_label: windows
            runner: windows-latest
            node_version: 24.21.0
          - name_label: windows-node26
            os_label: windows
            runner: windows-latest
            node_version: 26.8.0
          - name_label: linux-ubuntu24.04
            os_label: linux
            runner: ubuntu-24.04
            node_version: 24
          - name_label: linux-ubuntu26.04
            os_label: linux
            runner: ubuntu-26.04
            node_version: 24
          - name_label: macos
            os_label: macos
            runner: macos-26
            node_version: 24
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: sdk/node/tests/integration
    env:
      MXC_SKIP_OS_BUILD_DEPENDENT_TESTS: '1'
      # Skip network-dependent LXC tests on GHA. Capability probe
      # 27576588204 confirmed lxc-net.service + lxcbr0 + dnsmasq come up
      # cleanly on every supported runner, but the alpine download
      # template's eth0 stays IPv4-less inside the test window (only an
      # IPv6 link-local address is configured), so DHCP-dependent DNS
      # lookups fail. The non-network LXC paths (create/start/attach/
      # mount/exit-code/multi-command) all pass and ship LXC backend
      # coverage on GHA. ADO sets the same env var in
      # `.azure-pipelines/templates/SDK.Integration.Test.Job.yml`.
      MXC_SKIP_LXC_NETWORK_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: sdk/node/tests/integration/package-lock.json

      - name: Download SDK package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: sdk-pkg

      - name: Install dependencies + SDK from artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          SDK_TGZ=$(ls ../../../../sdk-pkg/*.tgz | head -n1)
          npm install "$SDK_TGZ"

      - name: npm run build
        run: npm run build

      - name: Install Linux TLS build dependencies
        if: matrix.os_label == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Surface toolchain file at repo root
        shell: bash
        working-directory: ${{ github.workspace }}
        run: cp src/rust-toolchain.toml rust-toolchain.toml

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          override: false
          rustflags: ''

      - name: Test W365 Dev JSON with an isolated native TLS fixture
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/run-w365-node-fixture.ps1

      - name: Refresh Linux package indexes
        if: matrix.os_label == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to refresh Linux package indexes after $attempt attempts"
              exit 1
            fi

            echo "::warning::Package index refresh failed; retrying"
            sleep $((attempt * 5))
          done

      - name: Install bubblewrap + LXC stack (Linux only, cached)
        if: matrix.os_label == 'linux'
        continue-on-error: true
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          # Network-dependent LXC tests remain gated by
          # MXC_SKIP_LXC_NETWORK_TESTS because guest DHCP is unreliable here.
          packages: bubblewrap lxc dnsmasq-base iptables bridge-utils
          version: 1.4-${{ matrix.runner }}

      - name: Verify or repair Linux containment dependencies
        if: matrix.os_label == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            bubblewrap
            lxc
            dnsmasq-base
            iptables
            bridge-utils
          )

          required_commands=(
            bwrap
            lxc-start
            lxc-create
            dnsmasq
            iptables
            brctl
          )

          missing_commands=()
          for command in "${required_commands[@]}"; do
            if ! command -v "$command" >/dev/null 2>&1; then
              missing_commands+=("$command")
            fi
          done

          if [ "${#missing_commands[@]}" -ne 0 ]; then
            echo "::warning::Cached dependency installation was incomplete; missing commands: ${missing_commands[*]}"

            # Runner images can have package indexes that reference versions
            # already removed from the Ubuntu mirrors. Refresh and retry the
            # complete install so a transient 404 cannot leave a green setup
            # step with no containment packages installed.
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 update &&
                sudo env DEBIAN_FRONTEND=noninteractive \
                  apt-get -o Acquire::Retries=3 install -y "${packages[@]}"; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to install Linux containment dependencies after $attempt attempts"
                exit 1
              fi

              echo "::warning::Dependency installation failed; refreshing package indexes and retrying"
              sleep $((attempt * 5))
            done
          else
            echo "Linux containment dependencies restored successfully from cache"
          fi

          for command in "${required_commands[@]}"; do
            command -v "$command"
          done

      - name: Start LXC services (cache restore skips postinst hooks)
        if: matrix.os_label == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          # cache-apt-pkgs-action restores package files but does not
          # re-run postinst hooks on cache hit, so AppArmor profiles
          # (lxc-container-default) and the lxc-net bridge service may
          # not be active. Load/start them explicitly so lxc-start
          # doesn't abort with an AppArmor denial.
          sudo apparmor_parser -rT /etc/apparmor.d/lxc-containers
          sudo systemctl daemon-reload
          sudo systemctl start lxc-net
          sudo systemctl is-active --quiet lxc-net

      - name: Restore execute permission on mxc-exec-mac
        if: matrix.os_label == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(find node_modules/@microsoft/mxc-sdk/bin -name mxc-exec-mac -print -quit)
          if [ -n "$BIN" ]; then chmod +x "$BIN"; else echo "mxc-exec-mac not found" && exit 1; fi

      # Linux needs root for Bubblewrap unprivileged-userns paths.
      # Pass test controls explicitly because Ubuntu 26.04's sudo ignores -E.
      #
      # `sudo` resets PATH from its own `secure_path`, which picks the image's
      # Node ahead of the one setup-node installed, so the suite would run on a
      # different major than this matrix selected. `env "PATH=$PATH"` carries
      # the chosen toolchain through.
      #
      # This lane installs LXC and starts lxc-net specifically so the LXC
      # backend is covered, so MXC_LXC_TESTS_REQUIRE_EXECUTION turns an LXC
      # skip into a failure here rather than a green job that tested nothing.
      - name: npm test
        shell: bash
        run: |
          if [ "${{ matrix.os_label }}" = "linux" ]; then
            sudo env "PATH=$PATH" \
              "MXC_SKIP_OS_BUILD_DEPENDENT_TESTS=$MXC_SKIP_OS_BUILD_DEPENDENT_TESTS" \
              "MXC_SKIP_LXC_NETWORK_TESTS=$MXC_SKIP_LXC_NETWORK_TESTS" \
              MXC_LXC_TESTS_REQUIRE_EXECUTION=1 npm test
          else
            npm test
          fi

      # Policy preparation with no observations must succeed on every OS, and
      # its input limits apply before backend selection. The broad run above
      # stays green if these tests are later skipped or renamed, so require
      # that they ran and passed here.
      - name: Verify policy preparation tests ran without skips
        shell: pwsh
        run: |
          . ../../../../scripts/ci/lib/TestSuiteResults.ps1
          $required = @(
            'V1.Dev bounds terminal policy failures at native preparation without creating a workload',
            'V1.Dev preparation without observations returns the request unchanged on every backend')
          $junit = Join-Path $env:RUNNER_TEMP 'policy-preparation.junit.xml'
          node --test --test-force-exit --test-name-pattern ($required -join '|') `
            --test-reporter=spec --test-reporter-destination=stdout `
            --test-reporter=junit "--test-reporter-destination=$junit" dist/dev.test.js
          if ($LASTEXITCODE -ne 0) { throw "Policy preparation tests exited $LASTEXITCODE." }
          $failure = Get-NodeSuiteFailure -JunitPath $junit -RequiredTests $required
          if ($failure) { throw "Policy preparation: $failure" }
