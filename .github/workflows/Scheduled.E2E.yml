name: Scheduled E2E

on:
  schedule:
    - cron: '0 8 * * 1-6'
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      plan:
        description: Test plan to run.
        required: true
        default: nightly
        type: choice
        options:
          - pr
          - nightly
          - weekly

concurrency:
  group: test-matrix-e2e-${{ github.ref }}-${{ github.event.schedule || inputs.plan }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/Build.Windows.Job.yml

  linux:
    uses: ./.github/workflows/Build.Linux.Job.yml

  macos:
    uses: ./.github/workflows/Build.MacOS.Job.yml

  test:
    needs: [windows, linux, macos]
    uses: ./.github/workflows/Test.Matrix.Job.yml
    with:
      plan: ${{ github.event_name == 'schedule' && github.event.schedule == '0 8 * * 0' && 'weekly' || github.event_name == 'schedule' && 'nightly' || inputs.plan }}
