# TEMPORARY. Validates tests/scripts/run_telemetry_consent_release_test.ps1
# against GitHub-hosted runners before the release-path test is wired into
# Build.Windows.Job.yml. Delete once that lands. See issue #691.
#
# The test mutates the real per-user consent store and the real HKLM policy
# key, so it must only ever run on an ephemeral GitHub-hosted runner. Do not
# add self-hosted labels to this workflow.
name: TEMP - Telemetry release-path test

on:
  push:
    branches:
      - user/emichlin/telemetry-smoke-arm64

permissions:
  contents: read

jobs:
  release-consent:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Surface toolchain file at repo root
        shell: bash
        working-directory: ${{ github.workspace }}
        run: cp src/rust-toolchain.toml rust-toolchain.toml

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          override: false
          rustflags: ''

      - name: Point cargo at the MxcDependencies feed
        uses: ./.github/actions/setup-cargo-feed

      # Consent is backend-independent and wxc defaults to no backend
      # features, so the default release build is enough.
      - name: Build release executor
        run: cargo build --locked --release --target ${{ matrix.target }} -p wxc

      - name: Run release-path telemetry consent test
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          tests\scripts\run_telemetry_consent_release_test.ps1 `
            -BinDir src\target\${{ matrix.target }}\release `
            -AcceptRealMachineMutation
