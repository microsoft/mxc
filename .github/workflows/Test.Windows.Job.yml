name: Windows Workspace Tests

on:
  workflow_call:

jobs:
  test:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            features: hyperlight isolation_session microvm wslc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            features: isolation_session wslc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Expose OpenSSL for Windows TLS fixtures
        shell: pwsh
        run: |
          $openssl = Join-Path $env:ProgramFiles 'Git\usr\bin\openssl.exe'
          if (-not (Test-Path $openssl)) {
            throw 'Windows TLS fixtures require OpenSSL from Git for Windows'
          }
          "MXC_W365_TEST_OPENSSL=$openssl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Surface toolchain file at repo root
        shell: bash
        working-directory: ${{ github.workspace }}
        run: cp src/rust-toolchain.toml rust-toolchain.toml

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          override: false
          rustflags: ''
          cache: false

      - name: Point cargo at the MxcDependencies feed
        uses: ./.github/actions/setup-cargo-feed

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src -> target
          key: windows-tests-${{ matrix.target }}-v1
          cache-on-failure: false

      - name: Force hyperlight-host rebuild (cache workaround)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: cargo clean --release --target ${{ matrix.target }} -p hyperlight-host

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
             --no-default-features
             --features "${{ matrix.features }}"

      - name: Build module lifetime regression fixture
        run: cargo build --locked --release --target ${{ matrix.target }}
             -p mxc-sdk --example module_lifetime_fixture
             --no-default-features --features "${{ matrix.features }}"

      - name: Test
        run: cargo test --locked --release --target ${{ matrix.target }}
             --no-default-features
             --features "${{ matrix.features }}"

      - name: Require NVX module lifetime regression
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $output = @(cargo test --locked --release --target '${{ matrix.target }}' `
            -p mxc-sdk --no-default-features --features microvm `
            --test module_lifetime nvx_error_keeps_pending_worker_code_loaded `
            -- --exact --color never 2>&1)
          $output | Write-Output
          if ($LASTEXITCODE -ne 0 -or
              -not ($output -match '^test nvx_error_keeps_pending_worker_code_loaded \.\.\. ok$')) {
            throw 'The NVX module lifetime regression must execute and pass.'
          }

  result:
    name: Windows workspace tests
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm both Windows workspace suites passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
