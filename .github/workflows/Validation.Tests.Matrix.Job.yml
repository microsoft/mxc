name: Create Validation Test Matrix

on:
  workflow_call:
    inputs:
      plan:
        description: Test plan to resolve.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    name: resolve "${{ inputs.plan }}" test matrix
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.matrix.outputs.windows }}
      linux: ${{ steps.matrix.outputs.linux }}
      macos: ${{ steps.matrix.outputs.macos }}
      has_windows: ${{ steps.matrix.outputs.has_windows }}
      has_linux: ${{ steps.matrix.outputs.has_linux }}
      has_macos: ${{ steps.matrix.outputs.has_macos }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve test combinations
        id: matrix
        run: node scripts/ci/resolve-validation-test-matrix.mjs --plan "${{ inputs.plan }}"

  windows:
    name: ${{ matrix.os }}, ${{ matrix.architecture }}, ${{ matrix.backend }}
    needs: resolve
    if: needs.resolve.outputs.has_windows == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.windows) }}
    runs-on: [ self-hosted, "1ES.Pool=${{ matrix.pool }}", "JobId=mxc-e2e-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download ${{ matrix.target }} artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/bin

      - name: Prepare backend prerequisites
        if: matrix.command == 'microvm'
        shell: pwsh
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\bin'

          # NanVix boots a VM from these images on every invocation; Defender
          # scanning them can push boot past its timeout.
          Add-MpPreference -ExclusionPath $binDir
          Write-Host "Added Defender exclusion for $binDir"

          # Mirrors the verification in microvm-e2e.yml.
          $required = @(
            "wxc-exec.exe",
            "nanvixd.exe",
            "nanvix_rootfs.img",
            "python3.initrd",
            "bin\kernel.elf",
            "snapshots\kernel.vmem",
            "snapshots\kernel.whp.cbor"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $binDir $_)) }
          if ($missing) {
            Write-Host "::error::Missing binaries: $($missing -join ', ')"
            exit 1
          }
          $leaves = $required | ForEach-Object { Split-Path $_ -Leaf }
          Get-ChildItem $binDir -Include $leaves -Recurse | Format-Table FullName, Length

          # Capture nanvixd's own stderr/tracing; without this the runner
          # silences it, which is why a hung boot produced no diagnostics.
          "MXC_NANVIX_TRACE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Set MXC_NANVIX_TRACE=1 (captures nanvixd tracing)"

      - name: Diagnose hypervisor environment
        if: matrix.command == 'microvm'
        shell: pwsh
        run: ./scripts/ci/diagnose-whp.ps1

      - name: Check Windows Hypervisor Platform
        if: matrix.command == 'microvm'
        shell: pwsh
        run: ./scripts/ci/check-whp.ps1

      - name: Probe nanvixd directly
        if: matrix.command == 'microvm'
        timeout-minutes: 5
        shell: pwsh
        run: |
          ./scripts/ci/probe-nanvixd.ps1 `
            -BinDir (Join-Path $env:GITHUB_WORKSPACE 'artifacts\bin')

      - name: Prepare Process Container host
        if: matrix.backend == 'process-t3'
        shell: pwsh
        run: |
          $hostPrep = Join-Path $env:GITHUB_WORKSPACE 'artifacts\bin\wxc-host-prep.exe'
          & $hostPrep prepare-system-drive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hostPrep prepare-null-device --no-sacl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run backend tests
        # A backend that hangs (rather than failing) would otherwise burn the
        # full job timeout. Fail fast enough to keep the log useful.
        timeout-minutes: 30
        shell: pwsh
        run: |
          $arguments = @{
            Backend = '${{ matrix.command }}'
            BinaryDirectory = (Join-Path $env:GITHUB_WORKSPACE 'artifacts\bin')
            Architecture = '${{ matrix.architecture }}'
          }
          if ('${{ matrix.backend }}' -eq 'process-t1') {
            $arguments.ExpectedTier = 'T1'
          } elseif ('${{ matrix.backend }}' -eq 'process-t3') {
            $arguments.ExpectedTier = 'T3'
          }
          & ./tests/scripts/run_ci_backend_tests.ps1 @arguments *>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'mxc-ci.log')

      - name: Upload failure logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.plan }}-${{ matrix.os }}-${{ matrix.architecture }}-${{ matrix.backend }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mxc-ci.log
            ${{ runner.temp }}/mxc-microvm-logs
            ${{ runner.temp }}/mxc-wpc-tests/logs
            ${{ runner.temp }}/WinProcessContainer-Tests.results.*
            ${{ runner.temp }}/mxc_concurrent_oneshot
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: ${{ matrix.os }}, ${{ matrix.architecture }}, ${{ matrix.backend }}
    needs: resolve
    if: needs.resolve.outputs.has_linux == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.linux) }}
    runs-on: [ self-hosted, "1ES.Pool=${{ matrix.pool }}", "JobId=mxc-e2e-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download ${{ matrix.target }} artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/bin

      - name: Prepare backend prerequisites
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/install-linux-backend-prereqs.sh \
            '${{ matrix.command }}' "$GITHUB_WORKSPACE/artifacts/bin" 2>&1 |
            tee -a "$RUNNER_TEMP/mxc-ci.log"

      - name: Run backend tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.command }}' == 'lxc' ]]; then
            sudo --preserve-env=RUNNER_TEMP bash tests/scripts/run_ci_backend_tests.sh \
              '${{ matrix.command }}' "$GITHUB_WORKSPACE/artifacts/bin" 2>&1 |
              tee -a "$RUNNER_TEMP/mxc-ci.log"
          else
            bash tests/scripts/run_ci_backend_tests.sh \
              '${{ matrix.command }}' "$GITHUB_WORKSPACE/artifacts/bin" 2>&1 |
              tee -a "$RUNNER_TEMP/mxc-ci.log"
          fi

      - name: Upload failure logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.plan }}-${{ matrix.os }}-${{ matrix.architecture }}-${{ matrix.backend }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mxc-ci.log
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: ${{ matrix.os }}, ${{ matrix.backend }}
    needs: resolve
    if: needs.resolve.outputs.has_macos == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.macos) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download ${{ matrix.target }} artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/bin

      - name: Run backend tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifacts/bin/mxc-exec-mac artifacts/bin/unix-test-proxy
          bash tests/scripts/run_ci_backend_tests.sh \
            '${{ matrix.command }}' "$GITHUB_WORKSPACE/artifacts/bin" 2>&1 |
            tee "$RUNNER_TEMP/mxc-ci.log"

      - name: Upload failure logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.plan }}-${{ matrix.os }}-${{ matrix.architecture }}-${{ matrix.backend }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mxc-ci.log
          if-no-files-found: ignore
          retention-days: 7
