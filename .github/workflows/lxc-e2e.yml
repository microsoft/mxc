name: LXC E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lxc-e2e:
    name: LXC-Exec Container and Network Policy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        run: rustup update stable

      - name: Point cargo at the MxcDependencies feed
        uses: ./.github/actions/setup-cargo-feed

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Install LXC and firewall tooling
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            lxc lxc-templates lxc-utils iptables debootstrap uidmap bridge-utils

      # A bridged veth only reaches the FORWARD chain while br_netfilter is
      # delivering bridged packets to iptables. Without it the firewall rules
      # install cleanly and never fire, so the network policy tests would pass
      # against a firewall that filters nothing.
      - name: Enable bridge netfilter
        run: |
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=1

      # Run under the forward policy production actually has.
      #
      # GitHub-hosted runners ship Docker, which sets the IPv4 FORWARD policy to
      # DROP -- the same policy any host running Docker has. This suite used to
      # force it to ACCEPT, for a reason that was real at the time: MXC hooked
      # its chain only on traffic leaving the container (`-i <veth>` /
      # `--physdev-in <veth>`), so the reply to an allowed request matched no
      # MXC rule, fell through to the policy, and was dropped. Observed exactly
      # that: DNS resolved, because dnsmasq on lxcbr0 is host-local and never
      # traverses FORWARD, and then
      # `wget: can't connect to remote host (140.82.116.5)`.
      #
      # That was a product defect, not a harness quirk, and forcing ACCEPT hid
      # it from every run. The container now installs a conntrack-scoped return
      # rule for its own port, so replies are carried by MXC's own rules rather
      # than by the host's default. Forcing ACCEPT would now hide whether that
      # fix works.
      #
      # The second, subtler reason for forcing ACCEPT was vacuity: under DROP a
      # container with no working hook at all is equally unreachable, so a
      # deny-only assertion would report success against a firewall filtering
      # nothing. That is answered by pairing rather than by policy. Every script
      # here that asserts a block also asserts a reachability in the same run --
      # the allow cases in the enforcement and deny-precedence scripts, and
      # proxy reachability in the proxy script. A broken hook or a missing
      # return rule fails those loudly, under either policy. The remaining
      # scripts assert programmed rule shapes and log lines, which do not depend
      # on the forward policy at all.
      #
      # Set explicitly rather than inherited, so a future runner image that
      # happens to default to ACCEPT cannot silently weaken the suite.
      - name: Force the production forward policy, so the return path is tested
        run: |
          sudo iptables -P FORWARD DROP
          sudo ip6tables -P FORWARD DROP
          sudo iptables -S FORWARD | head -5

      - name: Report the environment these tests depend on
        run: |
          echo "--- kernel ---"
          uname -a
          echo "--- lxc ---"
          lxc-create --version || echo "MISSING lxc-create"
          echo "--- iptables ---"
          sudo iptables --version || echo "MISSING iptables"
          sudo ip6tables --version || echo "MISSING ip6tables"
          echo "--- forward policy (must be DROP: production condition, and what exercises the return rules) ---"
          sudo iptables -S FORWARD | head -1
          sudo ip6tables -S FORWARD | head -1
          echo "--- bridge netfilter ---"
          cat /proc/sys/net/bridge/bridge-nf-call-iptables || echo "MISSING bridge-nf-call-iptables"
          cat /proc/sys/net/bridge/bridge-nf-call-ip6tables || echo "MISSING bridge-nf-call-ip6tables"
          echo "--- host ipv6 ---"
          cat /proc/net/if_inet6 || echo "no /proc/net/if_inet6 (IPv6 disabled)"

      - name: Build lxc-exec
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo build --release -p lxc --bin lxc-exec

      # MXC_LXC_TESTS_REQUIRE_EXECUTION turns an honest skip into a failure.
      # On a developer box a missing ip6tables is a reason to run what you can.
      # Here the runner is provisioned specifically to execute this suite, so a
      # skip means a prerequisite disappeared and the gate would go green while
      # testing nothing.
      - name: Run LXC E2E suite
        env:
          MXC_LXC_TESTS_REQUIRE_EXECUTION: "1"
        run: sudo --preserve-env=MXC_LXC_TESTS_REQUIRE_EXECUTION bash tests/scripts/run_lxc_all_tests.sh

      - name: Show leftover firewall state on failure
        if: failure()
        run: |
          echo "--- FORWARD chain ---"
          sudo iptables -S FORWARD || true
          sudo ip6tables -S FORWARD || true
          echo "--- MXC chains ---"
          sudo iptables -S | grep -E '^-N MXC-' || echo "none"
          sudo ip6tables -S | grep -E '^-N MXC-' || echo "none"

      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: lxc-e2e-logs-${{ github.event.pull_request.number || github.run_number }}
          retention-days: 7
          path: |
            logs/
            **/*.log
