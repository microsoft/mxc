name: Integration Tests

# Retained until the unified test matrix has equivalent MicroVM coverage.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  microvm-e2e:
    name: WXC-Exec MicroVM
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        run: |
          rustup update stable
          rustup target add x86_64-pc-windows-msvc

      - name: Point cargo at the MxcDependencies feed
        uses: ./.github/actions/setup-cargo-feed

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src

      - name: Download and verify signed NVX agent bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = Join-Path $env:RUNNER_TEMP "nvx-agent-release"
          New-Item -ItemType Directory -Force $release | Out-Null
          gh release download v0.1.0-dev.4a30cb560277 `
            --repo microsoft/nvx `
            --pattern aci-edge-sandboxes.zip `
            --dir $release
          $archive = Join-Path $release "aci-edge-sandboxes.zip"
          $expectedArchive = "b22c39abafe889dd20f62a7e49bc3aa7dbf09b0f0f779b98c82df0ac52d5dc80"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expectedArchive) {
            throw "NVX release ZIP digest mismatch"
          }
          $bundle = Join-Path $release "bundle"
          Expand-Archive -LiteralPath $archive -DestinationPath $bundle
          $entries = @(Get-Content (Join-Path $bundle "SHA256SUMS"))
          if ($entries.Count -ne 17) {
            throw "Expected 17 signed-bundle entries, got $($entries.Count)"
          }
          foreach ($entry in $entries) {
            $parts = $entry -split '\s+\*?', 2
            $file = Join-Path $bundle $parts[1]
            if ($parts.Count -ne 2 -or (Get-FileHash $file -Algorithm SHA256).Hash -ne $parts[0]) {
              throw "NVX bundle file digest mismatch: $file"
            }
          }
          "MXC_NVX_BUNDLE_DIR=$bundle" | Out-File $env:GITHUB_ENV -Append
          "MXC_NVX_STATE_ROOT=$(Join-Path $release 'state')" | Out-File $env:GITHUB_ENV -Append

      - name: Build with MicroVM support
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo build -p wxc --features microvm --target x86_64-pc-windows-msvc

      - name: Exclude build output from Windows Defender
        shell: pwsh
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE "src\target\x86_64-pc-windows-msvc\debug"
          Add-MpPreference -ExclusionPath $binDir
          Write-Host "Added Defender exclusion for $binDir"

      - name: Verify MicroVM inputs
        shell: pwsh
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE "src\target\x86_64-pc-windows-msvc\debug"
          $required = @(
            (Join-Path $binDir "wxc-exec.exe"),
            (Join-Path $env:MXC_NVX_BUNDLE_DIR "SOURCE-MANIFEST.json"),
            (Join-Path $env:MXC_NVX_BUNDLE_DIR "bin\aci_edge_agent.dll")
          )
          $missing = $required | Where-Object { -not (Test-Path $_ -PathType Leaf) }
          if ($missing) {
            Write-Host "::error::Missing binaries: $($missing -join ', ')"
            exit 1
          }
          Get-Item $required | Format-Table FullName, Length

      - name: Diagnose hypervisor environment
        shell: pwsh
        run: ./scripts/ci/diagnose-whp.ps1

      - name: Check Windows Hypervisor Platform
        id: whp-check
        shell: pwsh
        run: ./scripts/ci/check-whp.ps1

      - name: Run MicroVM E2E Tests
        if: steps.whp-check.outputs.whp_available == 'true'
        shell: pwsh
        working-directory: src
        run: |
          cargo test -p mxc-sdk --features microvm --test wxc_e2e_tests_e2e_windows --target x86_64-pc-windows-msvc test_microvm_ -- --nocapture
          cargo test -p mxc-sdk --features microvm --test nvx_e2e --target x86_64-pc-windows-msvc -- --ignored --nocapture

      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: microvm-e2e-logs-${{ github.event.pull_request.number || github.run_number }}
          retention-days: 7
          path: |
            logs/
            **/*.log

      - name: Print performance summary
        if: steps.whp-check.outputs.whp_available == 'true' && !cancelled()
        shell: pwsh
        run: ./scripts/ci/print-perf-summary.ps1 -JsonPath (Join-Path $env:GITHUB_WORKSPACE "microvm-perf-results.json")

      - name: Upload performance results
        if: steps.whp-check.outputs.whp_available == 'true' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: microvm-perf-results-${{ github.event.pull_request.number || github.run_number }}
          retention-days: 30
          path: microvm-perf-results.json
