[workspace]
members = [
    "mxc-sdk",
    "ffi/mxc_ffi",
    "host/plm",
    "host/wxc_host_prep",
    "host/wxc_winhttp_proxy_shim",
    "testing/unix_test_proxy",
    "testing/wxc_test_driver",
    "testing/wxc_test_proxy",
    "testing/wxc_ui_probe",
    "tools/lxc",
    "tools/mxc_darwin",
    "tools/mxc_diagnostic_console",
    "tools/mxc_schema_gen",
    "tools/wxc",
]
exclude = ["testing/fuzz"]
resolver = "3"

# Full debug info so we can analyse customer crash dumps in WinDbg until we
# publish to a symbol server. `strip = "debuginfo"` removes embedded debug
# sections from the binary itself (mainly relevant on Linux — Windows pdbs
# are already split by `split-debuginfo = "packed"`). Full debug info still
# ships via the side-by-side .pdb / .dwp files.
[profile.release]
debug = "full"
split-debuginfo = "packed"
strip = "debuginfo"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cidr = "0.3.2"
clap = { version = "4", features = ["derive"] }
flatbuffers = "25"
getrandom = "0.2"
libc = "0.2"
mxc-sdk = { path = "mxc-sdk" }
nix = { version = "0.29", features = ["fs", "mount", "sched", "signal", "net", "process", "user", "term"] }
quick-xml = "0.41"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"
schemars = "0.8"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# Pure-Rust ETW TraceLogging provider used by `mxc_telemetry` (Windows-only;
# the crate compiles to no-ops on other targets). Pinned at the workspace
# level so every consumer resolves the same version.
tracelogging = "1.2"
unicode-general-category = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
widestring = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
windows-core = "0.62"
winreg = "0.55"
winresource = { version = "0.1.31", default-features = false }
