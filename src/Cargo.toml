[workspace]
members = [
    "backends/process_container/common",
    "backends/bubblewrap/common",
    "backends/hyperlight/common",
    "backends/isolation_session/bindings",
    "backends/isolation_session/common",
    "backends/lxc/common",
    "backends/nanvix/binaries",
    "backends/nanvix/build_common",
    "backends/nanvix/common",
    "backends/nanvix/runner",
    "backends/seatbelt/common",
    "backends/windows_sandbox/common",
    "backends/windows_sandbox/daemon",
    "backends/windows_sandbox/guest",
    "backends/windows_sandbox/lifecycle",
    "backends/wslc/common",
    "backends/wslc/daemon",
    "core/generated/process_security_environment_specification",
    "core/learning_mode_core",
    "core/learning_mode_platforms/windows",
    "core/lxc",
    "core/mxc_build_common",
    "core/mxc_config_contract",
    "core/mxc_darwin",
    "core/mxc_engine",
    "core/mxc_pty",
    "core/mxc_schema_support",
    "core/mxc-sdk",
    "core/wxc",
    "core/wxc_common",
    "ffi/mxc_ffi",
    "host/plm",
    "host/wxc_host_prep",
    "host/wxc_winhttp_proxy_shim",
    "mxc_telemetry",
    "testing/unix_test_proxy",
    "testing/wxc_e2e_tests",
    "testing/wxc_test_driver",
    "testing/wxc_test_proxy",
    "testing/wxc_ui_probe",
    "tools/mxc_diagnostic_console",
    "tools/mxc_schema_gen",
]
exclude = ["testing/fuzz"]
resolver = "3"

# Full debug info so we can analyse customer crash dumps in WinDbg until we
# publish to a symbol server. `strip = "debuginfo"` removes embedded debug
# sections from the binary itself (mainly relevant on Linux — Windows pdbs
# are already split by `split-debuginfo = "packed"`). Full debug info still
# ships via the side-by-side .pdb / .dwp files.
[profile.release]
debug = "full"
split-debuginfo = "packed"
strip = "debuginfo"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/microsoft/mxc"

# Cargo requires explicit versions for publishable path dependencies and cannot
# inherit these requirements from workspace.package.version. The crate release
# CI check enforces that they remain synchronized with the workspace version.
[workspace.dependencies]
anyhow = "1"
process_container_common = { package = "mxc-process-container-common", path = "backends/process_container/common", version = "0.9.0" }
base64 = "0.22"
bwrap_common = { package = "mxc-bwrap-common", path = "backends/bubblewrap/common", version = "0.9.0" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cidr = "0.3.2"
clap = { version = "4", features = ["derive"] }
flatbuffers = "25"
getrandom = "0.2"
hyperlight_common = { package = "mxc-hyperlight-common", path = "backends/hyperlight/common", version = "0.9.0" }
isolation_session_bindings = { package = "mxc-isolation-session-bindings", path = "backends/isolation_session/bindings", version = "0.9.0" }
isolation_session_common = { package = "mxc-isolation-session-common", path = "backends/isolation_session/common", version = "0.9.0" }
learning_mode_core = { package = "mxc-learning-mode-core", path = "core/learning_mode_core", version = "0.9.0" }
learning_mode_windows = { package = "mxc-learning-mode-windows", path = "core/learning_mode_platforms/windows", version = "0.9.0" }
libc = "0.2"
lxc_common = { package = "mxc-lxc-common", path = "backends/lxc/common", version = "0.9.0" }
mxc_build_common = { package = "mxc-build-common", path = "core/mxc_build_common", version = "0.9.0" }
mxc_config_contract = { package = "mxc-config-contract", path = "core/mxc_config_contract", version = "0.9.0" }
mxc_engine = { package = "mxc-engine", path = "core/mxc_engine", version = "0.9.0" }
mxc_pty = { package = "mxc-pty", path = "core/mxc_pty", version = "0.9.0" }
mxc_schema_support = { path = "core/mxc_schema_support" }
mxc-sdk = { path = "core/mxc-sdk", version = "0.9.0" }
mxc_telemetry = { package = "mxc-telemetry", path = "mxc_telemetry", version = "0.9.0" }
nanvix_runner = { package = "mxc-nanvix-runner", path = "backends/nanvix/runner", version = "0.9.0" }
nix = { version = "0.29", features = ["fs", "mount", "sched", "signal", "net", "process", "user", "term"] }
process_security_environment_spec = { package = "mxc-process-security-environment-spec", path = "core/generated/process_security_environment_specification", version = "0.9.0" }
plm = { package = "mxc-plm", path = "host/plm", version = "0.9.0" }
quick-xml = "0.41"
seatbelt_common = { package = "mxc-seatbelt-common", path = "backends/seatbelt/common", version = "0.9.0" }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"
schemars = "0.8"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# Pure-Rust ETW TraceLogging provider used by `mxc_telemetry` (Windows-only;
# the crate compiles to no-ops on other targets). Pinned at the workspace
# level so every consumer resolves the same version.
tracelogging = "1.2"
unicode-general-category = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
widestring = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
windows-core = "0.62"
windows_sandbox_common = { package = "mxc-windows-sandbox-common", path = "backends/windows_sandbox/common", version = "0.9.0" }
windows_sandbox_lifecycle = { package = "mxc-windows-sandbox-lifecycle", path = "backends/windows_sandbox/lifecycle", version = "0.9.0" }
winreg = "0.55"
wslc_common = { package = "mxc-wslc-common", path = "backends/wslc/common", version = "0.9.0" }
wxc_common = { package = "mxc-wxc-common", path = "core/wxc_common", version = "0.9.0" }
