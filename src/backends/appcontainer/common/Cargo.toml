[package]
name = "mxc-alpha-basecontainer-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows AppContainer/BaseContainer backend support for MXC sandboxing."

[features]
# Compile-time gate for Tier 2 (AppContainer + BFS via bfscfg.exe).
# OFF by default: production wxc-exec cannot resolve or spawn bfscfg.exe,
# and `fallback_detector::detect` naturally falls through T2 to T3 because
# `find_bfscfg_exe` returns `Ok(None)`. Enable explicitly on hosts where
# bfscfg.exe is known safe to invoke.
tier2_bfs = []

[dependencies]
mxc-alpha-wxc-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
getrandom = { workspace = true }
semver = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
windows-core = { workspace = true }
flatbuffers = { workspace = true }
mxc-alpha-windows-secenv-projection = { workspace = true }
mxc-alpha-process-security-environment-spec = { workspace = true }
widestring = { workspace = true }
winreg = { workspace = true }
mxc-alpha-learning-mode-windows = { workspace = true }
mxc-alpha-learning-mode-core = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
