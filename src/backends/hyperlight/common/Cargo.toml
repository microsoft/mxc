[package]
# Not `hyperlight_common`: crates.io treats `-` and `_` as equivalent for name
# collisions, and `hyperlight-common` is already published from
# github.com/hyperlight-dev/hyperlight.  See docs/crates-release.md.
name = "mxc_alpha_test_hyperlight_common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hyperlight micro-VM backend support for the MXC execution engine."

[dependencies]
wxc_common = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
hyperlight-unikraft = { version = "0.12.1", optional = true }

[features]
default = []
hyperlight = ["dep:hyperlight-unikraft"]
