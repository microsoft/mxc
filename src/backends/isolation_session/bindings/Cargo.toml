[package]
name = "mxc-isolation-session-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows IsolationSession API bindings used by MXC."

[lib]
name = "isolation_session_bindings"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Foundation", "UI"] }
windows-core = { workspace = true }
windows-collections = "0.3"
windows-future = "0.3"

[build-dependencies]
semver = "1"
