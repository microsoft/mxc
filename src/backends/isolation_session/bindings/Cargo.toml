[package]
name = "isolation_session_bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
lifted = ["dep:mxc_build_common", "dep:windows-bindgen"]

[dependencies]
windows-core = { workspace = true }
windows-collections = "0.3"
windows-future = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Foundation"] }

[build-dependencies]
semver = "1"
mxc_build_common = { workspace = true, features = ["isolation_session_sdk"], optional = true }
windows-bindgen = { version = "=0.62.1", optional = true }
