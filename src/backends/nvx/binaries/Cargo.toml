# builds and enabled only by future NVX backend consumers.
nvx = []

[dependencies]
nvx_common = { workspace = true }

[build-dependencies]
nvx_build_common = { workspace = true }
nvx_common = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
