[package]
name = "mxc-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Importable library for starting MXC sandboxes in-process, with streaming stdio."

[lib]
name = "mxc_sdk"
path = "src/lib.rs"

[features]
default = []
# WSL Container backend (Windows only). Forwards to the engine, which links
# the WSLC SDK loader; see `mxc_engine`'s `wslc` feature.
wslc = ["mxc_engine/wslc"]
# IsolationSession backend (Windows only, experimental).
isolation_session = ["mxc_engine/isolation_session"]

[dependencies]
wxc_common.workspace = true
mxc_engine = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

# Manual operator driver for the in-process IsolationSession lifecycle. Gated on
# the backend feature so `cargo build --examples` without it stays green.
[[example]]
name = "isolation_session_console"
required-features = ["isolation_session"]

[[example]]
name = "sta_probe"
required-features = ["isolation_session"]

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = { workspace = true }

# Skip gate for the Bubblewrap streaming tests.
[target.'cfg(target_os = "linux")'.dev-dependencies]
bwrap_common = { workspace = true }
