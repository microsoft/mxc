[package]
name = "mxc-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Importable library for starting MXC sandboxes in-process (no pty, streaming stdio)."

[lib]
name = "mxc_sdk"
path = "src/lib.rs"

[features]
default = []
# WSL Container backend (Windows only, experimental). Forwards to the engine,
# which links the WSLC SDK loader; see `mxc_engine`'s `wslc` feature.
wslc = ["mxc_engine/wslc"]
# Debug-only downstream test seam for telemetry consent/policy redirection.
# Used by the .NET SDK integration tests through `mxc_ffi`; never enable it
# for shipping Release builds.
test-support = ["wxc_common/test-support"]

[dependencies]
wxc_common.workspace = true
mxc_engine = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = { workspace = true }
