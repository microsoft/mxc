[package]
name = "mxc-alpha-mxc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MXC execution engine: backend dispatch, host probing, and config building shared by the public SDK and the executor binaries."

[lib]
name = "mxc_alpha_mxc_engine"
path = "src/lib.rs"

[dependencies]
mxc-alpha-wxc-common.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
# MicroVM runner — used by the Windows and Linux run-to-completion bodies under
# the `microvm` feature. Never built on hosts/features that don't select it.
mxc-alpha-nanvix-runner = { workspace = true, optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
mxc-alpha-test-hyperlight-common = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
mxc-alpha-basecontainer-common = { workspace = true }
mxc-alpha-windows-sandbox-lifecycle = { workspace = true }
mxc-alpha-isolation-session-common = { workspace = true, optional = true }
mxc-alpha-isolation-session-bindings = { workspace = true, optional = true }
mxc-alpha-wslc-common = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
mxc-alpha-bwrap-common = { workspace = true }
mxc-alpha-lxc-common = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mxc-alpha-seatbelt-common = { workspace = true }

[features]
default = []
# Enables constructing the run-to-completion runner for each experimental
# backend. Mirrors the executor binaries' feature set so backend selection can
# live in one place. The build-time binary-staging that some backends also need
# (e.g. NanVix's `nanvix_binaries`) stays with the executor crates.
microvm = ["dep:mxc-alpha-nanvix-runner"]
wslc = ["dep:mxc-alpha-wslc-common", "mxc-alpha-wslc-common/link-wslcsdk"]
hyperlight = ["dep:mxc-alpha-test-hyperlight-common", "mxc-alpha-test-hyperlight-common/hyperlight"]
isolation_session = [
    "dep:mxc-alpha-isolation-session-bindings",
    "dep:mxc-alpha-isolation-session-common",
]
# Forwards appcontainer_common/tier2_bfs. OFF by default; see appcontainer_common/Cargo.toml.
tier2_bfs = ["mxc-alpha-basecontainer-common/tier2_bfs"]
