[package]
name = "mxc_alpha_mxc_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MXC execution engine: backend dispatch, host probing, and config building shared by the public SDK and the executor binaries."

[lib]
name = "mxc_alpha_mxc_engine"
path = "src/lib.rs"

[dependencies]
mxc_alpha_wxc_common.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
# MicroVM runner — used by the Windows and Linux run-to-completion bodies under
# the `microvm` feature. Never built on hosts/features that don't select it.
mxc_alpha_nanvix_runner = { workspace = true, optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
mxc_alpha_test_hyperlight_common = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
mxc-alpha-basecontainer-common = { workspace = true }
mxc_alpha_windows_sandbox_lifecycle = { workspace = true }
mxc_alpha_isolation_session_common = { workspace = true, optional = true }
mxc_alpha_isolation_session_bindings = { workspace = true, optional = true }
mxc_alpha_wslc_common = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
mxc_alpha_bwrap_common = { workspace = true }
mxc_alpha_lxc_common = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mxc_alpha_seatbelt_common = { workspace = true }

[features]
default = []
# Enables constructing the run-to-completion runner for each experimental
# backend. Mirrors the executor binaries' feature set so backend selection can
# live in one place. The build-time binary-staging that some backends also need
# (e.g. NanVix's `nanvix_binaries`) stays with the executor crates.
microvm = ["dep:mxc_alpha_nanvix_runner"]
wslc = ["dep:mxc_alpha_wslc_common", "mxc_alpha_wslc_common/link-wslcsdk"]
hyperlight = ["dep:mxc_alpha_test_hyperlight_common", "mxc_alpha_test_hyperlight_common/hyperlight"]
isolation_session = [
    "dep:mxc_alpha_isolation_session_bindings",
    "dep:mxc_alpha_isolation_session_common",
]
# Forwards appcontainer_common/tier2_bfs. OFF by default; see appcontainer_common/Cargo.toml.
tier2_bfs = ["mxc-alpha-basecontainer-common/tier2_bfs"]
