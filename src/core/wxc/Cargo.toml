[package]
name = "wxc"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wxc-exec"
path = "src/main.rs"

[dependencies]
mxc-alpha-wxc-common.workspace = true
mxc-alpha-mxc-engine.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
windows.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
mxc-alpha-test-hyperlight-common = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
mxc-alpha-basecontainer-common = { workspace = true }
nanvix_binaries = { path = "../../backends/nanvix/binaries", optional = true }
mxc-alpha-wslc-common = { workspace = true, optional = true }
# Shared PLM dep: `wpr_command` (safe wpr.exe resolver used for
# ctrl-c cleanup), `CTRL_HANDLER_DRAIN_TIMEOUT`, `wait_until_cleared`,
# and the `singleton::*` primitives — single source of truth so the
# two crates can't drift. The `--wxc-singleton-held-by-parent` handoff
# is a CLI arg on `plm.exe`, not an env var, because ShellExecuteExW
# with `runas` drops the caller's env block on the way through UAC.
plm = { path = "../../host/plm" }
tempfile.workspace = true

[build-dependencies]
mxc_build_common.workspace = true

[target.'cfg(windows)'.build-dependencies]
nanvix_build_common = { path = "../../backends/nanvix/build_common" }

[features]
default = []
microvm = ["dep:nanvix_binaries", "nanvix_binaries/microvm", "mxc-alpha-mxc-engine/microvm"]
wslc = ["dep:mxc-alpha-wslc-common", "mxc-alpha-wslc-common/link-wslcsdk", "mxc-alpha-mxc-engine/wslc"]
hyperlight = ["dep:mxc-alpha-test-hyperlight-common", "mxc-alpha-test-hyperlight-common/hyperlight", "mxc-alpha-mxc-engine/hyperlight"]
isolation_session = ["mxc-alpha-mxc-engine/isolation_session"]
# Forwards appcontainer_common/tier2_bfs. OFF by default; see appcontainer_common/Cargo.toml.
tier2_bfs = ["mxc-alpha-basecontainer-common/tier2_bfs", "mxc-alpha-mxc-engine/tier2_bfs"]
