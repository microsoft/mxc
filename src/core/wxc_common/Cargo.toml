[package]
name = "wxc_common"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
microvm = ["dep:nanvix_common", "dep:uuid"]
# Exposes telemetry test harnesses to downstream integration tests.
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
unicode-general-category = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
cidr = { workspace = true }
url = { workspace = true }
getrandom = { workspace = true }
nanvix_common = { path = "../../backends/nanvix/common", optional = true }
uuid = { workspace = true, optional = true }
mxc_config_contract = { workspace = true }
mxc_telemetry = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
windows-core = { workspace = true }
widestring = { workspace = true }
winreg = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
filetime = "0.2"
tempfile.workspace = true

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
