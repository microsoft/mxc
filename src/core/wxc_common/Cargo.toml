[package]
name = "mxc-alpha-wxc-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared core types (execution requests, policies, wire model) for MXC sandboxing."

[features]
microvm = ["dep:mxc-alpha-nanvix-common", "dep:uuid"]
# Enables JSON Schema generation from the dedicated wire model. Off by default
# so normal builds don't carry schemars.
schema-gen = ["dep:schemars"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_path_to_error = { workspace = true }
unicode-general-category = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
getrandom = { workspace = true }
semver = "1"
schemars = { version = "0.8", optional = true }
mxc-alpha-nanvix-common = { path = "../../backends/nanvix/common", version = "0.7.1", optional = true }
uuid = { workspace = true, optional = true }
mxc-alpha-mxc-telemetry = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
windows-core = { workspace = true }
widestring = { workspace = true }
winreg = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
