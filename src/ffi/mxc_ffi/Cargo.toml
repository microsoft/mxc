[package]
name = "mxc_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI over the MXC public Rust SDK (mxc-sdk) for language bindings (e.g. the C# SDK)."

[lib]
name = "mxc_ffi"
# cdylib: the shared library language bindings load (mxc_ffi.dll / libmxc_ffi.so
# / libmxc_ffi.dylib). staticlib: for consumers that link statically. lib: so
# Rust integration tests can call the `extern "C"` entry points directly.
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
mxc-sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[features]
# Opt-in C# SDK P/Invoke code generation (csbindgen) in build.rs. Off by
# default so normal builds — including the whole-workspace backend build
# matrix — don't compile csbindgen or write into the source tree. The drift
# gate (scripts/check-dotnet-bindings-codegen.js) builds with this feature to
# regenerate the committed bindings.
dotnetsdk = ["dep:csbindgen"]
# Debug-only telemetry test seam used by the .NET SDK integration suite so it
# can redirect consent storage/policy away from the real machine state.
test-support = ["mxc-sdk/test-support"]

[dev-dependencies]
# Gives the FFI tests the policy-key redirector, so they can assert the exact
# string this layer marshals for each administrative policy state rather than
# accepting whatever the host machine's real policy happens to produce.
wxc_common = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[build-dependencies]
csbindgen = { version = "1", optional = true }
