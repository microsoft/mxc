# Configuration for scripts/generate-diplomat-bindings.ps1.
#
# The native name intentionally stays mxc_ffi: Diplomat's generated C and .NET
# layers bind to the same co-versioned library as the legacy C ABI.
lib_name = "mxc_ffi"

[dotnet]
namespace = "Microsoft.Mxc.Diplomat"
dylib_name = "mxc_ffi"
exception_trim_suffix = "Error"
exception_message_method = "Message"
