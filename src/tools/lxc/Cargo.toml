[package]
name = "lxc"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lxc-exec"
path = "src/main.rs"

[features]
hyperlight = ["mxc-internal/hyperlight"]
microvm = ["mxc-internal/microvm"]

[dependencies]
mxc-internal.workspace = true
anyhow.workspace = true
clap.workspace = true

[build-dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
cc = "1"
winresource.workspace = true
