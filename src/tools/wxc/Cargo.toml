[package]
name = "wxc"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wxc-exec"
path = "src/main.rs"

[dependencies]
mxc-internal.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
windows.workspace = true

[target.'cfg(windows)'.dependencies]
chrono.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
cc = "1"
winresource.workspace = true

[build-dependencies]
serde.workspace = true
serde_json.workspace = true

[features]
default = []
test-support = ["mxc-internal/test-support"]
microvm = ["mxc-internal/microvm"]
wslc = ["mxc-internal/wslc"]
hyperlight = ["mxc-internal/hyperlight"]
isolation_session = ["mxc-internal/isolation_session"]
